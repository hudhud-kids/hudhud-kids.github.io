}

/* =============== WEEKLY REPORT FOR THE GUARDIAN =============== */
function weekReport(k, end = Date.now()){
  const start = end - 7*DAY, pstart = start - 7*DAY, inR = (t, a, b) => t >= a && t < b, now = Date.now();
  const sched = slotsFor(k, new Date(end)).filter(s => inR(s.t.getTime(), start, end) && (s.t.getTime() + OPEN_AFTER*60e3 < now || DB.attendance.some(a => a.kid === k && a.slot === s.key))).length;
  const att = DB.attendance.filter(a => a.kid === k && inR(Date.parse(a.at), start, end)).length;
  const reps = DB.reports.filter(r => r.kid === k && inR(Date.parse(r.at), start, end)), prev = DB.reports.filter(r => r.kid === k && inR(Date.parse(r.at), pstart, start));
  const avg = a => a.length ? Math.round(a.reduce((s, r) => s + (r.score || 0), 0) / a.length) : null;
  const tk = reps.filter(r => r.talkPct != null), cnt = {};
  reps.forEach(r => (r.mistakes || []).forEach(m => { const key = String(m.right || '').trim(); if(!key) return; cnt[key] = cnt[key] || {wrong:m.wrong, right:key, n:0}; cnt[key].n++; }));
  return {start, end, sched:Math.max(sched, att), att, lessons:reps.length, avg:avg(reps), prevAvg:avg(prev), talk:tk.length ? Math.round(tk.reduce((s, r) => s + r.talkPct, 0) / tk.length) : null,
    xp:xpSince(k, start) - xpSince(k, end), words:new Set(reps.flatMap(r => r.newWords || [])).size, top:Object.values(cnt).sort((a, b) => b.n - a.n).slice(0, 3)};
}
function weekReportHTML(k){
  const w = weekReport(k), d = w.avg != null && w.prevAvg != null ? w.avg - w.prevAvg : null, fd = t => new Date(t).toLocaleDateString(LOC, {day:'numeric', month:'short'});
  return `<div class="small muted" style="margin:-4px 0 8px">من ${fd(w.start)} إلى ${fd(w.end - 1)} · يوصلك ملخصه كإشعار كل خميس الساعة 8 مساءً</div>
    <div class="stat"><div><span class="small muted">الحضور</span><b style="color:${w.att >= w.sched ? 'var(--good)' : 'var(--bad)'}">${w.att} من ${w.sched}</b></div>
      <div><span class="small muted">معدل الحصص</span><b>${w.avg == null ? '—' : w.avg + '%'}${d == null ? '' : ` <span class="small" style="color:${d >= 0 ? 'var(--good)' : 'var(--bad)'}">${d >= 0 ? '▲' : '▼'}${Math.abs(d)}</span>`}</b></div>
      <div><span class="small muted">نسبة كلماته</span><b>${w.talk == null ? '—' : w.talk + '%'}</b></div><div><span class="small muted">نقاط الأسبوع</span><b>${w.xp}</b></div></div>
    <h3 style="margin:12px 0 6px;font-size:1rem">🔁 أكثر 3 أخطاء تكررت</h3>
    ${w.top.length ? `<div class="wtop">${w.top.map(m => `<div class="wtm"><span class="chip">×${m.n}</span><div>${m.wrong ? `<div class="en small muted"><s>${esc(m.wrong)}</s></div>` : ''}<div class="en"><b>${esc(m.right)}</b></div></div></div>`).join('')}</div>
      <p class="small muted" style="margin:6px 0 0">هذي الجمل تنضاف تلقائياً لبطاقات المراجعة عنده.</p>` : `<p class="small muted" style="margin:0">${w.lessons ? 'ما تكررت أخطاء هذا الأسبوع 👏' : 'ما فيه حصص هذا الأسبوع بعد.'}</p>`}`;
}

/* =============== SIBLINGS CHALLENGE (weekly, Sunday -> Saturday) =============== */
const SIB_PRIZE = 80;
function sibOn(){ return kidIds().filter(x => DB.kids[x] && !DB.kids[x].needPlace).length >= 2; }
function sibScores(ws, we){ return kidIds().filter(x => DB.kids[x] && !DB.kids[x].needPlace).map(x => ({k:x, xp:xpSince(x, ws) - xpSince(x, we)})).sort((a, b) => b.xp - a.xp); }
function settleSib(k){
  if(!sibOn()) return; const p = DB.progress[k], ws = weekStart().getTime(), prevWs = ws - 7*DAY; p.sib = p.sib || {};
  if(p.sib[prevWs] != null || !(p.xpLog || []).some(x => x[0] < ws)) return;
  const sc = sibScores(prevWs, ws), top = sc[0] ? sc[0].xp : 0, me = sc.find(x => x.k === k);
  if(!me || top <= 0){ p.sib[prevWs] = {won:false, xp:me ? me.xp : 0}; save(); return; }
  const won = me.xp === top, winners = sc.filter(x => x.xp === top).map(x => x.k);
  p.sib[prevWs] = {won, xp:me.xp, winners};
  if(won){ const r = roomOf(k), tr = ITEMS.find(x => x.x && !r.owned.includes(x.id));
    if(tr){ r.owned.push(tr.id); if(!r.deco.includes(tr.id)) r.deco = r.deco.concat(tr.id).slice(-6); }
    p.xp = (p.xp || 0) + SIB_PRIZE; p.sibWins = (p.sibWins || 0) + 1; save();
    setTimeout(() => { if(document.querySelector('.ov')) return; const ov = overlay(`<div class="bigbird">${hoopoeSVG('cheer')}</div><h2 style="text-align:center">🏆 فزت بتحدي الإخوان!</h2>
      <p style="margin:0;text-align:center">جمعت <b>${me.xp}</b> نقطة الأسبوع الماضي${winners.length > 1 ? ' (تعادل)' : ''}.</p>
      <div class="chips" style="justify-content:center">${tr ? `<span class="chip good">${tr.e} ${esc(tr.name)} انضافت لغرفتك</span>` : ''}<span class="chip good">+${SIB_PRIZE} نقطة</span></div>
      <button class="btn primary big" id="sbok">رائع!</button>`); try{ SFX.running() && SFX.sparkle(0); }catch(e){} ov.querySelector('#sbok').onclick = () => ov.remove(); }, 900);
  } else { save(); const wn = winners.map(x => nick(x)).join(' و '); setTimeout(() => hoopoeSays(`فاز ${wn} بتحدي الإخوان الأسبوع الماضي. هالأسبوع فرصتك 💪`, 'think', 4200), 1200); }
}
function sibCard(k){
  if(!sibOn()) return '';
  const ws = weekStart().getTime(), we = ws + 7*DAY, sc = sibScores(ws, Date.now() + 1), top = Math.max(1, ...sc.map(x => x.xp)), left = Math.max(1, Math.ceil((we - Date.now()) / DAY));
  const last = (DB.progress[k].sib || {})[ws - 7*DAY];
  return `<section class="card sibc"><div class="chips" style="justify-content:space-between"><h2>⚔️ تحدي الإخوان</h2><span class="chip brand">باقي ${left} ${left === 1 ? 'يوم' : left <= 10 ? 'أيام' : 'يوم'}</span></div>
    <div class="sibs">${sc.map((x, i) => { const a = roomAvatar(x.k), w = DB.progress[x.k].sibWins || 0;
      return `<div class="sibr ${x.k === k ? 'me' : ''}"><span class="sibav">${a.hat ? `<i>${a.hat}</i>` : ''}${a.char}</span><div class="sibm"><div class="chips" style="justify-content:space-between"><b>${esc(nick(x.k))}${i === 0 && x.xp > 0 ? ' 👑' : ''}</b><span class="num"><b>${x.xp}</b> <span class="small muted">نقطة</span></span></div>
        <div class="sibbar"><i style="width:${Math.round(x.xp / top * 100)}%"></i></div><div class="small muted">🏆 فاز ${w} ${w === 1 ? 'مرة' : 'مرات'} · <span class="en">Level ${DB.kids[x.k].level}</span></div></div></div>`; }).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">كل واحد يتدرّب على مستواه، والنقاط من الحصص والواجب والألعاب. ينتهي التحدي ليلة السبت، والفائز ياخذ كأس حصري لغرفته + ${SIB_PRIZE} نقطة.${last ? (last.won ? ' · 🏆 فزت الأسبوع الماضي!' : last.winners ? ` · الأسبوع الماضي فاز ${last.winners.map(x => nick(x)).join(' و ')}` : '') : ''}</p></section>`;
}

/* =============== SIGN-UP REQUESTS (public join link → admin accepts / rejects) =============== */
let SIGNUPS = null, SIGNUPS_AT = 0;
const joinLink = () => location.origin + location.pathname.replace(/[^/]*$/, '') + 'join/';
const suOn = () => cloudOn() && !!CLOUD.token && CLOUD.role === 'parent';
async function loadSignups(force){
  if(!suOn()) return null;
  if(!force && SIGNUPS && Date.now() - SIGNUPS_AT < 20000) return SIGNUPS;
  try{ SIGNUPS = (await rpc('tk_signups_list', {t:CLOUD.token})) || []; SIGNUPS_AT = Date.now(); }catch(e){ console.warn('signups', e); }
  return SIGNUPS;
}
function signupsCardHTML(){
  if(!suOn()) return '';
  return `<section class="card sucard" id="suCard"><div class="chips" style="justify-content:space-between;align-items:center"><h2>📥 طلبات التسجيل <span class="chip brand" id="suN" hidden></span></h2>
    <div class="chips"><button class="btn sm" id="suCopy">🔗 نسخ رابط التسجيل</button><button class="btn sm ghost" id="suRe" aria-label="تحديث">↻</button></div></div>
    <div class="small muted" style="margin:4px 0 10px">أرسل الرابط لأي شخص يبي يسجّل: <span class="en" style="direction:ltr;unicode-bidi:isolate">${esc(joinLink())}</span></div>
    <div id="suList" class="small muted">جاري التحميل…</div></section>`;
}
const RELMAP = {'الأب':'بابا','الأم':'ماما','الجد':'جدو','الجدة':'تيتا','العم / العمة':'عمو','الخال / الخالة':'خالو'};
const suAccepted = s => { try{ return JSON.parse(s.kid || '{}') || {}; }catch(e){ return {}; } };
function suAge(b){ const a = ageOf(b); return isFinite(a) ? a + (a >= 3 && a <= 10 ? ' سنوات' : ' سنة') : ''; }
function suItemHTML(s){
  const d = (s.data && typeof s.data === 'object') ? s.data : {}, kids = (Array.isArray(d.kids) ? d.kids : []).filter(x => x && typeof x === 'object'), acc = suAccepted(s), st = s.status;
  const wa = String(d.phone || '').replace(/^0/, '966').replace(/[^\d]/g, '');
  const when = new Date(s.at), dayNames = (Array.isArray(d.days) ? d.days : []).map(i => DAYS_AR[i]).filter(Boolean).join('، ');
  return `<div class="suitem ${st}">
    <div class="suhead"><div><b style="font-size:1.05rem">${esc(d.g_name || '')}</b> <span class="small muted">${esc(d.rel || '')}${d.city ? ' · ' + esc(d.city) : ''}</span></div>
      <span class="chip ${st === 'pending' ? 'brand' : st === 'accepted' ? 'good' : ''}">${st === 'pending' ? 'بانتظار القرار' : st === 'accepted' ? '✓ مقبول' : 'مرفوض'}</span></div>
    <div class="chips" style="margin:6px 0"><a class="btn sm" href="tel:${esc(d.phone || '')}">📞 <span class="en">${esc(d.phone || '')}</span></a>${wa ? `<a class="btn sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 واتساب</a>` : ''}${d.email ? `<a class="btn sm" href="mailto:${esc(d.email)}">✉️ <span class="en">${esc(d.email)}</span></a>` : ''}</div>
    <div class="small muted">${when.toLocaleDateString(LOC)} · ${fmtTime(when)}${d.device ? ' · الجهاز: ' + esc(d.device) : ''}${dayNames ? ' · الأيام: ' + esc(dayNames) : ''}${d.time ? ' · الوقت: ' + esc(d.time) : ''}</div>
    ${d.notes ? `<div class="sunote">📝 ${esc(d.notes)}</div>` : ''}
    <div class="sukids">${kids.map((k, i) => `<div class="sukid"><span class="sukav">${k.boy ? '👦' : '👧'}</span><div style="min-width:0;flex:1"><b>${esc(k.ar || '')}</b>${k.en ? ` <span class="en small muted">${esc(k.en)}</span>` : ''}
        <div class="small muted">${k.boy ? 'ولد' : 'بنت'} · ${esc(suAge(k.birth))}${k.grade ? ' · ' + esc(k.grade) : ''}${k.eng ? ' · ' + esc(k.eng) : ''}</div></div>
        ${acc[i] ? `<span class="chip good">✓ حسابه: <span class="en">${esc((DB.kids[acc[i]] || {}).user || acc[i])}</span></span>` : st === 'rejected' ? '' : `<button class="btn sm primary" data-suacc="${s.id}" data-suk="${i}">✅ قبول وإنشاء حساب</button>`}</div>`).join('')}</div>
    <div class="chips" style="margin-top:8px">${st === 'pending' ? `<button class="btn sm danger" data-surej="${s.id}">❌ رفض الطلب</button>` : st === 'rejected' ? `<button class="btn sm" data-suback="${s.id}">↩︎ إرجاع للانتظار</button>` : ''}</div>
  </div>`;
}
async function fillSignups(force){
  const box = document.getElementById('suList'); if(!box) return;
  const list = await loadSignups(force); if(!document.getElementById('suList')) return;
  if(!list){ box.textContent = 'تعذّر تحميل الطلبات. تأكد من الاتصال.'; return; }
  const pend = list.filter(s => s.status === 'pending'), done = list.filter(s => s.status !== 'pending');
  const n = document.getElementById('suN'); if(n){ n.hidden = !pend.length; n.textContent = pend.length; }
  box.classList.remove('muted', 'small');
  box.innerHTML = (pend.length ? pend.map(suItemHTML).join('') : '<p class="small muted" style="margin:0">ما فيه طلبات جديدة.</p>')
    + (done.length ? `<details class="skills" style="margin-top:10px"><summary>الطلبات السابقة (${done.length})</summary>${done.map(suItemHTML).join('')}</details>` : '');
  box.querySelectorAll('[data-suacc]').forEach(b => b.onclick = () => suAccept(b.dataset.suacc, Number(b.dataset.suk)));
  box.querySelectorAll('[data-surej]').forEach(b => b.onclick = () => { const ov = overlay(`<h2>رفض الطلب؟</h2><p style="margin:0">ينتقل الطلب للطلبات السابقة، وتقدر ترجعه لاحقاً.</p><div class="chips"><button class="btn danger" id="y">رفض</button><button class="btn" id="n">رجوع</button></div>`);
    ov.querySelector('#n').onclick = () => ov.remove(); ov.querySelector('#y').onclick = async () => { ov.remove(); await suSet(b.dataset.surej, 'rejected'); }; });
  box.querySelectorAll('[data-suback]').forEach(b => b.onclick = () => suSet(b.dataset.suback, 'pending'));
}
async function suSet(id, st, kidMap){
  const s = (SIGNUPS || []).find(x => x.id === id); const kid = kidMap ? JSON.stringify(kidMap) : (s ? s.kid : null);
  try{ await rpc('tk_signup_set', {t:CLOUD.token, sid:id, st, kid}); if(s){ s.status = st; s.kid = kid; } toast(st === 'rejected' ? 'تم رفض الطلب' : st === 'accepted' ? '✓ تم قبول الطلب' : 'رجع الطلب للانتظار'); }
  catch(e){ toast('ما قدرت أحفظ القرار، حاول مرة ثانية'); }
  fillSignups(false);
}
function suAccept(id, i){
  const s = (SIGNUPS || []).find(x => x.id === id); if(!s) return; const d = s.data || {}, k = (Array.isArray(d.kids) ? d.kids : [])[i]; if(!k || typeof k !== 'object') return;
  kidForm(null, {ar:k.ar || '', en:k.en || '', birth:k.birth || '', boy:!!k.boy, days:Array.isArray(d.days) && d.days.length ? d.days.filter(x => Number.isInteger(x) && x >= 0 && x < 7) : null,
    g:{name:d.g_name || '', phone:d.phone || '', rel:RELMAP[d.rel] || '', first:/^(أم|ام|أبو|ابو)\s/.test(String(d.g_name || '').trim()) ? '' : (String(d.g_name || '').trim().split(/\s+/)[0] || '')},
    onDone: async kidId => { const acc = suAccepted(s); acc[i] = kidId; const all = (Array.isArray(d.kids) ? d.kids : []).every((_, x) => acc[x]); await suSet(id, all ? 'accepted' : 'pending', acc); } });
}
