<style>
/* One bright classroom look: warm orange brand, sky-blue teacher, white boards */
@font-face{font-family:"Dubai";src:url(fonts/dubai-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dubai";src:url(fonts/dubai-medium.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Dubai";src:url(fonts/dubai-bold.woff2) format("woff2");font-weight:700 900;font-display:swap}
:root{
  color-scheme: light;
  --brand:#FF6A00; --brand-ink:#B84A00; --brand-soft:#FFE8D6;
  --bg:#FFF7F0; --surface:#FFFFFF; --fg:#2B1B0F; --muted:#86695A; --line:#F0DCCB;
  --good:#15803D; --good-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --sky:#3B7BE8; --sky-soft:#E3EEFF; --gold:#E9A100;
  --font:"Dubai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --en:"Dubai",system-ui,-apple-system,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.ltr{direction:ltr;unicode-bidi:isolate}
.en{font-family:var(--en)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.logo{display:inline-flex;align-items:center;gap:6px;direction:ltr;font-family:var(--en);font-weight:800}
.logo .b{background:var(--brand);color:#fff;border-radius:12px 12px 12px 4px;padding:0 8px;font-size:1.3em;line-height:1.45}
.logo .t{color:var(--brand);font-size:1.35em}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.big{padding:14px 30px;font-size:1.15rem}
.btn.sm{padding:6px 14px;font-size:.9rem;min-height:36px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:16px}
.g2{display:grid;gap:16px;grid-template-columns:1.25fr 1fr}
.g2e{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:820px){.g2,.g2e{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:110px;direction:ltr;font-size:.8rem}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.ok{color:var(--good);font-weight:700}
.center{min-height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.panel{width:min(440px,100%);display:grid;gap:16px}
.panel .logo{font-size:1.9rem;justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 16px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--brand)}
.avatar.lg{width:100px;height:100px;font-size:2.2rem}
.hero{background:linear-gradient(135deg,#FF6A00,#FF9A3D);color:#fff;border:0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .eyebrow{font-size:.88rem;opacity:.92}
.hero h1{font-size:1.65rem;font-family:var(--en)}
.hero .btn{background:#fff;color:var(--brand-ink);border-color:#fff}
.count{font-size:2rem;font-weight:800;line-height:1.15}

.bal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bal .v{font-size:2.4rem;font-weight:800}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-block:10px}
.bar i{display:block;height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border-radius:99px;padding:4px 12px;font-weight:700;font-size:.9rem}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ledger{list-style:none;margin:12px 0 0;padding:0}
.ledger li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.amt{font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.amt.good{color:var(--good)} .amt.bad{color:var(--bad)}
.dots{display:flex;gap:8px;margin-block:10px}
.dots span{width:32px;height:32px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.dots span.on{background:var(--good);border:0;color:#fff}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:12px}
.book{border-radius:12px 4px 4px 12px;padding:14px 12px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-decoration:none;color:#fff}
.book .bt{font-weight:800;line-height:1.3;direction:ltr;text-align:left;font-family:var(--en)}
.book .ba{font-size:.8rem;opacity:.92}
.book.locked{background:var(--line)!important;color:var(--muted)}
.book.locked .bt{filter:blur(3px)}
.hist{display:grid;gap:10px;margin-top:10px}
.hist .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.stars{color:var(--gold);letter-spacing:2px;direction:ltr}

/* ===== classroom ===== */
.room{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 30% 20%,#FFF1E3,var(--bg) 60%)}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.rbar .ttl{flex:1;min-width:160px;font-weight:800;font-family:var(--en);direction:ltr;text-align:right}
.timer{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:4px 14px}
.timer.over{background:var(--bad-soft);color:var(--bad)}
.rbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,46%) 1fr;gap:0}
@media (max-width:780px){.rbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.stage{display:grid;place-items:center;padding:12px 16px;position:relative}
.tbox{position:relative;width:min(420px,100%);display:grid;justify-items:center}
@media (max-width:780px){.tbox{width:min(190px,52vw)}.stage{padding:6px 16px}.sub{font-size:1.2rem;min-height:70px}}
.tbox svg{width:100%;height:auto;display:block;overflow:visible}
.tname{font-family:var(--en);font-weight:800;color:var(--sky);margin-top:-6px}
.state{margin-top:4px;font-weight:700;font-size:.95rem;min-height:1.6em;color:var(--muted)}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:12px;overflow:auto}
.sub{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;direction:ltr;text-align:left;font-family:var(--en);font-size:1.45rem;font-weight:600;line-height:1.45;min-height:96px}
.sub .ar{direction:rtl;text-align:right;font-family:var(--font);font-size:1rem;color:var(--muted);font-weight:500;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.you{align-self:flex-end;max-width:90%;background:var(--brand);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;direction:ltr;text-align:left;font-family:var(--en);font-size:1.2rem;min-height:48px}
.you.live{background:var(--brand-soft);color:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.board{background:#22543D;color:#F5F5DC;border:6px solid #A0703C;border-radius:14px;padding:14px;text-align:center;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}

.board .emo{font-size:3rem;line-height:1.1}
.board .w{font-family:var(--en);font-size:2rem;font-weight:800;direction:ltr}
.board .ex{direction:ltr;font-style:italic;opacity:.9}
.fix{background:var(--surface);border:2px solid var(--good);border-radius:14px;padding:12px 14px}
.fix .wr{text-decoration:line-through;color:var(--bad);direction:ltr;text-align:left}
.fix .rt{color:var(--good);font-weight:800;direction:ltr;text-align:left;font-family:var(--en);font-size:1.15rem}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;background:var(--surface);border-top:1px solid var(--line)}
.micbig{width:76px;height:76px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(59,123,232,.35)}
.micbig svg{width:34px;height:34px}
.micbig.on{background:var(--bad);animation:pulse 1.1s infinite}

.typer{display:flex;gap:8px;width:100%;max-width:640px}
.typer .input{direction:ltr;text-align:left}
.hint{margin:0;padding:8px 12px;border-radius:12px;background:var(--sky-soft);font-size:.9rem}

/* teacher animation */
.t-head{transform-box:view-box;transform-origin:150px 250px;transition:transform .3s}
.speaking .t-head{animation:bob 1.6s ease-in-out infinite}
.listening .t-head{transform:rotate(-6deg)}
.thinking .t-head{transform:rotate(4deg)}
@keyframes bob{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-2.5deg) translateY(-2px)}75%{transform:rotate(2.5deg) translateY(1px)}}
.t-body{transform-box:view-box;transform-origin:150px 320px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.015)}}
.eyes-n{transform-box:view-box;transform-origin:150px 150px;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.pupils{transition:transform .25s}
.thinking .pupils{transform:translate(4px,-5px)}
.listening .pupils{transform:translate(-3px,1px)}
.eyes-h{display:none}
.m-happy .eyes-n,.m-laughing .eyes-n,.m-proud .eyes-n{display:none}
.m-happy .eyes-h,.m-laughing .eyes-h,.m-proud .eyes-h{display:inline}
.brows{transform-box:view-box;transition:transform .25s}
.m-surprised .brows,.m-excited .brows{transform:translateY(-7px)}
.m-thinking .brows{transform:translateY(-3px) rotate(-3deg)}
.m-encouraging .brows{transform:translateY(-2px)}
.mouth path{display:none}
.mouth .on{display:inline}
.ring{fill:none;stroke:var(--sky);stroke-width:5;opacity:0}
.listening .ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.6;r:120}100%{opacity:0;r:150}}
.think-dots{opacity:0;transition:opacity .2s}
.thinking .think-dots{opacity:1}
.think-dots circle{animation:dot 1s infinite}
.think-dots circle:nth-child(2){animation-delay:.15s}.think-dots circle:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-6px)}}
.burst{position:absolute;inset:0;pointer-events:none;overflow:visible}
.burst span{position:absolute;left:50%;top:40%;font-size:1.6rem;animation:fly 1.2s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.speaking .t-head,.t-body,.eyes-n,.listening .ring,.think-dots circle{animation:none}}

.ov{position:fixed;inset:0;background:rgba(43,27,15,.5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.ov .card{width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:14px}
.wordchips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.wordchips span{background:var(--sky-soft);color:var(--sky);border-radius:99px;padding:2px 10px;font-weight:700}
.gift{background:linear-gradient(135deg,#FFD25E,#FF9A3D);color:#3A2100;border-radius:var(--r);padding:14px;font-weight:800;text-align:center}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}

.stat div{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border-radius:99px;padding:4px 10px;font-size:.9rem}
.report{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.acc{width:100%;border-collapse:collapse}
.acc td,.acc th{padding:8px;border-top:1px solid var(--line);text-align:right}
.acc code{direction:ltr;unicode-bidi:isolate;background:var(--bg);padding:2px 8px;border-radius:6px;font-weight:700}
</style>

function fmtDur(ms){ const m = Math.max(0, Math.round(ms/60000)); if(m < 60) return `${m} دقيقة`; const h = Math.floor(m/60), d = Math.floor(h/24); if(d >= 1) return `${d} يوم و ${h%24} ساعة`; return `${h} ساعة و ${m%60} دقيقة`; }

/* =============== SCHEDULE + WALLET =============== */
function periodAt(t){ let p = DB.periods[0]; for(const q of DB.periods){ if(new Date(q.from) <= t) p = q; } return p; }
function slotsFor(k, until){
  const out = [], ps = DB.periods; const d = new Date(ps[0].from); d.setHours(0,0,0,0);
  while(d <= until){
    for(const p of ps){
      const s = p[k]; if(!s || !s.days.includes(d.getDay())) continue;
      const [h,m] = s.time.split(':').map(Number); const t = new Date(d); t.setHours(h,m,0,0);
      if(t <= until && t >= new Date(ps[0].from) && periodAt(t) === p) out.push(t);
    }
    d.setDate(d.getDate()+1);
  }
  return out.sort((a,b) => a-b);
}
function ledger(k){
  const now = new Date(), per = DB.perLesson, bal = DB.balance[k], maxLessons = Math.floor(bal/per);
  const all = slotsFor(k, new Date(now.getTime()+21*864e5));
  const att = new Set(DB.attendance.filter(a => a.kid === k).map(a => a.slot));
  const lv = DB.live[k];
  const rows = []; let open = null, next = null;
  for(const t of all){
    if(rows.length >= maxLessons) break;
    const key = keyOf(t);
    if(att.has(key)){ rows.push({t,key,st:'att'}); continue; }
    if(now - t > OPEN_AFTER*60e3){
      if(lv && lv.slot === key && now - new Date(lv.startedAt) < 60*60e3){ if(!open) open = {t,key,resumed:true}; }
      else rows.push({t,key,st:'miss'});
    } else if(now >= t - OPEN_BEFORE*60e3){ if(!open) open = {t,key}; }
    else if(!next) next = {t,key};
  }
  const attended = rows.filter(r => r.st==='att').length, missed = rows.length - attended;
  let run = 0, gifts = 0; for(const r of rows){ if(r.st==='att'){ run++; if(run%5===0) gifts++; } else run = 0; }
  return {rows, open, next, attended, missed, green:attended*per, red:missed*per, remaining:bal-rows.length*per, bal, run, gifts, ended: rows.length >= maxLessons};
}

function apiHeaders(){ return {'content-type':'application/json','x-api-key':DB.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}; }
async function* streamClaude(body, signal){
  if(DEMO || DB.apiKey === 'demo'){ yield* demoStream(body); return; }
  const r = await fetch(API,{method:'POST',headers:apiHeaders(),body:JSON.stringify(Object.assign({}, body, {stream:true})),signal});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw {status:r.status, body:t}; }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  while(true){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let i; while((i = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0,i); buf = buf.slice(i+2);
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data:')) continue; const d = line.slice(5).trim(); if(!d) continue;
        let j; try{ j = JSON.parse(d); }catch(e){ continue; }
        if(j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') yield j.delta.text;
        else if(j.type === 'error') throw {status:500, body:JSON.stringify(j.error||{})};
      }
    }
  }
}
async function callClaude(body){
  if(DEMO || DB.apiKey === 'demo') return demoReport();
  const r = await fetch(API,{method:'POST',headers:apiHeaders(),body:JSON.stringify(body)});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw {status:r.status, body:t}; }
  const j = await r.json(); return (j.content||[]).filter(c => c.type === 'text').map(c => c.text).join('');
}

/* =============== LESSON =============== */
let L = null;
function buildRules(k, plan){
  const kid = DB.kids[k], prog = DB.progress[k], age = ageOf(kid.birth), nk = nick(k);
  const mist = (prog.mistakes||[]).slice(0,6).map(m => `"${m.wrong}" -> "${m.right}"`).join('; ') || 'none yet';
  const words = (prog.words||[]).slice(0,15).join(', ') || 'none yet';
  const lvl = kid.level <= 6
    ? 'Use simple, clear English (CEFR A1-A2): short sentences, everyday words, lots of warmth and praise. Ask ONE question at a time.'
    : 'Use natural CEFR A2-B1 English. Push for longer answers with reasons and examples. Ask interesting follow-up questions like a real conversation partner.';
  return `You are Teacher Noor, a real-feeling, warm, funny and energetic English teacher giving a LIVE one-to-one VOICE class (like 51Talk) to a Saudi child on an iPad. Everything you write in the spoken part is read aloud by a text-to-speech voice, and the child answers by speaking (speech-to-text).

STUDENT: ${kid.en}, nickname "${nk}", ${age} years old, ${kid.boy ? 'boy' : 'girl'}, 51Talk level ${kid.level} (about CEFR ${kid.cefr || (kid.level<=6?'A1-A2':'A2-B1')}). First language Arabic.
TODAY: Lesson ${plan.n} "${plan.t}". Language to weave in: ${plan.g}. Useful words: ${plan.w}.${plan.round>1?' (Second round of this topic: go deeper with new related words.)':''}
Focus from the last lesson report: ${prog.focus || 'none yet'}.
Recent mistakes to recycle naturally: ${mist}.
Words from recent lessons: ${words}.

THE MOST IMPORTANT THING: a REAL CONVERSATION. Not word drills, not lists. Talk WITH the child like a real teacher who is genuinely curious about their life, opinions and imagination. The child should speak much more than you.
How the 25 minutes flow (each student message starts with [minute X]):
- chat (0-4): warm greeting by nickname, real small talk about their day.
- topic (4-20): a natural conversation about today's topic. Bring today's words and grammar INTO the conversation (stories, "imagine you are...", role-plays like shop/restaurant/interview, opinions, "what would you do if..."). When a new word appears, put it on the board once and keep chatting.
- game (20-23): a quick fun speaking challenge (guess the word, finish my story, 20 questions...).
- wrapup (23-25): specific praise, 1-2 things learned, goodbye, then [END].

HOW TO TALK:
- ${lvl}
- Spoken part: 1 to 3 short, natural sentences, like real speech (contractions, "Wow!", "Hmm", "Oh really?", laughter words). Always finish with a question or a clear invitation to speak.
- React to WHAT the child said (content first), like a real person, then continue.
- Correct mistakes the way great teachers do: first react to the meaning, then recast the correct sentence naturally, and about half the time ask them to say it again. One correction at a time, never a list. Also add a [FIX] tag.
- The child's words come from speech recognition: ignore punctuation/capitals. If a word looks like a mishearing of an English word, it is probably a pronunciation problem: say the word slowly with syllables (e.g. "gi-RAFFE") and ask them to try again.
- If the child is silent, stuck, or speaks Arabic, help with an easier question, offer two choices, or give a tiny Arabic hint in [AR]. Never long Arabic.
- If you get "(student was silent)", gently encourage: rephrase more simply.
- Stay on English learning. Never ask for personal details (address, phone, school name, passwords, photos). If off-topic, kindly bring them back.
- Never say you are an AI unless asked directly; you are Teacher Noor.

FORMAT (strict):
Line 1 starts with a mood tag, then the spoken text: [MOOD:happy|excited|proud|laughing|surprised|thinking|encouraging] spoken text...
After the spoken text, optional tags each on its own line:
[BOARD:word|one emoji|Arabic meaning|short example sentence]
[FIX:what the child said wrong|correct version|very short Arabic explanation]
[AR:very short Arabic hint]
[STAGE:chat|topic|game|wrapup]
[END]  (only in wrapup, after minute 23)
No markdown, no emojis in the spoken text, no other text outside this format.`;
}
const elapsedMin = () => L ? Math.floor((Date.now()-L.startedAt.getTime())/60000) : 0;

function startLesson(k, trial){
  unlockAudio();
  const led = ledger(k);
  if(!trial && (!led.open || led.ended)) return go(k);
  if(!DB.apiKey && !DEMO){ alertBox('المعلمة غير مفعّلة بعد. اطلب من ولي الأمر إضافة مفتاح التشغيل من لوحته.'); return; }
  const n = DB.progress[k].lessonNo, plan = lessonPlan(k, n);
  let startedAt = new Date();
  if(!trial && led.open.resumed && DB.live[k] && DB.live[k].startedAt) startedAt = new Date(DB.live[k].startedAt);
  L = {kid:k, trial, slot:trial?null:led.open.key, n, plan, history:[], startedAt, state:'idle', mood:'happy', done:false, endSeen:false, ctl:null,
       queue:[], speaking:false, streamDone:true, lastSay:'', rec:null, listenStart:0, nudgeT:null, silT:null, mouthT:null, giftsBefore:led.gifts, typing:false};
  if(!trial){ DB.live[k] = {slot:L.slot, startedAt:startedAt.toISOString()}; save(); }
  L.rules = buildRules(k, plan);
  demoN = 0;
  renderRoom();
  L.tick = setInterval(tickRoom, 1000); tickRoom();
  teacherTurn(L.history.length ? '(The student came back to the class. Welcome them back and continue.)' : '(The student just joined the class. Greet them warmly by nickname and start chatting.)');
}

    <div class="rbody">

      <p class="hint" id="micHint" ${micOK?'hidden':''}>إذا ما اشتغل الميكروفون: اضغط «كتابة» ثم ميكروفون الكيبورد وتكلم.</p>
    </div></div>`;
  $('#exit').onclick = confirmExit;
  $('#rep').onclick = () => { if(L.lastSay){ interrupt(false); sayAll(L.lastSay, true); } };

  $('#kb').onclick = () => { const t = $('#typer'); t.hidden = !t.hidden; if(!t.hidden){ stopListening(); $('#msg').focus(); } };
  $('#typer').addEventListener('submit', e => { e.preventDefault(); const v = $('#msg').value.trim(); if(!v) return; $('#msg').value = ''; studentSaid(v); });
  $('#wrap').onclick = () => { interrupt(false); teacherTurn('(Time is up. Do the wrapup now: specific praise, what we learned, goodbye, and add [END].)'); };

function tickRoom(){ if(!L) return; const s = Math.floor((Date.now()-L.startedAt.getTime())/1000), t = $('#timer');
  if(t){ t.textContent = `${pad(Math.floor(s/60))}:${pad(s%60)} / 25:00`; t.classList.toggle('over', s > LESSON_MIN*60); }
  const w = $('#wrap'); if(w) w.hidden = !(s >= 24*60 && !L.done); }

const STATE_TXT = {idle:'', thinking:'المعلمة تفكر…', speaking:'المعلمة تتكلم · اضغط عليها لتقاطعها', listening:'دورك! تكلم بالإنجليزي 🎤', tap:'اضغط الميكروفون وتكلم'};
function setState(s){ if(!L) return; L.state = s; const b = $('#tbox'); if(!b) return;
  b.classList.toggle('speaking', s==='speaking'); b.classList.toggle('listening', s==='listening'); b.classList.toggle('thinking', s==='thinking');
  $('#state').textContent = STATE_TXT[s] || '';
  const m = $('#mic'); if(m){ m.classList.toggle('on', s==='listening'); m.classList.toggle('wait', s==='thinking'||s==='speaking'); }
  if(s === 'speaking') startMouth(); else { stopMouth(); setMouth(L.mood==='surprised'?'o':(L.mood==='laughing'||L.mood==='excited')?'grin':'smile'); } }
function setMood(m){ if(!L) return; const ok = ['happy','excited','proud','laughing','surprised','thinking','encouraging']; m = ok.includes(m) ? m : 'happy'; L.mood = m;
  const b = $('#tbox'); if(!b) return; ok.forEach(x => b.classList.toggle('m-'+x, x === m)); if(m === 'proud' || m === 'excited') burst(); }
function setMouth(n){ document.querySelectorAll('.mouth path').forEach(p => p.classList.toggle('on', p.dataset.m === n)); }
function startMouth(){ stopMouth(); const seq = ['a','e','o','smile','a','e','flat','o']; let i = 0;
  L.mouthT = setInterval(() => { i = (i + 1 + Math.floor(Math.random()*3)) % seq.length; setMouth(seq[i]); }, 110); }
function stopMouth(){ if(L && L.mouthT){ clearInterval(L.mouthT); L.mouthT = null; } }
function burst(){ const b = $('#burst'); if(!b) return; b.innerHTML = ''; const em = ['⭐','✨','🌟','👏'];
  for(let i=0;i<10;i++){ const s = document.createElement('span'); s.textContent = em[i%em.length]; const a = Math.random()*Math.PI*2, d = 90+Math.random()*80;
    s.style.setProperty('--x', Math.cos(a)*d+'px'); s.style.setProperty('--y', Math.sin(a)*d+'px'); b.appendChild(s); }
  setTimeout(() => { if(b) b.innerHTML = ''; }, 1300); }

/* ---- speaking queue ---- */
function enqueue(s){ s = s.replace(/\s+/g,' ').trim(); if(!s) return; L.queue.push(s); pump(); }
function pump(){
  if(!L) return;
  if(L.speaking) return;
  if(!L.queue.length){ if(L.streamDone) teacherFinished(); return; }
  const s = L.queue.shift(); L.speaking = true; setState('speaking');
  speakOne(s, false, () => { if(!L) return; L.speaking = false; pump(); });
}
function speakOne(text, slow, done){
  let finished = false; const fin = () => { if(finished) return; finished = true; clearTimeout(guard); done && done(); };
  const words = text.split(/\s+/).length; const guard = setTimeout(fin, (slow?700:420)*words + 2500);
  if(!('speechSynthesis' in window)){ setTimeout(fin, 300*words); return; }
  try{ const u = new SpeechSynthesisUtterance(text); if(voice) u.voice = voice; u.lang = 'en-US';
    u.rate = slow ? 0.7 : (DB.kids[L.kid].level <= 6 ? 0.88 : 0.96); u.pitch = 1.08;
    u.onend = fin; u.onerror = fin; speechSynthesis.speak(u); }catch(e){ fin(); }
}
function sayAll(text, slow){ L.queue = []; L.streamDone = true; L.speaking = true; setState('speaking'); speakOne(text, slow, () => { if(!L) return; L.speaking = false; teacherFinished(); }); }
function interrupt(listenAfter){
  if(!L) return;
  if(L.ctl){ try{ L.ctl.abort(); }catch(e){} L.ctl = null; }
  L.queue = []; L.streamDone = true; L.speaking = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(listenAfter) startListening(true); else setState('idle');
}

/* ---- teacher turn (streaming) ---- */
function parseTags(full){
  const out = {mood:null, board:null, fix:null, ar:'', stage:null, end:false};
  const m = full.match(/^\s*\[MOOD:([a-z]+)\]/i); if(m) out.mood = m[1].toLowerCase();
  const re = /\[(BOARD|FIX|AR|STAGE|END)(?::([^\]]*))?\]/gi; let x;
  while((x = re.exec(full))){ const tag = x[1].toUpperCase(), v = (x[2]||'').trim(), p = v.split('|').map(s => s.trim());
    if(tag === 'BOARD') out.board = {word:p[0], emoji:p[1]||'', ar:p[2]||'', example:p[3]||''};
    else if(tag === 'FIX') out.fix = {wrong:p[0]||'', right:p[1]||'', tip:p[2]||''};
    else if(tag === 'AR') out.ar = v; else if(tag === 'STAGE') out.stage = v.toLowerCase(); else if(tag === 'END') out.end = true; }
  return out;
}
function spokenOf(full){ let s = full.replace(/^\s*\[MOOD:[a-z]*\]?/i,''); const i = s.search(/\[(BOARD|FIX|AR|STAGE|END)|\n\s*\[/i); if(i >= 0) s = s.slice(0,i); s = s.replace(/\[[^\]]*$/,''); return s; }
function cleanForHistory(full){ return full.trim() || '[MOOD:happy] ...'; }

async function teacherTurn(userText){
  if(!L || L.done) return;
  stopListening();
  const lesson = L, m = elapsedMin();
  lesson.history.push({role:'user', content:`[minute ${m}] ${userText}`});
  setState('thinking');
  const msgs = lesson.history.slice(-40); while(msgs.length && msgs[0].role !== 'user') msgs.shift();
  const apiMsgs = msgs.map((x,i) => i === msgs.length-1 ? {role:x.role, content:[{type:'text', text:x.content, cache_control:{type:'ephemeral'}}]} : {role:x.role, content:x.content});
  lesson.ctl = new AbortController(); lesson.streamDone = false; lesson.queue = [];
  let full = '', sent = 0, moodSet = false;
  const sub = $('#sub');
  try{
    for await (const t of streamClaude({model:LIVE_MODEL, max_tokens:400, system:[{type:'text', text:lesson.rules, cache_control:{type:'ephemeral'}}], messages:apiMsgs}, lesson.ctl.signal)){
      if(L !== lesson) return;
      full += t;
      if(!moodSet){ const mm = full.match(/^\s*\[MOOD:([a-z]+)\]/i); if(mm){ moodSet = true; setMood(mm[1].toLowerCase()); } else if(full.length > 20 && !/^\s*\[/.test(full)) moodSet = true; }
      if(!moodSet) continue;
      const spoken = spokenOf(full);
      if(sub) sub.innerHTML = esc(spoken);
      const rest = spoken.slice(sent); const mm2 = rest.match(/^[\s\S]*[.!?](?=\s)/);
      if(mm2){ enqueue(mm2[0]); sent += mm2[0].length; }
    }
    if(L !== lesson) return;
    const spokenRaw = spokenOf(full); const rest = spokenRaw.slice(sent); if(rest.trim()) enqueue(rest);
    const spoken = spokenRaw.trim();
    const tags = parseTags(full);
    if(!moodSet && tags.mood) setMood(tags.mood);
    lesson.lastSay = spoken;
    lesson.history.push({role:'assistant', content:cleanForHistory(full)});
    if(sub) sub.innerHTML = esc(spoken) + (tags.ar ? `<div class="ar">${esc(tags.ar)}</div>` : '');
    if(tags.board && tags.board.word) showBoard(tags.board);
    showFix(tags.fix);
    if(tags.end && (lesson.trial || elapsedMin() >= MIN_MINUTES)) lesson.endSeen = true;
    lesson.ctl = null; lesson.streamDone = true; pump();
  }catch(e){
    if(L !== lesson) return;
    lesson.ctl = null; lesson.streamDone = true; lesson.history.pop();
    if(e && e.name === 'AbortError') return;
    let msg = 'انقطع الاتصال بالمعلمة. تأكد من الإنترنت ثم اضغط «حاول مرة ثانية».';
    if(e && e.status === 401) msg = 'مفتاح التشغيل غير صحيح. اطلب من ولي الأمر تحديثه من لوحته.';
    else if(e && (e.status === 429 || e.status === 529)) msg = 'الخدمة مزدحمة الآن. انتظر لحظة ثم اضغط «حاول مرة ثانية».';
    else if(e && e.status === 400 && /credit|billing|limit/i.test(e.body||'')) msg = 'رصيد التشغيل انتهى أو وصل للحد الشهري. أخبر ولي الأمر.';
    setState('idle');
    if(sub){ sub.innerHTML = `<div class="ar">${msg}</div><div style="text-align:right;margin-top:8px"><button class="btn sm" id="retry" type="button">حاول مرة ثانية</button></div>`;
      $('#retry').onclick = () => teacherTurn(userText); }
    console.warn(e);
  }
}
function teacherFinished(){
  if(!L) return;
  if(L.endSeen){ finishLesson(); return; }
  if(L.state === 'listening') return;
  if($('#typer') && !$('#typer').hidden){ setState('idle'); return; }
  startListening(false);
}
function showBoard(b){ const el = $('#boardBox'); if(!el) return;
  el.innerHTML = `<div class="board"><button id="bw" aria-label="اسمع الكلمة"><div class="emo">${esc(b.emoji)}</div><div class="w">${esc(b.word)}</div></button>${b.ar?`<div style="font-weight:700">${esc(b.ar)}</div>`:''}${b.example?`<div class="ex">${esc(b.example)}</div>`:''}<div class="small" style="opacity:.8">اضغط الكلمة لتسمعها ببطء</div></div>`;
  $('#bw').onclick = () => { interrupt(false); L.speaking = true; setState('speaking'); speakOne(b.word, true, () => { if(!L) return; L.speaking = false; teacherFinished(); }); }; }
function showFix(f){ const el = $('#fixBox'); if(!el) return; if(!f || !f.right){ return; }
  el.innerHTML = `<div class="fix"><div class="small" style="font-weight:800">انتبه للتصحيح</div><div class="wr en">${esc(f.wrong)}</div><div class="rt">${esc(f.right)}</div>${f.tip?`<div class="small">${esc(f.tip)}</div>`:''}</div>`; }

/* ---- listening ---- */
function onMicTap(){
  if(!L || L.done) return;
  if(L.state === 'listening'){ stopListening(true); return; }
  interrupt(true);
}
function startListening(fromTap){
  if(!L || L.done) return;
  if(!SR || !micOK){ setState('tap'); const h = $('#micHint'); if(h) h.hidden = false; return; }
  stopListening();
  if(!L.listenStart) L.listenStart = Date.now();
  let text = '';
  const rec = new SR(); L.rec = rec; rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  const you = $('#you');
  rec.onresult = e => { let t = ''; for(const r of e.results) t += r[0].transcript; text = t;
    if(you){ you.hidden = false; you.classList.add('live'); you.textContent = t; }
    clearTimeout(L.silT); L.silT = setTimeout(() => { try{ rec.stop(); }catch(x){} }, SILENCE_MS); };
  rec.onerror = e => { if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ if(fromTap){ micOK = false; const h = $('#micHint'); if(h) h.hidden = false; } if(L && L.rec === rec){ L.rec = null; } setState('tap'); } };
  rec.onend = () => { if(!L || L.rec !== rec) return; L.rec = null; clearTimeout(L.silT);
    if(text.trim()){ L.listenStart = 0; clearTimeout(L.nudgeT); studentSaid(text.trim()); return; }
    if(L.state === 'listening'){ if(Date.now() - L.listenStart > NUDGE_MS){ L.listenStart = 0; teacherTurn('(student was silent)'); } else startListening(false); } };
  try{ rec.start(); setState('listening'); }catch(e){ L.rec = null; setState('tap'); }
  clearTimeout(L.nudgeT); L.nudgeT = setTimeout(() => { if(L && L.state === 'listening' && !text.trim()){ try{ rec.stop(); }catch(x){} } }, NUDGE_MS + 500);
}
function stopListening(submit){
  if(!L) return; clearTimeout(L.silT); clearTimeout(L.nudgeT);
  const r = L.rec; if(!r) return;
  if(submit){ try{ r.stop(); }catch(e){} return; }
  L.rec = null; try{ r.abort(); }catch(e){}
  if(L.state === 'listening') setState('idle');
}
function studentSaid(text){
  const you = $('#you'); if(you){ you.hidden = false; you.classList.remove('live'); you.textContent = text; }
  teacherTurn(`Student: ${text}`);
}

/* ---- finish ---- */
async function finishLesson(){
  const lesson = L; if(!lesson || lesson.done) return; lesson.done = true; stopListening(); setState('idle'); clearInterval(lesson.tick);
  const k = lesson.kid, mins = elapsedMin();
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="card" style="text-align:center"><h2>انتهت الحصة 🎉</h2><p class="muted" style="margin:0">المعلمة تكتب تقريرك…</p></div>`;
  document.body.appendChild(ov);
  const transcript = lesson.history.map(h => (h.role==='user' ? 'STUDENT ' : 'TEACHER: ') + h.content.replace(/\[(MOOD|STAGE|END)[^\]]*\]/gi,'').trim()).join('\n').slice(-40000);
  let rep = null;
  try{
    const txt = await callClaude({model:REPORT_MODEL, max_tokens:1500, messages:[{role:'user', content:
`You are an expert English teacher for Arab children. Assess this one-to-one speaking lesson.
Student: ${DB.kids[k].en}, ${ageOf(DB.kids[k].birth)} years old, level ${DB.kids[k].level}. Lesson: "${lesson.plan.t}" (${lesson.plan.g}).
Transcript (STUDENT lines are speech-to-text):
${transcript}

Reply with ONLY one JSON object:
{"score":0-100,"stars":1-3,"newWords":["words the student practised"],"mistakes":[{"wrong":"...","right":"..."}],"parentNote":"3-4 sentences in Arabic for the parent: what was covered, how well the child spoke, strengths, exactly what to practise at home","kidNote":"one short cheerful English sentence for the child","nextFocus":"one short line in English: what the next lesson should focus on for this child"}`}]});
    const a = txt.indexOf('{'), b = txt.lastIndexOf('}'); rep = JSON.parse(txt.slice(a, b+1));
  }catch(e){ console.warn(e); }
  if(!rep) rep = {score:0, stars:2, newWords:[], mistakes:[], parentNote:'لم يُكتب التقرير بسبب مشكلة اتصال، لكن الحصة سُجّلت.', kidNote:'Great job today!', nextFocus:''};
  const report = {score:Math.max(0,Math.min(100,Number(rep.score)||0)), stars:Math.max(1,Math.min(3,Number(rep.stars)||1)),
    newWords:(Array.isArray(rep.newWords)?rep.newWords:[]).slice(0,12).map(String), mistakes:(Array.isArray(rep.mistakes)?rep.mistakes:[]).slice(0,8).map(m => ({wrong:String(m.wrong||''), right:String(m.right||'')})),
    parentNote:String(rep.parentNote||''), kidNote:String(rep.kidNote||'Great job today!')};
  let book = null;
  if(!lesson.trial){
    const att = {kid:k, slot:lesson.slot, lessonNo:lesson.n, title:lesson.plan.t, at:new Date().toISOString(), minutes:mins};
    DB.attendance.push(att); DB.reports.push(Object.assign({}, att, report));
    const p = DB.progress[k]; p.lessonNo = (p.lessonNo||1)+1; p.mistakes = report.mistakes.concat(p.mistakes||[]).slice(0,12); p.words = report.newWords.concat(p.words||[]).slice(0,40); p.focus = String(rep.nextFocus||'');
    DB.live[k] = null; save();
    const g = ledger(k).gifts; if(g > lesson.giftsBefore) book = BOOKS[band(k)][g-1];
  }
  ov.innerHTML = `<div class="card"><div style="text-align:center"><div class="stars" style="font-size:2.3rem">${'★'.repeat(report.stars)}${'☆'.repeat(3-report.stars)}</div><h2>أحسنت! ${report.score}%</h2><p class="en" style="margin:.3em 0 0">${esc(report.kidNote)}</p></div>
    ${lesson.trial ? '<div class="chip brand" style="text-align:center">حصة تجريبية: لم تُحتسب في الرصيد</div>' : `<div class="chip good" style="text-align:center;font-size:1rem">✓ ${DB.perLesson} ريال صارت خضراء: استفدنا من الحصة</div>`}
    ${book ? `<div class="gift">🎁 هدية جديدة! فتحت كتاب: <span class="en">${esc(book[0])}</span></div>` : ''}
    ${report.newWords.length ? `<div><div style="font-weight:800">كلمات تدربت عليها</div><div class="wordchips">${report.newWords.map(w => `<span>${esc(w)}</span>`).join('')}</div></div>` : ''}
    ${report.mistakes.length ? `<div><div style="font-weight:800">انتبه لهذه</div>${report.mistakes.map(m => `<div class="ltr small" style="text-align:left"><s class="muted">${esc(m.wrong)}</s> → <b style="color:var(--good)">${esc(m.right)}</b></div>`).join('')}</div>` : ''}
    <button class="btn primary big" id="back">رجوع للرئيسية</button></div>`;
  $('#back').onclick = () => { ov.remove(); leaveRoom(); };
}
function leaveRoom(){ if(L){ clearInterval(L.tick); interrupt(false); stopListening(); stopMouth(); } const k = L ? L.kid : null; L = null; go(WHO === 'parent' ? 'parent' : k); }
function confirmExit(){
  const counts = !L.trial && !L.done;
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="card"><h2>تبي تطلع من الحصة؟</h2><p style="margin:0">${counts ? `إذا طلعت الآن لن تُحتسب الحصة. تقدر ترجع وتكمل خلال وقت الحصة، وإذا ما رجعت تصير الـ ${DB.perLesson} ريال حمراء.` : 'تقدر ترجع لاحقاً.'}</p><div class="chips"><button class="btn primary" id="stay">أكمل الحصة</button><button class="btn" id="leave">اطلع</button></div></div>`;
  document.body.appendChild(ov);
  $('#stay').onclick = () => ov.remove();
  $('#leave').onclick = () => { ov.remove(); leaveRoom(); };
}
function alertBox(msg){ const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="card"><p style="margin:0">${esc(msg)}</p><button class="btn primary" id="okb">حسناً</button></div>`; document.body.appendChild(ov); $('#okb').onclick = () => ov.remove(); }

/* =============== PARENT =============== */
function renderParent(){
  const now = new Date(), cur = periodAt(now) || DB.periods[DB.periods.length-1];
  const ids = kidIds();
  const kidCard = k => { const l = ledger(k), kid = DB.kids[k], reps = DB.reports.filter(r => r.kid === k).sort((a,b) => b.slot > a.slot ? 1 : -1).slice(0,5);
    const nxt = l.open ? 'الحصة مفتوحة الآن' : l.next ? `${fmtDay(l.next.t)} · ${fmtTime(l.next.t)}` : '—';
    return `<section class="card"><div style="display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center">${avatarHTML(k)}<div style="min-width:0"><h2>${esc(kid.ar)} <span class="muted small">(${esc(nick(k))}) · Level ${kid.level} · ${ageOf(kid.birth)} سنة</span></h2>
      <div class="small muted">الدرس ${DB.progress[k].lessonNo}: <span class="en">${esc(lessonPlan(k,DB.progress[k].lessonNo).t)}</span> · ${nxt}</div></div></div>
      <div class="stat"><div><span class="small muted">الرصيد المتبقي</span><b>${l.remaining}</b></div><div><span class="small muted">استفدنا</span><b style="color:var(--good)">${l.green}</b></div><div><span class="small muted">خسرنا</span><b style="color:var(--bad)">${l.red}</b></div><div><span class="small muted">حضور متتالي</span><b>${l.run}</b></div></div>
      <div class="chips" style="margin-top:12px"><button class="btn sm" data-trial="${k}">حصة تجريبية (لا تُحتسب)</button></div>
      <h3 style="margin-top:14px;font-size:1rem">تقارير المعلمة</h3>
      ${reps.length ? reps.map(r => `<div class="report"><div><b class="en">Lesson ${r.lessonNo} · ${esc(r.title)}</b> <span class="chip brand num">${r.score}%</span> <span class="small muted">${r.minutes||0} دقيقة</span></div><div class="small">${esc(r.parentNote)}</div>${(r.mistakes||[]).length?`<div class="small ltr" style="text-align:left">${r.mistakes.map(m => `<s class="muted">${esc(m.wrong)}</s> → ${esc(m.right)}`).join(' · ')}</div>`:''}</div>`).join('') : '<p class="small muted" style="margin:0">تظهر هنا ملاحظات المعلمة بعد كل حصة.</p>'}
    </section>`; };
  const sched = k => `<div class="field"><label>${esc(DB.kids[k].ar)}: الأيام والوقت</label><div class="days">${DAYS_AR.map((d,i) => `<label><input type="checkbox" id="d_${k}_${i}" ${cur[k].days.includes(i)?'checked':''}> ${d}</label>`).join('')}</div>
      <input class="input" type="time" id="t_${k}" value="${cur[k].time}" style="max-width:180px"><label for="b_${k}" class="small">مبلغ الاشتراك (ريال)</label><input class="input num" type="number" min="0" step="10" id="b_${k}" value="${DB.balance[k]}" style="max-width:180px"></div>`;
  const firstFuture = new Date(DB.periods[0].from) > now && DB.periods.length === 1;
  $('#app').innerHTML = `<div class="wrap">
    <div class="topbar">${LOGO}<div class="me"><b>لوحة ولي الأمر</b><button class="btn sm" id="out">خروج</button></div></div>
    <div class="grid">
      <section class="card grid" style="gap:10px"><h2>تشغيل المعلمة</h2>
        <p class="small muted" style="margin:0">${DB.apiKey ? '✅ مفتاح التشغيل محفوظ على هذا الجهاز فقط.' : '⚠️ الصق مفتاح التشغيل (يبدأ بـ sk-ant-) حتى تعمل المعلمة.'}</p>
        <div class="field"><label for="ak">مفتاح التشغيل</label><input class="input ltr" id="ak" type="password" autocomplete="off" placeholder="${DB.apiKey ? '•••••• محفوظ' : 'sk-ant-...'}"></div>
        <div class="chips"><button class="btn primary sm" id="saveKey">حفظ المفتاح</button><button class="btn sm" id="testKey">اختبار الاتصال</button><button class="btn sm" id="testVoice">اختبار الصوت</button><span class="small" id="keyMsg"></span></div>
      </section>
      <div class="g2e">${ids.map(kidCard).join('')}</div>
      <section class="card grid"><h2>الجدول والاشتراك</h2>
        ${firstFuture ? `<div class="field"><label for="sd">تاريخ بداية الحصص</label><input class="input" type="date" id="sd" value="${DB.periods[0].from.slice(0,10)}" style="max-width:220px"></div>` : '<p class="small muted" style="margin:0">أي تعديل على الأيام أو الوقت يبدأ من الآن، والحصص السابقة تبقى كما هي.</p>'}
        <div class="g2e">${ids.map(sched).join('')}</div>
        <div class="field"><label for="pl">قيمة الحصة الواحدة (ريال)</label><input class="input num" type="number" min="1" id="pl" value="${DB.perLesson}" style="max-width:180px"></div>
        <div class="chips"><button class="btn primary" id="save">حفظ</button><span class="small ok" id="saved"></span></div>
      </section>
      <section class="card"><h2>الحسابات</h2><div style="overflow-x:auto"><table class="acc"><tr><th>الحساب</th><th>اسم المستخدم</th><th>كلمة المرور</th></tr>
        ${ids.map(k => `<tr><td>${esc(DB.kids[k].ar)}</td><td><code>${esc(DB.kids[k].user)}</code></td><td><code>${esc(DB.kids[k].pass)}</code></td></tr>`).join('')}
        <tr><td>ولي الأمر</td><td><code>${esc(DB.parent.user)}</code></td><td><code>${esc(DB.parent.pass)}</code></td></tr></table></div></section>
    </div></div>`;
  $('#out').onclick = logout;
  document.querySelectorAll('[data-trial]').forEach(b => b.onclick = () => startLesson(b.dataset.trial, true));
  $('#saveKey').onclick = () => { const v = $('#ak').value.trim(); if(!v){ $('#keyMsg').textContent = 'الصق المفتاح أولاً.'; return; } DB.apiKey = v; save(); renderParent(); $('#keyMsg').textContent = 'تم حفظ المفتاح.'; };
  $('#testKey').onclick = async () => { const msg = $('#keyMsg'); msg.textContent = 'جاري الاختبار…';
    try{ const t = await callClaude({model:LIVE_MODEL, max_tokens:20, messages:[{role:'user', content:'Say: ready'}]}); msg.textContent = '✅ المعلمة جاهزة'; msg.className = 'small ok'; }
    catch(e){ msg.className = 'small err'; msg.textContent = e && e.status === 401 ? 'المفتاح غير صحيح.' : `فشل الاتصال (${(e&&e.status)||'؟'}).`; } };
  $('#testVoice').onclick = () => { unlockAudio(); try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("Hello! I'm Teacher Noor. I can't wait to talk with you!"); if(voice) u.voice = voice; u.lang = 'en-US'; u.rate = .92; u.pitch = 1.08; speechSynthesis.speak(u); $('#keyMsg').textContent = 'الصوت: ' + (voice ? voice.name : 'الافتراضي'); }catch(e){} };
  $('#save').onclick = () => { const np = {};
    for(const k of ids){ const days = []; for(let i=0;i<7;i++) if($(`#d_${k}_${i}`).checked) days.push(i); np[k] = {days, time:$(`#t_${k}`).value || cur[k].time}; DB.balance[k] = Math.max(0, Number($(`#b_${k}`).value)||0); }
    DB.perLesson = Math.max(1, Number($('#pl').value)||10);
    if(firstFuture){ const sd = $('#sd').value || DB.periods[0].from.slice(0,10); DB.periods = [Object.assign({from:sd+'T00:00'}, np)]; }
    else if(ids.some(k => JSON.stringify(np[k]) !== JSON.stringify(cur[k]))){ const f = new Date(); DB.periods.push(Object.assign({from:`${f.getFullYear()}-${pad(f.getMonth()+1)}-${pad(f.getDate())}T${pad(f.getHours())}:${pad(f.getMinutes())}`}, np)); }
    save(); renderParent(); $('#saved').textContent = 'تم الحفظ'; };
}

/* =============== BOOT =============== */
loadDB();
if(DEMO && !DB){
  DB = {v:2, parent:{user:'demo',pass:'demo'}, kids:{kid:{id:'kid',ar:'تجربة',en:'Sam',user:'kid',pass:'kid',level:5,birth:'2016-01-01',boy:true}}, apiKey:'demo', perLesson:10, balance:{kid:2000},
    periods:[{from:'2026-10-01T00:00', kid:{days:[0,1,2,3,4,5,6], time:'00:00'}}], profiles:{kid:{nick:'Sam'}}, progress:{kid:{lessonNo:1,mistakes:[],words:[],focus:''}}, live:{kid:null}, attendance:[], reports:[]};
}
try{ WHO = localStorage.getItem('51telk:who') || null; }catch(e){}
if(DEMO){ WHO = 'parent'; }
go(WHO);
</script>
</body>
