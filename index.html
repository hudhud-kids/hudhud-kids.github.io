/* teacher animation */
.tbox svg .pose{opacity:0;transform-box:view-box;transform:translateY(30px) rotate(var(--r,0deg)) scale(.9);transition:opacity .26s ease,transform .42s cubic-bezier(.3,1.35,.5,1)}
.pose-wave,.pose-thumb{transform-origin:108px 345px;--r:-6deg}

.p-wave .arm-l,.p-thumb .arm-l{opacity:0}

.ring{fill:none;stroke:#3B7BE8;stroke-width:6;opacity:0}

<script>
"use strict";
/* =============== CONSTANTS =============== */
const STORE_KEY = '51telk:v2';
const API = 'https://api.anthropic.com/v1/messages';

const DAYS_AR = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DEMO = /demo/.test(location.hash) || /demo/.test(location.search);

const CURR = {
  junior:[
    ['My Daily Routine','present simple (I / he / she)','wake up, brush, breakfast, school, homework, bedtime'],
    ['At the Zoo','can / can\'t for abilities','elephant, giraffe, climb, swim, fly, jump'],

    ['Going Shopping','How much is / are ...? numbers to 100','price, cheap, expensive, cashier, buy, pay'],

    ['Last Weekend','past simple regular verbs','played, visited, watched, cleaned, stayed, walked'],
    ['A Trip to the Park','past simple irregular verbs','went, saw, ate, had, ran, bought'],
    ['Animals Around the World','comparatives (-er / more)','bigger, faster, taller, stronger, dangerous, desert'],
    ['My Body and Health','should / shouldn\'t','headache, fever, medicine, rest, healthy, exercise'],
    ['Celebrations','going to for plans','Eid, gift, celebrate, visit, wear, decorate'],
    ['Hobbies','love / enjoy + -ing','drawing, reading, cycling, collecting, building, puzzle'],

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = t => `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${pad(t.getHours())}${pad(t.getMinutes())}`;
const LOC = 'ar-SA-u-ca-gregory-nu-latn';

function ageOf(b){ const d = new Date(b+'T00:00:00'), n = new Date(); let a = n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--; return a; }
function fmtDur(ms){ const m = Math.max(0, Math.round(ms/60000)); if(m < 60) return `${m} دقيقة`; const h = Math.floor(m/60), d = Math.floor(h/24); if(d >= 1) return `${d} يوم و ${h%24} ساعة`; return `${h} ساعة و ${m%60} دقيقة`; }

/* =============== SCHEDULE + WALLET =============== */
function periodAt(t){ let p = DB.periods[0]; for(const q of DB.periods){ if(new Date(q.from) <= t) p = q; } return p; }
function slotsFor(k, until){
  const out = [], ps = DB.periods; const d = new Date(ps[0].from); d.setHours(0,0,0,0);
  while(d <= until){
    for(const p of ps){
      const s = p[k]; if(!s || !s.days.includes(d.getDay())) continue;
      const [h,m] = s.time.split(':').map(Number); const t = new Date(d); t.setHours(h,m,0,0);
      if(t <= until && t >= new Date(ps[0].from) && periodAt(t) === p) out.push(t);
    }
    d.setDate(d.getDate()+1);
  }
  return out.sort((a,b) => a-b);
}
function ledger(k){
  const now = new Date(), per = DB.perLesson, bal = DB.balance[k], maxLessons = Math.floor(bal/per);
  const all = slotsFor(k, new Date(now.getTime()+21*864e5));
  const att = new Set(DB.attendance.filter(a => a.kid === k).map(a => a.slot));
  const lv = DB.live[k];
  const rows = []; let open = null, next = null;
  for(const t of all){
    if(rows.length >= maxLessons) break;
    const key = keyOf(t);
    if(att.has(key)){ rows.push({t,key,st:'att'}); continue; }
    if(now - t > OPEN_AFTER*60e3){
      if(lv && lv.slot === key && now - new Date(lv.startedAt) < 60*60e3){ if(!open) open = {t,key,resumed:true}; }
      else rows.push({t,key,st:'miss'});
    } else if(now >= t - OPEN_BEFORE*60e3){ if(!open) open = {t,key}; }
    else if(!next) next = {t,key};
  }
  const attended = rows.filter(r => r.st==='att').length, missed = rows.length - attended;
  let run = 0, gifts = 0; for(const r of rows){ if(r.st==='att'){ run++; if(run%5===0) gifts++; } else run = 0; }
  return {rows, open, next, attended, missed, green:attended*per, red:missed*per, remaining:bal-rows.length*per, bal, run, gifts, ended: rows.length >= maxLessons};
}

let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const pref = [/Ava.*(Premium|Enhanced)/i,/Zoe.*(Premium|Enhanced)/i,/Samantha.*(Premium|Enhanced)/i,/(Premium|Enhanced)/i,/Ava/i,/Samantha/i,/Allison/i,/Aria|Jenny|Google US/i];
  for(const re of pref){ const v = vs.find(v => re.test(v.name) && /US/i.test(v.lang)) || vs.find(v => re.test(v.name)); if(v){ voice = v; return; } }
  voice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function unlockAudio(){ try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){} }

/* =============== CLAUDE API =============== */
function apiHeaders(){ return {'content-type':'application/json','x-api-key':DB.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}; }
async function* streamClaude(body, signal){
  if(DEMO || DB.apiKey === 'demo'){ yield* demoStream(body); return; }
  const r = await fetch(API,{method:'POST',headers:apiHeaders(),body:JSON.stringify(Object.assign({}, body, {stream:true})),signal});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw {status:r.status, body:t}; }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  while(true){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let i; while((i = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0,i); buf = buf.slice(i+2);
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data:')) continue; const d = line.slice(5).trim(); if(!d) continue;
        let j; try{ j = JSON.parse(d); }catch(e){ continue; }
        if(j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') yield j.delta.text;
        else if(j.type === 'error') throw {status:500, body:JSON.stringify(j.error||{})};
      }
    }
  }
}
async function callClaude(body){
  if(DEMO || DB.apiKey === 'demo') return demoReport();
  const r = await fetch(API,{method:'POST',headers:apiHeaders(),body:JSON.stringify(body)});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw {status:r.status, body:t}; }
  const j = await r.json(); return (j.content||[]).filter(c => c.type === 'text').map(c => c.text).join('');
}

let L = null;
function buildRules(k, plan){
  const kid = DB.kids[k], prog = DB.progress[k], age = ageOf(kid.birth), nk = nick(k);
  const mist = (prog.mistakes||[]).slice(0,6).map(m => `"${m.wrong}" -> "${m.right}"`).join('; ') || 'none yet';
  const words = (prog.words||[]).slice(0,15).join(', ') || 'none yet';
  const lvl = kid.level <= 6
    ? 'Use simple, clear English (CEFR A1-A2): short sentences, everyday words, lots of warmth and praise. Ask ONE question at a time.'
    : 'Use natural CEFR A2-B1 English. Push for longer answers with reasons and examples. Ask interesting follow-up questions like a real conversation partner.';
  return `You are Teacher Noor, a real-feeling, warm, funny and energetic English teacher giving a LIVE one-to-one VOICE class (like 51Talk) to a Saudi child on an iPad. Everything you write in the spoken part is read aloud by a text-to-speech voice, and the child answers by speaking (speech-to-text).

STUDENT: ${kid.en}, nickname "${nk}", ${age} years old, ${kid.boy ? 'boy' : 'girl'}, 51Talk level ${kid.level} (about CEFR ${kid.cefr || (kid.level<=6?'A1-A2':'A2-B1')}). First language Arabic.
TODAY: Lesson ${plan.n} "${plan.t}". Language to weave in: ${plan.g}. Useful words: ${plan.w}.${plan.round>1?' (Second round of this topic: go deeper with new related words.)':''}
Focus from the last lesson report: ${prog.focus || 'none yet'}.
Recent mistakes to recycle naturally: ${mist}.
Words from recent lessons: ${words}.

THE MOST IMPORTANT THING: a REAL CONVERSATION. Not word drills, not lists. Talk WITH the child like a real teacher who is genuinely curious about their life, opinions and imagination. The child should speak much more than you.
How the 25 minutes flow (each student message starts with [minute X]):
- chat (0-4): warm greeting by nickname, real small talk about their day.
- topic (4-20): a natural conversation about today's topic. Bring today's words and grammar INTO the conversation (stories, "imagine you are...", role-plays like shop/restaurant/interview, opinions, "what would you do if..."). When a new word appears, put it on the board once and keep chatting.
- game (20-23): a quick fun speaking challenge (guess the word, finish my story, 20 questions...).
- wrapup (23-25): specific praise, 1-2 things learned, goodbye, then [END].

HOW TO TALK:
- ${lvl}
- Spoken part: 1 to 3 short, natural sentences, like real speech (contractions, "Wow!", "Hmm", "Oh really?", laughter words). Always finish with a question or a clear invitation to speak.
- React to WHAT the child said (content first), like a real person, then continue.
- Correct mistakes the way great teachers do: first react to the meaning, then recast the correct sentence naturally, and about half the time ask them to say it again. One correction at a time, never a list. Also add a [FIX] tag.
- The child's words come from speech recognition: ignore punctuation/capitals. If a word looks like a mishearing of an English word, it is probably a pronunciation problem: say the word slowly with syllables (e.g. "gi-RAFFE") and ask them to try again.
- You NEVER speak Arabic. Every spoken word is English, always, even if the child speaks Arabic or is stuck. If the child is silent, stuck, or speaks Arabic, answer in simple English: rephrase, slow down, give an example, or offer two choices.
- If the child does not understand a specific English word or phrase, keep speaking English and put its written Arabic translation in [AR] (format: word = translation). [AR] is never spoken, it is only shown as text.
- If you get "(student was silent)", gently encourage: rephrase more simply.
- Stay on English learning. Never ask for personal details (address, phone, school name, passwords, photos). If off-topic, kindly bring them back.
- Never say you are an AI unless asked directly; you are Teacher Noor.

FORMAT (strict):
Line 1 starts with a mood tag, then the spoken text: [MOOD:happy|excited|proud|laughing|surprised|thinking|encouraging] spoken text...
After the spoken text, optional tags each on its own line:
[BOARD:word|one emoji|Arabic meaning|short example sentence]
[FIX:what the child said wrong|correct version|very short Arabic explanation]
[AR:English word = Arabic translation]  (written only, for a word the child did not understand)
[STAGE:chat|topic|game|wrapup]
[END]  (only in wrapup, after minute 23)
No markdown, no emojis, and no Arabic letters in the spoken text, no other text outside this format.`;
}

  let startedAt = new Date();
  if(!trial && led.open.resumed && DB.live[k] && DB.live[k].startedAt) startedAt = new Date(DB.live[k].startedAt);
  L = {kid:k, trial, slot:trial?null:led.open.key, n, plan, history:[], startedAt, state:'idle', mood:'happy', done:false, endSeen:false, ctl:null,
       queue:[], speaking:false, streamDone:true, lastSay:'', rec:null, listenStart:0, nudgeT:null, silT:null, mouthT:null, giftsBefore:led.gifts, typing:false};
  if(!trial){ DB.live[k] = {slot:L.slot, startedAt:startedAt.toISOString()}; save(); }
  L.rules = buildRules(k, plan);
  demoN = 0;

}

  $('#exit').onclick = confirmExit;

function tickRoom(){ if(!L) return; const s = Math.floor((Date.now()-L.startedAt.getTime())/1000), t = $('#timer');
  if(t){ t.textContent = `${pad(Math.floor(s/60))}:${pad(s%60)} / 25:00`; t.classList.toggle('over', s > LESSON_MIN*60); }
  const w = $('#wrap'); if(w) w.hidden = !(s >= 24*60 && !L.done); }

const STATE_TXT = {idle:'', thinking:'المعلمة تفكر…', speaking:'المعلمة تتكلم · اضغط عليها لتقاطعها', listening:'دورك! تكلم بالإنجليزي 🎤', tap:'اضغط زر الميكروفون الأزرق وتكلم'};
const POSES = ['wave','thumb','chin','ear','point','open'];
function setPose(p, ms){ if(!L) return; const b = $('#tbox'); if(!b) return; clearTimeout(L.poseT);

function setMood(m){ if(!L) return; const ok = ['happy','excited','proud','laughing','surprised','thinking','encouraging']; m = ok.includes(m) ? m : 'happy'; L.mood = m;
  const b = $('#tbox'); if(!b) return; ok.forEach(x => b.classList.toggle('m-'+x, x === m));
  const RX = {proud:['Excellent!','Amazing!','Perfect!','Great job!'], excited:['Wow!','Yay!','Awesome!'], laughing:['Haha!','So funny!'], surprised:['Oh!','Really?!'], encouraging:['You can do it!','Nice try!','Almost!']};
  if(RX[m] && (m === 'proud' || m === 'excited' || Math.random() < .6)) react(RX[m][Math.floor(Math.random()*RX[m].length)]);
  if(m === 'proud' || m === 'excited'){ burst(); setPose('thumb', 2600); }

function setMouth(n){ document.querySelectorAll('#tbox .mouth > *').forEach(p => p.classList.toggle('on', p.dataset.m === n)); }

const VIS = c => /[ah]/.test(c) ? 'A' : /[eiy]/.test(c) ? 'E' : /[ouwq]/.test(c) ? 'O' : /[mbp]/.test(c) ? 'M' : /[fv]/.test(c) ? 'F' : /[a-z]/.test(c) ? (Math.random() < .5 ? 'E' : 'A') : 'rest';
function mouthWalk(str, perChar){ stopMouth(); if(!L) return; let i = 0; const chars = str.toLowerCase();
  L.mouthT = setInterval(() => { if(i >= chars.length){ stopMouth(); setMouth('rest'); return; } const c = chars[i++]; if(c === ' ' && Math.random() < .5) setMouth('M'); else setMouth(VIS(c)); }, perChar); }
function stopMouth(){ if(L && L.mouthT){ clearInterval(L.mouthT); L.mouthT = null; } }
function burst(){ const b = $('#burst'); if(!b) return; b.innerHTML = ''; const em = ['⭐','✨','🌟','👏','💛'];
  for(let i=0;i<12;i++){ const s = document.createElement('span'); s.textContent = em[i%em.length]; const a = Math.random()*Math.PI*2, d = 100+Math.random()*90;
    s.style.setProperty('--x', Math.cos(a)*d+'px'); s.style.setProperty('--y', Math.sin(a)*d+'px'); b.appendChild(s); }
  setTimeout(() => { if(b) b.innerHTML = ''; }, 1300); }
function blinkLoop(){ if(!L) return; const b = $('#tbox'); if(b){ const once = () => { b.classList.add('blink'); setTimeout(() => b.classList.remove('blink'), 120); }; once(); if(Math.random() < .18) setTimeout(once, 260); }
  L.blinkT = setTimeout(blinkLoop, 2200 + Math.random()*3800); }

  L.glanceT = setTimeout(idleGlance, 2500 + Math.random()*3000); }

    const busy = b && ['p-wave','p-thumb','p-point'].some(c => b.classList.contains(c));

function emph(){ const b = $('#tbox'); if(!b) return; b.classList.add('emph'); clearTimeout(L && L.emphT); if(L) L.emphT = setTimeout(() => b.classList.remove('emph'), 280); }

  const d = document.createElement('div'); d.className = 'react'; d.textContent = txt; b.appendChild(d); setTimeout(() => d.remove(), 2000); }
function boardWrite(emoji, word){ const e = document.getElementById('bwE'), t = document.getElementById('bwT'); if(!t) return;
  e.textContent = emoji || '✏️'; t.textContent = word; t.setAttribute('font-size', word.length > 10 ? 17 : word.length > 7 ? 21 : 26);
  t.classList.remove('bw-new'); void t.getBoundingClientRect(); t.classList.add('bw-new'); }

/* ---- speaking queue ---- */
function enqueue(s){ s = s.replace(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+/g,'').replace(/\s+/g,' ').trim(); if(!/[A-Za-z0-9]/.test(s)) return; L.queue.push(s); pump(); }
function pump(){
  if(!L) return;
  if(L.speaking) return;
  if(!L.queue.length){ if(L.streamDone) teacherFinished(); return; }
  const s = L.queue.shift(); L.speaking = true; setState('speaking');
  if(L.firstWave){ L.firstWave = false; setPose('wave', 2800); }
  { const tb = $('#tbox'); if(tb) tb.classList.toggle('ask', /\?\s*$/.test(s)); }
  speakOne(s, false, () => { if(!L) return; L.speaking = false; pump(); });
}
function speakOne(text, slow, done){
  let finished = false; const fin = () => { if(finished) return; finished = true; clearTimeout(guard); stopMouth(); if(L) setMouth('rest'); done && done(); };
  const words = text.split(/\s+/).length; const guard = setTimeout(fin, (slow?700:420)*words + 2500);
  const rate = slow ? 0.7 : (DB.kids[L.kid].level <= 6 ? 0.88 : 0.96);
  const perChar = Math.round(62 / rate);
  if(!('speechSynthesis' in window)){ mouthWalk(text, perChar); setTimeout(fin, 300*words); return; }
  try{ const u = new SpeechSynthesisUtterance(text); if(voice) u.voice = voice; u.lang = 'en-US'; u.rate = rate; u.pitch = 1.08;
    let gotBoundary = false;
    u.onstart = () => { setTimeout(() => { if(!gotBoundary && !finished) mouthWalk(text, perChar); }, 250); };
    u.onboundary = e => { if(e.name && e.name !== 'word') return; gotBoundary = true; const w = text.slice(e.charIndex).split(/\s/)[0] || ''; mouthWalk(w, perChar);
      const clean = w.replace(/[^A-Za-z]/g,''); if(clean.length >= 7 || /[!?]$/.test(w) || (/^[A-Z]/.test(clean) && clean !== 'I' && e.charIndex > 0)) emph(); };
    u.onend = fin; u.onerror = fin; speechSynthesis.speak(u); }catch(e){ fin(); }
}
function sayAll(text, slow){ L.queue = []; L.streamDone = true; L.speaking = true; setState('speaking'); speakOne(text, slow, () => { if(!L) return; L.speaking = false; teacherFinished(); }); }
function interrupt(listenAfter){

/* ---- teacher turn (streaming) ---- */
function parseTags(full){
  const out = {mood:null, board:null, fix:null, ar:'', stage:null, end:false};
  const m = full.match(/^\s*\[MOOD:([a-z]+)\]/i); if(m) out.mood = m[1].toLowerCase();
  const re = /\[(BOARD|FIX|AR|STAGE|END)(?::([^\]]*))?\]/gi; let x;
  while((x = re.exec(full))){ const tag = x[1].toUpperCase(), v = (x[2]||'').trim(), p = v.split('|').map(s => s.trim());
    if(tag === 'BOARD') out.board = {word:p[0], emoji:p[1]||'', ar:p[2]||'', example:p[3]||''};
    else if(tag === 'FIX') out.fix = {wrong:p[0]||'', right:p[1]||'', tip:p[2]||''};
    else if(tag === 'AR') out.ar = v; else if(tag === 'STAGE') out.stage = v.toLowerCase(); else if(tag === 'END') out.end = true; }
  return out;
}
function spokenOf(full){ let s = full.replace(/^\s*\[MOOD:[a-z]*\]?/i,''); const i = s.search(/\[(BOARD|FIX|AR|STAGE|END)|\n\s*\[/i); if(i >= 0) s = s.slice(0,i); s = s.replace(/\[[^\]]*$/,''); return s; }
function cleanForHistory(full){ return full.trim() || '[MOOD:happy] ...'; }

async function teacherTurn(userText){
  if(!L || L.done) return;
  stopListening();
  const lesson = L, m = elapsedMin();
  lesson.history.push({role:'user', content:`[minute ${m}] ${userText}`});
  setState('thinking');
  const msgs = lesson.history.slice(-40); while(msgs.length && msgs[0].role !== 'user') msgs.shift();
  const apiMsgs = msgs.map((x,i) => i === msgs.length-1 ? {role:x.role, content:[{type:'text', text:x.content, cache_control:{type:'ephemeral'}}]} : {role:x.role, content:x.content});
  lesson.ctl = new AbortController(); lesson.streamDone = false; lesson.queue = [];
  let full = '', sent = 0, moodSet = false;
  const sub = $('#sub');
  try{
    for await (const t of streamClaude({model:LIVE_MODEL, max_tokens:400, system:[{type:'text', text:lesson.rules, cache_control:{type:'ephemeral'}}], messages:apiMsgs}, lesson.ctl.signal)){
      if(L !== lesson) return;
      full += t;
      if(!moodSet){ const mm = full.match(/^\s*\[MOOD:([a-z]+)\]/i); if(mm){ moodSet = true; setMood(mm[1].toLowerCase()); } else if(full.length > 20 && !/^\s*\[/.test(full)) moodSet = true; }
      if(!moodSet) continue;
      const spoken = spokenOf(full);
      if(sub) sub.innerHTML = esc(spoken);
      const rest = spoken.slice(sent); const mm2 = rest.match(/^[\s\S]*[.!?](?=\s)/);
      if(mm2){ enqueue(mm2[0]); sent += mm2[0].length; }
    }
    if(L !== lesson) return;
    const spokenRaw = spokenOf(full); const rest = spokenRaw.slice(sent); if(rest.trim()) enqueue(rest);
    const spoken = spokenRaw.trim();
    const tags = parseTags(full);
    if(!moodSet && tags.mood) setMood(tags.mood);
    lesson.lastSay = spoken;
    lesson.history.push({role:'assistant', content:cleanForHistory(full)});
    if(sub) sub.innerHTML = esc(spoken) + (tags.ar ? `<div class="ar">${esc(tags.ar)}</div>` : '');
    if(tags.board && tags.board.word) showBoard(tags.board);
    showFix(tags.fix);
    if(tags.end && (lesson.trial || elapsedMin() >= MIN_MINUTES)) lesson.endSeen = true;
    lesson.ctl = null; lesson.streamDone = true; pump();
  }catch(e){
    if(L !== lesson) return;
    lesson.ctl = null; lesson.streamDone = true; lesson.history.pop();
    if(e && e.name === 'AbortError') return;
    let msg = 'انقطع الاتصال بالمعلمة. تأكد من الإنترنت ثم اضغط «حاول مرة ثانية».';
    if(e && e.status === 401) msg = 'مفتاح التشغيل غير صحيح. اطلب من ولي الأمر تحديثه من لوحته.';
    else if(e && (e.status === 429 || e.status === 529)) msg = 'الخدمة مزدحمة الآن. انتظر لحظة ثم اضغط «حاول مرة ثانية».';
    else if(e && e.status === 400 && /credit|billing|limit/i.test(e.body||'')) msg = 'رصيد التشغيل انتهى أو وصل للحد الشهري. أخبر ولي الأمر.';
    setState('idle');
    if(sub){ sub.innerHTML = `<div class="ar">${msg}</div><div style="text-align:right;margin-top:8px"><button class="btn sm" id="retry" type="button">حاول مرة ثانية</button></div>`;
      $('#retry').onclick = () => teacherTurn(userText); }
    console.warn(e);
  }
}
function teacherFinished(){
  if(!L) return;

  el.innerHTML = `<div class="board"><button id="bw" aria-label="اسمع الكلمة"><div class="emo">${esc(b.emoji)}</div><div class="w">${esc(b.word)}</div></button>${b.ar?`<div style="font-weight:700">${esc(b.ar)}</div>`:''}${b.example?`<div class="ex">${esc(b.example)}</div>`:''}<div class="small" style="opacity:.8">اضغط الكلمة لتسمعها ببطء</div></div>`;

/* ---- listening ---- */
function onMicTap(){
  if(!L || L.done) return;

}
function startListening(fromTap){

  let text = '';
  const rec = new SR(); L.rec = rec; rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  const you = $('#you');
  rec.onresult = e => { let t = ''; for(const r of e.results) t += r[0].transcript; if(t.split(' ').length !== text.split(' ').length && Math.random() < .5) nod(); text = t;

function leaveRoom(){ if(L){ clearInterval(L.tick); clearTimeout(L.blinkT); clearTimeout(L.glanceT); clearTimeout(L.poseT); clearTimeout(L.gestT); interrupt(false); stopListening(); stopMouth(); } const k = L ? L.kid : null; L = null; go(WHO === 'parent' ? 'parent' : k); }
function confirmExit(){
  const counts = !L.trial && !L.done;
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="card"><h2>تبي تطلع من الحصة؟</h2><p style="margin:0">${counts ? `إذا طلعت الآن لن تُحتسب الحصة. تقدر ترجع وتكمل خلال وقت الحصة، وإذا ما رجعت تصير الـ ${DB.perLesson} ريال حمراء.` : 'تقدر ترجع لاحقاً.'}</p><div class="chips"><button class="btn primary" id="stay">أكمل الحصة</button><button class="btn" id="leave">اطلع</button></div></div>`;
  document.body.appendChild(ov);
  $('#stay').onclick = () => ov.remove();
  $('#leave').onclick = () => { ov.remove(); leaveRoom(); };
}
function alertBox(msg){ const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="card"><p style="margin:0">${esc(msg)}</p><button class="btn primary" id="okb">حسناً</button></div>`; document.body.appendChild(ov); $('#okb').onclick = () => ov.remove(); }

/* =============== PARENT =============== */
function renderParent(){
  const now = new Date(), cur = periodAt(now) || DB.periods[DB.periods.length-1];
  const ids = kidIds();
  const kidCard = k => { const l = ledger(k), kid = DB.kids[k], reps = DB.reports.filter(r => r.kid === k).sort((a,b) => b.slot > a.slot ? 1 : -1).slice(0,5);
    const nxt = l.open ? 'الحصة مفتوحة الآن' : l.next ? `${fmtDay(l.next.t)} · ${fmtTime(l.next.t)}` : '—';
    return `<section class="card"><div style="display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center">${avatarHTML(k)}<div style="min-width:0"><h2>${esc(kid.ar)} <span class="muted small">(${esc(nick(k))}) · Level ${kid.level} · ${ageOf(kid.birth)} سنة</span></h2>
      <div class="small muted">الدرس ${DB.progress[k].lessonNo}: <span class="en">${esc(lessonPlan(k,DB.progress[k].lessonNo).t)}</span> · ${nxt}</div></div></div>
      <div class="stat"><div><span class="small muted">الرصيد المتبقي</span><b>${l.remaining}</b></div><div><span class="small muted">استفدنا</span><b style="color:var(--good)">${l.green}</b></div><div><span class="small muted">خسرنا</span><b style="color:var(--bad)">${l.red}</b></div><div><span class="small muted">حضور متتالي</span><b>${l.run}</b></div></div>
      <div class="chips" style="margin-top:12px"><button class="btn sm" data-trial="${k}">حصة تجريبية (لا تُحتسب)</button></div>
      <h3 style="margin-top:14px;font-size:1rem">تقارير المعلمة</h3>
      ${reps.length ? reps.map(r => `<div class="report"><div><b class="en">Lesson ${r.lessonNo} · ${esc(r.title)}</b> <span class="chip brand num">${r.score}%</span> <span class="small muted">${r.minutes||0} دقيقة</span></div><div class="small">${esc(r.parentNote)}</div>${(r.mistakes||[]).length?`<div class="small ltr" style="text-align:left">${r.mistakes.map(m => `<s class="muted">${esc(m.wrong)}</s> → ${esc(m.right)}`).join(' · ')}</div>`:''}</div>`).join('') : '<p class="small muted" style="margin:0">تظهر هنا ملاحظات المعلمة بعد كل حصة.</p>'}
    </section>`; };
  const sched = k => `<div class="field"><label>${esc(DB.kids[k].ar)}: الأيام والوقت</label><div class="days">${DAYS_AR.map((d,i) => `<label><input type="checkbox" id="d_${k}_${i}" ${cur[k].days.includes(i)?'checked':''}> ${d}</label>`).join('')}</div>
      <input class="input" type="time" id="t_${k}" value="${cur[k].time}" style="max-width:180px"><label for="b_${k}" class="small">مبلغ الاشتراك (ريال)</label><input class="input num" type="number" min="0" step="10" id="b_${k}" value="${DB.balance[k]}" style="max-width:180px"></div>`;
  const firstFuture = new Date(DB.periods[0].from) > now && DB.periods.length === 1;
  $('#app').innerHTML = `<div class="wrap">
    <div class="topbar">${LOGO}<div class="me"><b>لوحة ولي الأمر</b><button class="btn sm" id="out">خروج</button></div></div>
    <div class="grid">
      <section class="card grid" style="gap:10px"><h2>تشغيل المعلمة</h2>
        <p class="small muted" style="margin:0">${DB.apiKey ? '✅ مفتاح التشغيل محفوظ على هذا الجهاز فقط.' : '⚠️ الصق مفتاح التشغيل (يبدأ بـ sk-ant-) حتى تعمل المعلمة.'}</p>
        <div class="field"><label for="ak">مفتاح التشغيل</label><input class="input ltr" id="ak" type="password" autocomplete="off" placeholder="${DB.apiKey ? '•••••• محفوظ' : 'sk-ant-...'}"></div>
        <div class="chips"><button class="btn primary sm" id="saveKey">حفظ المفتاح</button><button class="btn sm" id="testKey">اختبار الاتصال</button><button class="btn sm" id="testVoice">اختبار الصوت</button><span class="small" id="keyMsg"></span></div>
      </section>
      <div class="g2e">${ids.map(kidCard).join('')}</div>
      <section class="card grid"><h2>الجدول والاشتراك</h2>
        ${firstFuture ? `<div class="field"><label for="sd">تاريخ بداية الحصص</label><input class="input" type="date" id="sd" value="${DB.periods[0].from.slice(0,10)}" style="max-width:220px"></div>` : '<p class="small muted" style="margin:0">أي تعديل على الأيام أو الوقت يبدأ من الآن، والحصص السابقة تبقى كما هي.</p>'}
        <div class="g2e">${ids.map(sched).join('')}</div>
        <div class="field"><label for="pl">قيمة الحصة الواحدة (ريال)</label><input class="input num" type="number" min="1" id="pl" value="${DB.perLesson}" style="max-width:180px"></div>
        <div class="chips"><button class="btn primary" id="save">حفظ</button><span class="small ok" id="saved"></span></div>
      </section>
      <section class="card"><h2>الحسابات</h2><div style="overflow-x:auto"><table class="acc"><tr><th>الحساب</th><th>اسم المستخدم</th><th>كلمة المرور</th></tr>
        ${ids.map(k => `<tr><td>${esc(DB.kids[k].ar)}</td><td><code>${esc(DB.kids[k].user)}</code></td><td><code>${esc(DB.kids[k].pass)}</code></td></tr>`).join('')}
        <tr><td>ولي الأمر</td><td><code>${esc(DB.parent.user)}</code></td><td><code>${esc(DB.parent.pass)}</code></td></tr></table></div></section>
    </div></div>`;
  $('#out').onclick = logout;
  document.querySelectorAll('[data-trial]').forEach(b => b.onclick = () => startLesson(b.dataset.trial, true));
  $('#saveKey').onclick = () => { const v = $('#ak').value.trim(); if(!v){ $('#keyMsg').textContent = 'الصق المفتاح أولاً.'; return; } DB.apiKey = v; save(); renderParent(); $('#keyMsg').textContent = 'تم حفظ المفتاح.'; };
  $('#testKey').onclick = async () => { const msg = $('#keyMsg'); msg.textContent = 'جاري الاختبار…';
    try{ const t = await callClaude({model:LIVE_MODEL, max_tokens:20, messages:[{role:'user', content:'Say: ready'}]}); msg.textContent = '✅ المعلمة جاهزة'; msg.className = 'small ok'; }
    catch(e){ msg.className = 'small err'; msg.textContent = e && e.status === 401 ? 'المفتاح غير صحيح.' : `فشل الاتصال (${(e&&e.status)||'؟'}).`; } };
  $('#testVoice').onclick = () => { unlockAudio(); try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("Hello! I'm Teacher Noor. I can't wait to talk with you!"); if(voice) u.voice = voice; u.lang = 'en-US'; u.rate = .92; u.pitch = 1.08; speechSynthesis.speak(u); $('#keyMsg').textContent = 'الصوت: ' + (voice ? voice.name : 'الافتراضي'); }catch(e){} };
  $('#save').onclick = () => { const np = {};
    for(const k of ids){ const days = []; for(let i=0;i<7;i++) if($(`#d_${k}_${i}`).checked) days.push(i); np[k] = {days, time:$(`#t_${k}`).value || cur[k].time}; DB.balance[k] = Math.max(0, Number($(`#b_${k}`).value)||0); }
    DB.perLesson = Math.max(1, Number($('#pl').value)||10);
    if(firstFuture){ const sd = $('#sd').value || DB.periods[0].from.slice(0,10); DB.periods = [Object.assign({from:sd+'T00:00'}, np)]; }
    else if(ids.some(k => JSON.stringify(np[k]) !== JSON.stringify(cur[k]))){ const f = new Date(); DB.periods.push(Object.assign({from:`${f.getFullYear()}-${pad(f.getMonth()+1)}-${pad(f.getDate())}T${pad(f.getHours())}:${pad(f.getMinutes())}`}, np)); }
    save(); renderParent(); $('#saved').textContent = 'تم الحفظ'; };
}

/* =============== BOOT =============== */
loadDB();
if(DEMO && !DB){
  DB = {v:2, parent:{user:'demo',pass:'demo'}, kids:{kid:{id:'kid',ar:'تجربة',en:'Sam',user:'kid',pass:'kid',level:5,birth:'2016-01-01',boy:true}}, apiKey:'demo', perLesson:10, balance:{kid:2000},
    periods:[{from:'2026-10-01T00:00', kid:{days:[0,1,2,3,4,5,6], time:'00:00'}}], profiles:{kid:{nick:'Sam'}}, progress:{kid:{lessonNo:1,mistakes:[],words:[],focus:''}}, live:{kid:null}, attendance:[], reports:[]};
}
try{ WHO = localStorage.getItem('51telk:who') || null; }catch(e){}
if(DEMO){ WHO = 'parent'; }
go(WHO);
</script>
</body>
</html>
