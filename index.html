<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>51telk</title>
<meta name="theme-color" content="#FF6A00">
<meta name="apple-mobile-web-app-title" content="51telk">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preload" href="fonts/dubai-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dubai-bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* One bright classroom look: warm orange brand, sky-blue teacher, white boards */
@font-face{font-family:"Dubai";src:url(fonts/dubai-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dubai";src:url(fonts/dubai-medium.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Dubai";src:url(fonts/dubai-bold.woff2) format("woff2");font-weight:700 900;font-display:swap}
:root{
  color-scheme: light;
  --brand:#FF6A00; --brand-ink:#B84A00; --brand-soft:#FFE8D6;
  --bg:#FFF7F0; --surface:#FFFFFF; --fg:#2B1B0F; --muted:#86695A; --line:#F0DCCB;
  --good:#15803D; --good-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --sky:#3B7BE8; --sky-soft:#E3EEFF; --gold:#E9A100;
  --font:"Dubai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --en:"Dubai",system-ui,-apple-system,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.ltr{direction:ltr;unicode-bidi:isolate}
.en{font-family:var(--en)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.logo{display:inline-flex;align-items:center;gap:6px;direction:ltr;font-family:var(--en);font-weight:800}
.logo .b{background:var(--brand);color:#fff;border-radius:12px 12px 12px 4px;padding:0 8px;font-size:1.3em;line-height:1.45}
.logo .t{color:var(--brand);font-size:1.35em}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.big{padding:14px 30px;font-size:1.15rem}
.btn.sm{padding:6px 14px;font-size:.9rem;min-height:36px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:16px}
.g2{display:grid;gap:16px;grid-template-columns:1.25fr 1fr}
.g2e{display:grid;gap:16px;grid-template-columns:1fr 1fr;align-items:start}
@media (max-width:820px){.g2,.g2e{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:110px;direction:ltr;font-size:.8rem}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.ok{color:var(--good);font-weight:700}
.center{min-height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.panel{width:min(440px,100%);display:grid;gap:16px}
.panel .logo{font-size:1.9rem;justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 16px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--brand)}
.avatar.lg{width:100px;height:100px;font-size:2.2rem}
.hero{background:linear-gradient(135deg,#FF6A00,#FF9A3D);color:#fff;border:0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .eyebrow{font-size:.88rem;opacity:.92}
.hero h1{font-size:1.65rem;font-family:var(--en)}
.hero .btn{background:#fff;color:var(--brand-ink);border-color:#fff}
.count{font-size:2rem;font-weight:800;line-height:1.15}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.bal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bal .v{font-size:2.4rem;font-weight:800}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-block:10px}
.bar i{display:block;height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border-radius:99px;padding:4px 12px;font-weight:700;font-size:.9rem}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ledger{list-style:none;margin:12px 0 0;padding:0}
.ledger li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.amt{font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.amt.good{color:var(--good)} .amt.bad{color:var(--bad)}
.dots{display:flex;gap:8px;margin-block:10px}
.dots span{width:32px;height:32px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.dots span.on{background:var(--good);border:0;color:#fff}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:12px}
.book{border-radius:12px 4px 4px 12px;padding:14px 12px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-decoration:none;color:#fff}
.book .bt{font-weight:800;line-height:1.3;direction:ltr;text-align:left;font-family:var(--en)}
.book .ba{font-size:.8rem;opacity:.92}
.book.locked{background:var(--line)!important;color:var(--muted)}
.book.locked .bt{filter:blur(3px)}
.hist{display:grid;gap:10px;margin-top:10px}
.hist .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.stars{color:var(--gold);letter-spacing:2px;direction:ltr}

/* ===== classroom ===== */
.room{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 30% 20%,#FFF1E3,var(--bg) 60%)}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.rbar .ttl{flex:1;min-width:160px;font-weight:800;font-family:var(--en);direction:ltr;text-align:right}
.timer{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:4px 14px}
.timer.over{background:var(--bad-soft);color:var(--bad)}
.rbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,46%) 1fr;gap:0}
@media (max-width:780px), (orientation:portrait) and (max-width:1100px){.rbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.tbox{width:min(520px,100%)}
@media (orientation:portrait) and (min-width:700px) and (max-width:1100px){.tbox{width:min(500px,72vw)!important}.stage{padding:16px}.side{padding-top:4px}.sub{font-size:1.6rem}}
.stage{display:grid;place-items:center;padding:12px 16px;position:relative}
.tbox{position:relative;display:grid;justify-items:center}
@media (max-width:780px){.tbox{width:min(240px,62vw)}.stage{padding:6px 16px}.sub{font-size:1.2rem;min-height:70px}}
.tbox svg{width:100%;height:auto;display:block;overflow:visible;direction:ltr}
.tname{font-family:var(--en);font-weight:800;color:var(--sky);margin-top:-6px}
.state{margin-top:4px;font-weight:700;font-size:.95rem;min-height:1.6em;color:var(--muted)}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:12px;overflow:auto}
.sub{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;direction:ltr;text-align:left;font-family:var(--en);font-size:1.45rem;font-weight:600;line-height:1.45;min-height:96px}
.sub .ar{direction:rtl;text-align:right;font-family:var(--font);font-size:1rem;color:var(--muted);font-weight:500;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.you{align-self:flex-end;max-width:90%;background:var(--brand);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;direction:ltr;text-align:left;font-family:var(--en);font-size:1.2rem;min-height:48px}
.you.live{background:var(--brand-soft);color:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.board{background:#22543D;color:#F5F5DC;border:6px solid #A0703C;border-radius:14px;padding:14px;text-align:center;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
.board button{background:none;border:0;color:inherit;padding:0}
.board .emo{font-size:3rem;line-height:1.1}
.board .w{font-family:var(--en);font-size:2rem;font-weight:800;direction:ltr}
.board .ex{direction:ltr;font-style:italic;opacity:.9}
.fix{background:var(--surface);border:2px solid var(--good);border-radius:14px;padding:12px 14px}
.fix .wr{text-decoration:line-through;color:var(--bad);direction:ltr;text-align:left}
.fix .rt{color:var(--good);font-weight:800;direction:ltr;text-align:left;font-family:var(--en);font-size:1.15rem}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;background:var(--surface);border-top:1px solid var(--line)}
.micbig{width:76px;height:76px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(59,123,232,.35)}
.micbig svg{width:34px;height:34px}
.micbig.on{background:var(--bad);animation:pulse 1.1s infinite}
.micbig.wait{background:var(--muted)}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(220,38,38,.18)}}
.typer{display:flex;gap:8px;width:100%;max-width:640px}
.typer .input{direction:ltr;text-align:left}
.hint{margin:0;padding:8px 12px;border-radius:12px;background:var(--sky-soft);font-size:.9rem}

/* teacher animation */
.tbox svg .pose{opacity:0;transform-box:view-box;transform:translateY(30px) rotate(var(--r,0deg)) scale(.9);transition:opacity .26s ease,transform .42s cubic-bezier(.3,1.35,.5,1)}
.pose-wave,.pose-thumb{transform-origin:108px 345px;--r:-6deg}
.pose-chin,.pose-ear,.pose-point,.pose-open{transform-origin:298px 345px;--r:6deg}
.tbox.p-wave .pose-wave,.tbox.p-thumb .pose-thumb,.tbox.p-chin .pose-chin,.tbox.p-ear .pose-ear,.tbox.p-point .pose-point,.tbox.p-open .pose-open{opacity:1;transform:none}
.arm-l,.arm-r{transition:opacity .22s ease}
.p-wave .arm-l,.p-thumb .arm-l{opacity:0}
.p-chin .arm-r,.p-ear .arm-r,.p-point .arm-r,.p-open .arm-r{opacity:0}
.wave-in{transform-box:view-box;transform-origin:104px 330px;animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(8deg)}}
.open-in{transform-box:view-box;transform-origin:290px 340px;animation:talkhand 1.8s ease-in-out infinite}
@keyframes talkhand{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg) translateY(-3px)}65%{transform:rotate(3deg)}}
.t-tilt{transform-box:view-box;transform-origin:200px 300px;transition:transform .5s ease}
.ask .t-tilt{transform:rotate(-4deg)}
.emph .brows{transform:translateY(-6px)!important}
.t-head{transform-box:view-box;transform-origin:200px 300px;transition:transform .35s ease}
.speaking .t-head{animation:bob 1.7s ease-in-out infinite}
.listening .t-head{transform:rotate(-5deg) translateX(-4px)}
.thinking .t-head{transform:rotate(4deg)}
.nod .t-head{animation:nod .45s ease-in-out}
@keyframes bob{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-2.4deg) translateY(-3px)}50%{transform:rotate(.5deg) translateY(0)}75%{transform:rotate(2.4deg) translateY(-1px)}}
@keyframes nod{0%,100%{transform:rotate(-5deg) translateY(0)}45%{transform:rotate(-5deg) translateY(7px)}}
.t-body{transform-box:view-box;transform-origin:200px 440px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,1.018)}}
.lids ellipse{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .07s}
.blink .lids ellipse{transform:scaleY(1)}
.pupils{transition:transform .16s ease-out}
.eyes-h{display:none}
.m-happy .eyes-n,.m-laughing .eyes-n,.m-proud .eyes-n{display:none}
.m-happy .eyes-h,.m-laughing .eyes-h,.m-proud .eyes-h{display:inline}
.speaking.m-happy .eyes-n,.speaking.m-proud .eyes-n{display:inline}
.speaking.m-happy .eyes-h,.speaking.m-proud .eyes-h{display:none}
.brows{transform-box:view-box;transition:transform .16s ease-out}
.m-surprised .brows,.m-excited .brows{transform:translateY(-8px)}
.m-thinking .brows,.thinking .brows{transform:translateY(-4px)}
.m-encouraging .brows{transform:translateY(-3px)}
.mouth > *{display:none}
.mouth > .on{display:inline}
.ring{fill:none;stroke:#3B7BE8;stroke-width:6;opacity:0}
.listening .ring{animation:ring 1.3s ease-out infinite}
@keyframes ring{0%{opacity:.55;transform:scale(.92)}100%{opacity:0;transform:scale(1.08)}}
.ring{transform-box:fill-box;transform-origin:center}
.think-dots{opacity:0;transition:opacity .2s}
.thinking .think-dots{opacity:1}
.think-dots circle{animation:dot 1s infinite}
.think-dots circle:nth-child(2){animation-delay:.15s}.think-dots circle:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-6px)}}
.board-glow{opacity:0;transition:opacity .3s}
.p-point .board-glow{opacity:1}
.sway{transform-box:view-box;transform-origin:200px 440px;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.m-excited .sway{animation:hop .55s ease-out 1,sway 6s ease-in-out .55s infinite}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}}
.eyes-n{transform-box:view-box;transform-origin:200px 182px;transition:transform .2s}
.m-surprised .eyes-n{transform:scale(1.13)}
.m-laughing .t-head{animation:laugh .28s ease-in-out 5}
@keyframes laugh{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.lw{opacity:0}
.listening .lw{animation:lw 1.2s ease-out infinite}
.listening .lw2{animation-delay:.2s}.listening .lw3{animation-delay:.4s}
@keyframes lw{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.clock-m{transform-box:view-box;transform-origin:64px 52px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bw-write{transform-box:fill-box;transform-origin:center}
.bw-new{animation:write .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes write{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.react{position:absolute;top:3%;left:3%;background:#fff;color:#FF6A00;font-weight:800;font-family:var(--en);font-size:1.35rem;padding:6px 16px;border-radius:20px 20px 20px 4px;box-shadow:0 6px 18px rgba(0,0,0,.14);animation:reactpop 1.9s ease-out forwards;pointer-events:none;direction:ltr;z-index:2}
@keyframes reactpop{0%{opacity:0;transform:scale(.4) translateY(12px)}14%{opacity:1;transform:scale(1.12)}24%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){.sway,.hand-tap,.clock-m,.listening .lw{animation:none}}
.burst{position:absolute;inset:0;pointer-events:none;overflow:visible}
.burst span{position:absolute;left:50%;top:40%;font-size:1.7rem;animation:fly 1.2s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.speaking .t-head,.t-body,.listening .ring,.think-dots circle,.pose-wave{animation:none}}

.ov{position:fixed;inset:0;background:rgba(43,27,15,.5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.ov .card{width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:14px}
.wordchips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.wordchips span{background:var(--sky-soft);color:var(--sky);border-radius:99px;padding:2px 10px;font-weight:700}
.gift{background:linear-gradient(135deg,#FFD25E,#FF9A3D);color:#3A2100;border-radius:var(--r);padding:14px;font-weight:800;text-align:center}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media (max-width:560px){.stat{grid-template-columns:repeat(2,1fr)}}
.stat div{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;gap:4px;align-items:center;background:var(--bg);border-radius:99px;padding:4px 10px;font-size:.9rem}
.report{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.acc{width:100%;border-collapse:collapse}
.acc td,.acc th{padding:8px;border-top:1px solid var(--line);text-align:right}
.acc code{direction:ltr;unicode-bidi:isolate;background:var(--bg);padding:2px 8px;border-radius:6px;font-weight:700}
/* ===== kid app: tabs, path, schedule, wins, quiz, library ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;min-height:42px}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media (max-width:1100px){.path{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.path{grid-template-columns:1fr}}
.unit{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--bg);border:2px solid transparent}
.unit.cur{border-color:var(--brand);background:var(--brand-soft)}
.unit.done{background:var(--good-soft)}
.ue{font-size:2rem}
.ldots{display:flex;gap:5px;margin-top:6px;direction:ltr;justify-content:flex-end}
.ldots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.ldots i.on{background:var(--good)}
.ldots i.cur{background:var(--brand);box-shadow:0 0 0 3px rgba(255,106,0,.25)}
.mcounts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mcount{background:var(--bg);border-radius:14px;padding:10px 16px;min-width:140px}
.mcount b{display:block;font-size:1.8rem;line-height:1.2}
.mcount.low{background:var(--bad-soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .3s ease-out;max-width:calc(100% - 32px);text-align:center}

/* =============== SCHEDULE + WALLET =============== */
function periodAt(k, t){ const ps = DB.sched[k].periods; let p = ps[0]; for(const q of ps){ if(new Date(q.from) <= t) p = q; } return p; }
function slotsFor(k, until){
  const S = DB.sched[k], ps = S.periods, out = [], cancel = new Set(S.cancel);
  const start = new Date(ps[0].from); const d = new Date(start); d.setHours(0,0,0,0);
  while(d <= until){
    for(const p of ps){
      if(!p.days.includes(d.getDay())) continue;
      const [h,m] = p.time.split(':').map(Number); const t = new Date(d); t.setHours(h,m,0,0);
      if(t <= until && t >= start && periodAt(k, t) === p && !cancel.has(keyOf(t))) out.push({t, key:keyOf(t), extra:false});
    }
    d.setDate(d.getDate()+1);
  }
  for(const x of S.extra){ const t = fromKey(x); if(t <= until && !cancel.has(x)) out.push({t, key:x, extra:true}); }
  const seen = new Set(); return out.filter(s => !seen.has(s.key) && seen.add(s.key)).sort((a,b) => a.t - b.t);
}
function ledger(k){
  const now = new Date(), per = DB.perLesson, bal = DB.balance[k], maxLessons = Math.floor(bal/per);
  const all = slotsFor(k, new Date(now.getTime()+62*864e5));
  const att = new Set(DB.attendance.filter(a => a.kid === k).map(a => a.slot));
  const lv = DB.live[k];
  const rows = []; let open = null, next = null; const upcoming = [];
  for(const s of all){
    const {t, key} = s;
    if(att.has(key)){ if(rows.length < maxLessons) rows.push({t,key,st:'att',extra:s.extra}); continue; }
    if(now - t > OPEN_AFTER*60e3){
      if(lv && lv.slot === key && now - new Date(lv.startedAt) < 60*60e3){ if(!open) open = s; }
      else if(rows.length < maxLessons) rows.push({t,key,st:'miss',extra:s.extra});
    } else if(now >= t - OPEN_BEFORE*60e3){ if(!open) open = s; }
    else { if(!next) next = s; upcoming.push(s); }
  }
  if(open && DB.live[k] && DB.live[k].slot === open.key) open.resumed = true;
  const attended = rows.filter(r => r.st==='att').length, missed = rows.length - attended;
  let run = 0, gifts = 0, best = 0; for(const r of rows){ if(r.st==='att'){ run++; best = Math.max(best, run); if(run%5===0) gifts++; } else run = 0; }
  const ended = rows.length >= maxLessons;
  return {rows, open: ended ? null : open, next: ended ? null : next, upcoming, attended, missed, green:attended*per, red:missed*per, remaining:bal-rows.length*per, bal, run, best, gifts, ended};
}
/* months: the minimum of 12 applies to every full month after the start month */
function monthKey(t){ return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; }
function monthCount(k, mk){ const [y,m] = mk.split('-').map(Number); const end = new Date(y, m, 0, 23, 59); return slotsFor(k, end).filter(s => monthKey(s.t) === mk).length; }
function monthExempt(k, mk){ return monthKey(new Date(DB.sched[k].periods[0].from)) === mk; }
const MIN_MONTH = 12;
function canDrop(k, t){ const mk = monthKey(t); if(monthExempt(k, mk)) return true; return monthCount(k, mk) - 1 >= MIN_MONTH; }
function conflict(k, t, ignoreKey){
  for(const other of kidIds()){
    const near = slotsFor(other, new Date(t.getTime()+864e5)).filter(s => s.key !== ignoreKey && Math.abs(s.t - t) < (other === k ? 45 : 30)*60e3);
    if(near.length) return other;
  }
  return null;
}
function cancelSlot(k, key){ const S = DB.sched[k]; if(S.extra.includes(key)) S.extra = S.extra.filter(x => x !== key); else S.cancel.push(key); save(); }
function addExtra(k, t){ DB.sched[k].extra.push(keyOf(t)); DB.sched[k].cancel = DB.sched[k].cancel.filter(x => x !== keyOf(t)); save(); }

function slotPicker(k, moveKey){
  const now = new Date(), times = []; for(let h=8; h<=21; h++) for(const m of [0,30]) times.push(`${pad(h)}:${pad(m)}`);
  const old = moveKey ? fromKey(moveKey) : null;
  const ov = overlay(`<h2>${moveKey ? 'تغيير موعد الحصة' : 'حجز حصة إضافية'}</h2>
    ${old ? `<p class="small muted" style="margin:0">الموعد الحالي: ${fmtDay(old)} · ${fmtTime(old)}</p>` : `<p class="small muted" style="margin:0">تُخصم ${DB.perLesson} ريال من رصيدك، وإذا ما حضرتها تصير حمراء.</p>`}
    <div class="field"><label for="pd">اليوم</label><input class="input" type="date" id="pd" min="${todayISO()}" value="${todayISO()}"></div>
    <div class="field"><label for="pt">الوقت</label><select class="input" id="pt">${times.map(t => `<option ${t==='17:00'?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="err" id="pe"></div>
    <div class="chips"><button class="btn primary" id="ok">${moveKey ? 'تأكيد الموعد الجديد' : 'احجز'}</button><button class="btn" id="no">رجوع</button></div>`);
  ov.querySelector('#no').onclick = () => ov.remove();
  ov.querySelector('#ok').onclick = () => {
    const d = ov.querySelector('#pd').value, tm = ov.querySelector('#pt').value, err = ov.querySelector('#pe');
    if(!d){ err.textContent = 'اختر اليوم.'; return; }
    const [y,mo,da] = d.split('-').map(Number), [h,mi] = tm.split(':').map(Number), t = new Date(y, mo-1, da, h, mi);
    if(t - now < 60*60e3){ err.textContent = 'اختر موعداً بعد ساعة على الأقل من الآن.'; return; }
    const cf = conflict(k, t, moveKey); if(cf){ err.textContent = cf === k ? 'عندك حصة قريبة من هذا الوقت.' : `هذا الوقت قريب من حصة ${DB.kids[cf].ar}، اختر وقتاً آخر.`; return; }
    if(moveKey){ if(monthKey(t) !== monthKey(old) && !canDrop(k, old)){ err.textContent = `نقل الحصة لشهر آخر يجعل حصص ${fmtMonth(old)} أقل من ${MIN_MONTH}. اختر يوماً في نفس الشهر.`; return; }
      cancelSlot(k, moveKey); addExtra(k, t); toast('تم تغيير الموعد'); }
    else { if(ledger(k).remaining < DB.perLesson){ err.textContent = 'رصيدك لا يكفي لحصة إضافية.'; return; } addExtra(k, t); toast('تم حجز الحصة الإضافية 🎉'); }
    ov.remove(); renderKid(k);
  };
}

function runQuiz(k, quiz, title, onDone, max){
  const items = (quiz||[]).filter(q => q && (q.type === 'order' ? Array.isArray(q.words) && q.answer : Array.isArray(q.options) && q.options.length > 1)).slice(0, max || 6);
  if(!items.length){ onDone && onDone(null); return; }
  let i = 0, score = 0;
  const ov = document.createElement('div'); ov.className = 'ov'; document.body.appendChild(ov);
  const norm = s => String(s).toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
  const show = () => {
    if(i >= items.length) return finish();

/* Split text into phrases with natural pauses; dialogue gets its own voice. */
function phrasesOf(text){
  const out = []; const re = /("[^"]+"|“[^”]+”|[^"“]+)/g; let m;
  while((m = re.exec(text))){
    const chunk = m[0], quoted = /^["“]/.test(chunk), base = m.index;
    const re2 = /[^.!?;,:—]+[.!?;,:—]*["”]?\s*/g; let n;
    while((n = re2.exec(chunk))){ const t = n[0]; if(!t.trim()) continue;

          rec.onerror = ev => { if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){ stopListen(); alertBox('اسمح للميكروفون من إعدادات سفاري لتستخدم «استمع لي».'); } };
          rec.onend = () => { rec = null; if(listening) setTimeout(startRec, 150); };
          try{ rec.start(); }catch(e){ stopListen(); }
        };
        startRec();
      };
    }
    function showScore(){ const st2 = results[pg] || {}; const total = toks.length; const ok = Object.values(st2).filter(v => v === 1).length;
      spans.forEach((s,j) => { if(st2[j] == null){ st2[j] = 0; s.classList.add('bad'); } });
      const pct = total ? Math.round(ok/total*100) : 0; const bad = toks.filter((t,j) => st2[j] === 0).map(t => clean(t.w)).filter(Boolean);
      const sc = ov.querySelector('#score'); if(sc) sc.innerHTML = `<div class="qfb ${pct>=80?'good':'bad'}">${pct>=90?'🌟 قراءة ممتازة!':pct>=70?'👏 قراءة جيدة':'💪 حاول مرة ثانية'} · ${pct}% صحيحة</div>${bad.length ? `<div class="small">تدرّب على: ${[...new Set(bad)].slice(0,8).map(w => `<button class="chip bad en" data-say="${esc(w)}">${esc(w)} 🔊</button>`).join(' ')}</div>` : ''}`;
      if(sc) sc.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { ctl = narrate(b.dataset.say, {speed:.72}); });
      results[pg] = st2; }
  };
  draw();
}
function finishBook(k, book, results){
  const qs = (book.questions||[]).map(q => ({type:'mc', q:q.q, options:q.options, answer:q.answer}));
  const readPages = Object.keys(results||{}).length, readOk = readPages ? Math.round(Object.values(results).reduce((a,st) => { const v = Object.values(st); return a + (v.length ? v.filter(x => x === 1).length / v.length : 0); }, 0) / readPages * 100) : null;
  runQuiz(k, qs, book.title, res => {
    const isPre = /^L\d+s/.test(book.id||''); const first = isPre ? DB.progress[k].pre[book.id] == null : !book.read;
    if(isPre){ DB.progress[k].pre[book.id] = res ? res.score : 0; if(first){ DB.progress[k].preAt = DB.progress[k].preAt || {}; DB.progress[k].preAt[book.id] = new Date().toISOString(); } }
    else { if(first) book.readAt = new Date().toISOString(); book.read = true; book.score = res ? res.score : 0; }
    let bonus = first ? 30 : 0; if(readOk != null && readOk >= 70){ bonus += 20; }
    if(bonus) addXP(k, bonus); if(readOk != null){ DB.progress[k].aloud = (DB.progress[k].aloud||[]).concat([{book:book.title, pct:readOk, at:new Date().toISOString()}]).slice(-30); }
    save(); toast(`📚 أنهيت القصة${bonus ? ` · +${bonus} نقطة` : ''}${readOk != null ? ` · قراءتك ${readOk}%` : ''}`); renderKid(k);
  });
}

function wordAccuracy(target, said){ const a = normWords(target), b = normWords(said); if(!a.length) return 0;
  const dp = Array.from({length:a.length+1}, () => new Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  return Math.round(dp[a.length][b.length] / a.length * 100); }

  r.onresult = e => { let t = ''; for(const x of e.results) t += x[0].transcript; text = t; onText && onText(t); clearTimeout(sil); sil = setTimeout(end, 3000); };
  r.onerror = () => end(); r.onend = () => end();

  return {stop:end}; }); }

/* =============== SIBLING CHALLENGE =============== */
function weekStart(d = new Date()){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x; }
const FAMILY_GOAL = {lessons:6, stories:4, daily:6};
function familyProgress(){
  const ws = weekStart(), ids = kidIds();
  const lessons = DB.attendance.filter(a => new Date(a.at) >= ws).length;
  const stories = ids.reduce((n,k) => n + DB.books[k].filter(b => b.readAt && new Date(b.readAt) >= ws).length + Object.values(DB.progress[k].preAt||{}).filter(d => new Date(d) >= ws).length, 0);
  const daily = ids.reduce((n,k) => n + Object.keys(DB.progress[k].daily||{}).filter(d => new Date(d+'T12:00') >= ws).length, 0);
  const wk = dayKey(ws), claimed = (DB.family||{})[wk];
  return {lessons, stories, daily, wk, claimed, done: lessons >= FAMILY_GOAL.lessons && stories >= FAMILY_GOAL.stories && daily >= FAMILY_GOAL.daily};
}
function familyCard(k){
  if(kidIds().length < 2) return '';
  const f = familyProgress(), others = kidIds().filter(x => x !== k).map(x => DB.kids[x].ar).join(' و');
  const row = (ar, v, g) => `<div class="fam"><span>${ar}</span><div class="bar"><i style="width:${Math.min(100, v/g*100)}%;background:var(--good)"></i></div><b class="num">${Math.min(v,g)}/${g}</b></div>`;
  return `<section class="card"><div class="chips" style="justify-content:space-between"><h2>🤝 تحدي الإخوة هذا الأسبوع</h2><span class="small muted">أنت و${esc(others)} فريق واحد</span></div>
    ${row('حصص', f.lessons, FAMILY_GOAL.lessons)}${row('قصص', f.stories, FAMILY_GOAL.stories)}${row('تحدي اليوم', f.daily, FAMILY_GOAL.daily)}
    ${f.claimed ? '<div class="chip good">🏆 أنجزتم التحدي! +100 نقطة لكل واحد</div>' : f.done ? '<button class="btn primary" id="famGo">🎉 استلموا الجائزة: +100 نقطة لكل واحد</button>' : '<div class="small muted">إذا أكملتم الأهداف الثلاثة قبل نهاية السبت، يأخذ كل واحد 100 نقطة.</div>'}</section>`;
}
function claimFamily(){ const f = familyProgress(); if(!f.done || f.claimed) return; DB.family = DB.family || {}; DB.family[f.wk] = true; kidIds().forEach(k => addXP(k, 100)); save(); toast('🏆 جائزة الفريق! +100 نقطة لكل واحد', 'gold'); }

/* =============== SELF CAMERA IN CLASS =============== */
let camStream = null;
async function startCam(){ const box = $('#selfcam'); if(!box) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ box.hidden = true; return; }
  try{ camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:320}, height:{ideal:240}}, audio:false});
    const v = box.querySelector('video'); v.srcObject = camStream; box.hidden = false; await v.play().catch(() => {}); }catch(e){ box.hidden = true; } }
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } const box = $('#selfcam'); if(box) box.hidden = true; }

/* =============== TALK TIME =============== */
function talkPctOf(l){ const t = l.sw + l.tw; return t ? Math.round(l.sw / t * 100) : null; }
const countWords = s => (String(s).match(/[A-Za-z']+/g) || []).length;
function talkPct(){ if(!L) return 0; const t = L.sw + L.tw; return t ? Math.round(L.sw / t * 100) : 0; }
function talkGoal(k){ return Math.min(75, 55 + Math.floor(DB.attendance.filter(a => a.kid === k).length / 2)); }
function updateTalk(){ const el = $('#talk'); if(!el || !L) return; const p = talkPct(), g = talkGoal(L.kid); el.innerHTML = `🗣️ أنت <b class="num">${p}%</b> <span class="small">(هدفك ${g}%)</span>`; el.classList.toggle('ok', p >= g); }

  const avg = xs => xs.length ? Math.round(xs.reduce((a,r) => a + r.score, 0)/xs.length) : null;
  const l = ledger(k), rows = l.rows.filter(r => r.t >= m0), att = rows.filter(r => r.st === 'att').length, miss = rows.length - att;
  const mins = reps.reduce((a,r) => a + (r.minutes||0), 0), talk = reps.filter(r => r.talkPct != null), tavg = talk.length ? Math.round(talk.reduce((a,r) => a + r.talkPct, 0)/talk.length) : null;
  const qz = DB.progress[k].quizzes.filter(q => q.at && new Date(q.at) >= m0), qavg = qz.length ? Math.round(qz.reduce((a,q) => a + q.score/q.total, 0)/qz.length*100) : null;
  const words = [...new Set(reps.flatMap(r => r.newWords||[]))], daily = Object.keys(DB.progress[k].daily||{}).filter(d => new Date(d+'T12:00') >= m0).length;
  const books = DB.books[k].filter(b => b.readAt && new Date(b.readAt) >= m0).length + Object.values(DB.progress[k].preAt||{}).filter(d => new Date(d) >= m0).length;
  const mkey = `${now.getFullYear()}-${pad(now.getMonth()+1)}`; DB.monthly = DB.monthly || {}; DB.monthly[k] = DB.monthly[k] || {};
  const ov = overlay(`<div class="cert" id="certBox"><div class="cert-in" style="text-align:right;justify-items:stretch">

      <div class="stat"><div><span class="small muted">قصص</span><b>${books}</b></div><div><span class="small muted">تحدي اليوم</span><b>${daily}</b></div><div><span class="small muted">النقاط</span><b>${DB.progress[k].xp}</b></div><div><span class="small muted">الأوسمة</span><b>${earnedBadges(k).length}</b></div></div>
      <div class="gram" id="mnote">${DB.monthly[k][mkey] ? esc(DB.monthly[k][mkey]) : '<span class="muted small">جاري كتابة ملاحظة المعلم…</span>'}</div>

    try{ const t = await callClaude({model:LIVE_MODEL, max_tokens:400, messages:[{role:'user', content:`Write a warm, specific monthly progress note in Arabic (4 sentences) from the English teacher to the parent of ${DB.kids[k].en} (level ${DB.kids[k].level}, ${LEVEL_INFO[DB.kids[k].level][0]}). Data: attended ${att}, missed ${miss}, lesson scores first half ${avg(h1)}, second half ${avg(h2)}, quiz average ${qavg}, talk share ${tavg}%, new words ${words.slice(0,15).join(', ')}. Teacher notes from lessons: ${reps.map(r => r.parentNote).join(' | ').slice(0,3000)}. Mention progress, strengths and one clear goal for next month. Reply with the note only.`}]});
      DB.monthly[k][mkey] = t.trim(); save(); const n = ov.querySelector('#mnote'); if(n) n.textContent = DB.monthly[k][mkey]; }catch(e){ const n = ov.querySelector('#mnote'); if(n) n.textContent = 'لم نتمكن من كتابة ملاحظة المعلم الآن.'; }
  } else if(!reps.length){ const n = ov.querySelector('#mnote'); if(n) n.textContent = 'لا توجد حصص هذا الشهر بعد.'; }
}

function apiHeaders(){ return {'content-type':'application/json','x-api-key':DB.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}; }
async function* streamClaude(body, signal){
  if(DEMO || DB.apiKey === 'demo'){ yield* demoStream(body); return; }
  const r = await fetch(API,{method:'POST',headers:apiHeaders(),body:JSON.stringify(Object.assign({}, body, {stream:true})),signal});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw {status:r.status, body:t}; }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  while(true){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let i; while((i = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0,i); buf = buf.slice(i+2);
      for(const line of chunk.split('\n')){
        if(!line.startsWith('data:')) continue; const d = line.slice(5).trim(); if(!d) continue;
        let j; try{ j = JSON.parse(d); }catch(e){ continue; }
        if(j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') yield j.delta.text;
        else if(j.type === 'error') throw {status:500, body:JSON.stringify(j.error||{})};
      }
    }
  }
}
async function callClaude(body, signal){
  if(DEMO || DB.apiKey === 'demo') return demoReport();
  const r = await fetch(API,{method:'POST',headers:apiHeaders(),body:JSON.stringify(body),signal});
  if(!r.ok){ let t = ''; try{ t = await r.text(); }catch(e){} throw {status:r.status, body:t}; }
  const j = await r.json(); return (j.content||[]).filter(c => c.type === 'text').map(c => c.text).join('');
}

function buildRules(k, plan){
  const kid = DB.kids[k], prog = DB.progress[k], age = ageOf(kid.birth), nk = nick(k), cefr = LEVEL_CEFR[kid.level] || 'A2';
  const mist = (prog.mistakes||[]).slice(0,6).map(m => `"${m.wrong}" -> "${m.right}"`).join('; ') || 'none yet';
  const words = (prog.words||[]).slice(0,15).join(', ') || 'none yet';
  const lvl = kid.level <= 4
    ? 'Use simple, clear English (CEFR ' + cefr + '): short sentences, everyday words, lots of warmth. Ask ONE question at a time.'
    : kid.level <= 6
    ? 'Use clear CEFR ' + cefr + ' English. Treat the child as a smart ' + age + '-year-old, not a baby. Push for full sentences with "because", "and", "but", "so".'
    : 'Use natural CEFR ' + cefr + ' English like a real conversation partner for a teenager. Push for longer answers with reasons, examples and opinions; ask challenging follow-up questions.';
  return `You are ${teacherOf(k).name} (a ${teacherOf(k).female ? 'woman' : 'man'}), a real-feeling, warm, funny and energetic English teacher giving a LIVE one-to-one VOICE class (like 51Talk) to a Saudi child on an iPad. Everything you write in the spoken part is read aloud by a text-to-speech voice, and the child answers by speaking (speech-to-text).

STUDENT: ${kid.en}, nickname "${nk}", ${age} years old, ${kid.boy ? 'boy' : 'girl'}, 51Talk level ${kid.level} (CEFR ${cefr}). First language Arabic.
TODAY: Unit "${plan.unit}", lesson ${plan.li+1} of ${plan.perUnit||6}: "${plan.t}".
Conversation goal: ${plan.goal}.
Sentence patterns the child should build and use: ${plan.pattern}.${(() => { const kit = kitFor(kid.level, plan.ui, plan.li); return kit ? `\nThe child prepared these words before class: ${(kit.words||[]).map(w => w.w).join(', ')}. Use them as today's new words.` : ''; })()}${plan.round>1?' (Second time through this level: go deeper, use harder follow-up questions.)':''}
Focus from the last lesson report: ${prog.focus || 'none yet'}.
Recent mistakes to recycle naturally: ${mist}.
What you know about the child from earlier lessons (bring it up naturally to make the conversation personal): ${(prog.interests||[]).join('; ') || 'nothing yet, find out what they love'}.
Words from recent lessons: ${words}.

THE MOST IMPORTANT THING: CONVERSATION AND SENTENCE BUILDING, much more than vocabulary. The child must speak in full sentences and speak much more than you.
How the 25 minutes flow (each student message starts with [minute X]):
- words (0-4): warm greeting by nickname and one quick personal question. Then teach 4 or 5 NEW useful words for today's conversation, one at a time: put each on the board with [BOARD], say it, and ask the child to use it in a short sentence. Keep this part quick.
- talk (4-21): the heart of the lesson. A real, interesting conversation about today's goal, using today's sentence patterns. First model a pattern in a natural sentence, then ask open questions so the child builds their OWN sentences. When an answer is short (one word), help them expand it: "Can you say that in a full sentence?", "Why?", "Tell me more", "Add because...". Use role-plays, "imagine..." situations, stories and opinions. Mix in today's new words naturally.
- review (21-23): a quick speaking challenge: the child makes 2-3 of their own sentences with today's patterns.
- wrapup (23-25): specific praise about the sentences they built, goodbye, then [END].

HOW TO TALK:
- ${lvl}
- Spoken part: 1 to 3 short, natural sentences, like real speech (contractions, "Wow!", "Hmm", "Oh really?", laughter words). Always finish with a question or a clear invitation to speak.
- React to WHAT the child said (content first), like a real person, then continue.
- Correct mistakes the way great teachers do: react to the meaning, then recast the correct sentence naturally, and about half the time ask them to say it again. One correction at a time, never a list. Also add a [FIX] tag.
- The child's words come from speech recognition: ignore punctuation/capitals. If a word looks like a mishearing of an English word, it is probably a pronunciation problem: say the word slowly with syllables (e.g. "gi-RAFFE") and ask them to try again.
- You NEVER speak Arabic. Every spoken word is English, always, even if the child speaks Arabic or is stuck. If the child is silent, stuck, or speaks Arabic, answer in simple English: rephrase, slow down, give an example sentence to copy, or offer two choices.
- If the child does not understand a specific English word or phrase, keep speaking English and put its written Arabic translation in [AR] (format: word = translation). [AR] is never spoken, it is only shown as text.
- If you get "(student was silent)", gently encourage: rephrase more simply.
- Stay on English learning. Never ask for personal details (address, phone, school name, passwords, photos). If off-topic, kindly bring them back.
- Never say you are an AI unless asked directly; you are ${teacherOf(k).name}.

FORMAT (strict):
Line 1 starts with a mood tag, then the spoken text: [MOOD:happy|excited|proud|laughing|surprised|thinking|encouraging] spoken text...
After the spoken text, optional tags each on its own line:
[BOARD:word|one emoji|Arabic meaning|short example sentence]
[FIX:what the child said wrong|correct version|very short Arabic explanation]
[AR:English word = Arabic translation]  (written only, for a word the child did not understand)
[STAGE:words|talk|review|wrapup]
[END]  (only in wrapup, after minute 23)
No markdown, no emojis, and no Arabic letters in the spoken text, no other text outside this format.`;
}

  L.blinkT = setTimeout(blinkLoop, 2200 + Math.random()*3800); }
function idleGlance(){ if(!L) return; if(L.state === 'idle' || L.state === 'speaking'){ const r = Math.random(); if(r < .25) look(-3,0); else if(r < .5) look(3,0); else look(0,1); }
  L.glanceT = setTimeout(idleGlance, 2500 + Math.random()*3000); }

    const busy = b && ['p-wave','p-thumb','p-point'].some(c => b.classList.contains(c));
    if(!busy) setPose(b.classList.contains('p-open') || Math.random() < .35 ? null : 'open');
    gestureLoop(); }, 1800 + Math.random()*2200); }
function emph(){ const b = $('#tbox'); if(!b) return; b.classList.add('emph'); clearTimeout(L && L.emphT); if(L) L.emphT = setTimeout(() => b.classList.remove('emph'), 280); }
function react(txt){ const b = $('#tbox'); if(!b) return; const old = b.querySelector('.react'); if(old) old.remove();
  const d = document.createElement('div'); d.className = 'react'; d.textContent = txt; b.appendChild(d); setTimeout(() => d.remove(), 2000); }
function boardWrite(emoji, word){ const e = document.getElementById('bwE'), t = document.getElementById('bwT'); if(!t) return;
  e.textContent = emoji || '✏️'; t.textContent = word; t.setAttribute('font-size', word.length > 10 ? 17 : word.length > 7 ? 21 : 26);

/* ---- speaking queue ---- */
function enqueue(s){ s = s.replace(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+/g,'').replace(/\s+/g,' ').trim(); if(!/[A-Za-z0-9]/.test(s)) return; L.queue.push(s); pump(); }
function pump(){
  if(!L) return;
  if(L.speaking) return;
  if(!L.queue.length){ if(L.streamDone) teacherFinished(); return; }
  const s = L.queue.shift(); L.speaking = true; setState('speaking');
  if(L.firstWave){ L.firstWave = false; setPose('wave', 2800); }
  { const tb = $('#tbox'); if(tb) tb.classList.toggle('ask', /\?\s*$/.test(s)); }
  speakOne(s, false, () => { if(!L) return; L.speaking = false; pump(); });
}
function speakOne(text, slow, done){
  let finished = false; const fin = () => { if(finished) return; finished = true; clearTimeout(guard); stopMouth(); if(L) setMouth('rest'); done && done(); };
  const words = text.split(/\s+/).length; const guard = setTimeout(fin, (slow?700:420)*words + 2500);
  const rate = slow ? 0.7 : (DB.kids[L.kid].level <= 6 ? 0.88 : 0.96);
  const perChar = Math.round(62 / rate);
  if(!('speechSynthesis' in window)){ mouthWalk(text, perChar); setTimeout(fin, 300*words); return; }
  try{ const u = new SpeechSynthesisUtterance(text); const male = L && !teacherOf(L.kid).female; u.lang = 'en-US'; u.rate = rate; u.pitch = male ? .88 : 1.04;
    let gotBoundary = false;
    u.onstart = () => { setTimeout(() => { if(!gotBoundary && !finished) mouthWalk(text, perChar); }, 250); };
    u.onboundary = e => { if(e.name && e.name !== 'word') return; gotBoundary = true; const w = text.slice(e.charIndex).split(/\s/)[0] || ''; mouthWalk(w, perChar);
      const clean = w.replace(/[^A-Za-z]/g,''); if(clean.length >= 7 || /[!?]$/.test(w) || (/^[A-Z]/.test(clean) && clean !== 'I' && e.charIndex > 0)) emph(); };
    u.onend = fin; u.onerror = fin; speechSynthesis.speak(u); }catch(e){ fin(); }
}
function sayAll(text, slow){ L.queue = []; L.streamDone = true; L.speaking = true; setState('speaking'); speakOne(text, slow, () => { if(!L) return; L.speaking = false; teacherFinished(); }); }
function interrupt(listenAfter){
  if(!L) return;
  if(L.ctl){ try{ L.ctl.abort(); }catch(e){} L.ctl = null; }
  L.queue = []; L.streamDone = true; L.speaking = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(listenAfter) startListening(true); else setState('idle');
}

/* ---- teacher turn (streaming) ---- */
function parseTags(full){
  const out = {mood:null, board:null, fix:null, ar:'', stage:null, end:false};
  const m = full.match(/^\s*\[MOOD:([a-z]+)\]/i); if(m) out.mood = m[1].toLowerCase();
  const re = /\[(BOARD|FIX|AR|STAGE|END)(?::([^\]]*))?\]/gi; let x;
  while((x = re.exec(full))){ const tag = x[1].toUpperCase(), v = (x[2]||'').trim(), p = v.split('|').map(s => s.trim());
    if(tag === 'BOARD') out.board = {word:p[0], emoji:p[1]||'', ar:p[2]||'', example:p[3]||''};
    else if(tag === 'FIX') out.fix = {wrong:p[0]||'', right:p[1]||'', tip:p[2]||''};
    else if(tag === 'AR') out.ar = v; else if(tag === 'STAGE') out.stage = v.toLowerCase(); else if(tag === 'END') out.end = true; }
  return out;
}
function spokenOf(full){ let s = full.replace(/^\s*\[MOOD:[a-z]*\]?/i,''); const i = s.search(/\[(BOARD|FIX|AR|STAGE|END)|\n\s*\[/i); if(i >= 0) s = s.slice(0,i); s = s.replace(/\[[^\]]*$/,''); return s; }
function cleanForHistory(full){ return full.trim() || '[MOOD:happy] ...'; }

async function teacherTurn(userText){
  if(!L || L.done) return;
  stopListening();
  const lesson = L, m = elapsedMin();
  lesson.history.push({role:'user', content:`[minute ${m}] ${userText}`});
  setState('thinking');
  const msgs = lesson.history.slice(-40); while(msgs.length && msgs[0].role !== 'user') msgs.shift();
  const apiMsgs = msgs.map((x,i) => i === msgs.length-1 ? {role:x.role, content:[{type:'text', text:x.content, cache_control:{type:'ephemeral'}}]} : {role:x.role, content:x.content});
  lesson.ctl = new AbortController(); lesson.streamDone = false; lesson.queue = [];
  let full = '', sent = 0, moodSet = false;
  const sub = $('#sub');
  try{
    for await (const t of streamClaude({model:LIVE_MODEL, max_tokens:400, system:[{type:'text', text:lesson.rules, cache_control:{type:'ephemeral'}}], messages:apiMsgs}, lesson.ctl.signal)){
      if(L !== lesson) return;
      full += t;
      if(!moodSet){ const mm = full.match(/^\s*\[MOOD:([a-z]+)\]/i); if(mm){ moodSet = true; setMood(mm[1].toLowerCase()); } else if(full.length > 20 && !/^\s*\[/.test(full)) moodSet = true; }
      if(!moodSet) continue;
      const spoken = spokenOf(full);
      if(sub) sub.innerHTML = esc(spoken);
      const rest = spoken.slice(sent); const mm2 = rest.match(/^[\s\S]*[.!?](?=\s)/);
      if(mm2){ enqueue(mm2[0]); sent += mm2[0].length; }
    }
    if(L !== lesson) return;
    const spokenRaw = spokenOf(full); const rest = spokenRaw.slice(sent); if(rest.trim()) enqueue(rest);
    const spoken = spokenRaw.trim();
    const tags = parseTags(full);
    if(!moodSet && tags.mood) setMood(tags.mood);
    lesson.lastSay = spoken; lesson.tw += countWords(spoken); updateTalk();
    lesson.history.push({role:'assistant', content:cleanForHistory(full)});
    if(sub) sub.innerHTML = esc(spoken) + (tags.ar ? `<div class="ar">${esc(tags.ar)}</div>` : '');
    if(tags.board && tags.board.word) showBoard(tags.board);
    showFix(tags.fix);
    if(tags.end && (lesson.trial || elapsedMin() >= MIN_MINUTES)) lesson.endSeen = true;
    lesson.ctl = null; lesson.streamDone = true; pump();
  }catch(e){
    if(L !== lesson) return;
    lesson.ctl = null; lesson.streamDone = true; lesson.history.pop();
    if(e && e.name === 'AbortError') return;
    let msg = 'انقطع الاتصال بالمعلمة. تأكد من الإنترنت ثم اضغط «حاول مرة ثانية».';
    if(e && e.status === 401) msg = 'مفتاح التشغيل غير صحيح. اطلب من ولي الأمر تحديثه من لوحته.';
    else if(e && (e.status === 429 || e.status === 529)) msg = 'الخدمة مزدحمة الآن. انتظر لحظة ثم اضغط «حاول مرة ثانية».';
    else if(e && e.status === 400 && /credit|billing|limit/i.test(e.body||'')) msg = 'رصيد التشغيل انتهى أو وصل للحد الشهري. أخبر ولي الأمر.';
    setState('idle');
    if(sub){ sub.innerHTML = `<div class="ar">${msg}</div><div style="text-align:right;margin-top:8px"><button class="btn sm" id="retry" type="button">حاول مرة ثانية</button></div>`;
      $('#retry').onclick = () => teacherTurn(userText); }
    console.warn(e);
  }
}
function teacherFinished(){
  if(!L) return;
  if(L.endSeen){ finishLesson(); return; }
  if(L.state === 'listening') return;

}
function showBoard(b){ const el = $('#boardBox'); if(!el) return; boardWrite(b.emoji, b.word); setPose('point', 3000); look(6,-5); setTimeout(() => { if(L) look(0,0); }, 3000);
  el.innerHTML = `<div class="board"><button id="bw" aria-label="اسمع الكلمة"><div class="emo">${esc(b.emoji)}</div><div class="w">${esc(b.word)}</div></button>${b.ar?`<div style="font-weight:700">${esc(b.ar)}</div>`:''}${b.example?`<div class="ex">${esc(b.example)}</div>`:''}<div class="small" style="opacity:.8">اضغط الكلمة لتسمعها ببطء</div></div>`;

/* ---- listening ---- */
function onMicTap(){
  if(!L || L.done) return;

  interrupt(true);
}
function startListening(fromTap){
  if(!L || L.done) return;
  if(!SR || !micOK){ setState('tap'); return; }
  stopListening();
  if(!L.listenStart) L.listenStart = Date.now();
  let text = '';
  const rec = new SR(); L.rec = rec; rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
  const you = $('#you');
  rec.onresult = e => { let t = ''; for(const r of e.results) t += r[0].transcript; if(t.split(' ').length !== text.split(' ').length && Math.random() < .5) nod(); text = t;
    if(you){ you.hidden = false; you.classList.add('live'); you.textContent = t; }
    clearTimeout(L.silT); L.silT = setTimeout(() => { try{ rec.stop(); }catch(x){} }, SILENCE_MS); };
  rec.onerror = e => { if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ if(fromTap){ micOK = false; } if(L && L.rec === rec){ L.rec = null; } setState('tap'); } };
  rec.onend = () => { if(!L || L.rec !== rec) return; L.rec = null; clearTimeout(L.silT);
    if(text.trim()){ L.listenStart = 0; clearTimeout(L.nudgeT); studentSaid(text.trim()); return; }
    if(L.state === 'listening'){ if(Date.now() - L.listenStart > NUDGE_MS){ L.listenStart = 0; teacherTurn('(student was silent)'); } else startListening(false); } };
  try{ rec.start(); setState('listening'); }catch(e){ L.rec = null; setState('tap'); }
  clearTimeout(L.nudgeT); L.nudgeT = setTimeout(() => { if(L && L.state === 'listening' && !text.trim()){ try{ rec.stop(); }catch(x){} } }, NUDGE_MS + 500);
}
function stopListening(submit){
  if(!L) return; clearTimeout(L.silT); clearTimeout(L.nudgeT);
  const r = L.rec; if(!r) return;
  if(submit){ try{ r.stop(); }catch(e){} return; }

  if(L.state === 'listening') setState('idle');
}

  teacherTurn(`Student: ${text}`);
}

  ov.querySelector('#f_save').onclick = () => {
    const v = id => ov.querySelector(id).value.trim(), err = ov.querySelector('#f_err');
    const ar = v('#f_ar'), en = v('#f_en'), user = v('#f_user').toLowerCase(), pass = v('#f_pass'), level = Number(v('#f_lv')), birth = v('#f_b'), boy = v('#f_g') === '1', bal = Math.max(0, Number(v('#f_bal'))||0), time = v('#f_t');
    const days = []; for(let i=0;i<7;i++) if(ov.querySelector('#f_d'+i).checked) days.push(i);
    if(!ar || !en){ err.textContent = 'اكتب الاسم بالعربي والإنجليزي.'; return; }
    if(!/^[a-z0-9_.-]{3,20}$/.test(user)){ err.textContent = 'اسم المستخدم: 3 أحرف إنجليزية أو أرقام على الأقل، بدون مسافات.'; return; }
    if(pass.length < 4){ err.textContent = 'كلمة المرور 4 أحرف على الأقل.'; return; }
    if(kidIds().some(x => x !== k && DB.kids[x].user === user) || user === DB.parent.user){ err.textContent = 'اسم المستخدم مستخدم من قبل.'; return; }
    if(!days.length || !time){ err.textContent = 'اختر يوماً واحداً على الأقل ووقت الحصة.'; return; }
    if(!birth){ err.textContent = 'اختر تاريخ الميلاد.'; return; }
    if(k){
      Object.assign(DB.kids[k], {ar, en, user, pass, birth, boy});
      setLevel(k, level);
      DB.balance[k] = bal;
      const cur = periodAt(k, new Date());
      if(JSON.stringify(cur.days.slice().sort()) !== JSON.stringify(days.slice().sort()) || cur.time !== time){
        const ps = DB.sched[k].periods;
        if(ps.length === 1 && new Date(ps[0].from) > new Date()) ps[0] = {from:ps[0].from, days, time}; else ps.push({from:nowLocal(), days, time});
      }
      save(); toast('تم حفظ التعديلات');
    } else {
      let id = user.replace(/[^a-z0-9]/g,'') || 'kid'; while(DB.kids[id]) id += '1';
      DB.kids[id] = {id, ar, en, user, pass, level, birth, boy, cefr:LEVEL_CEFR[level]};
      DB.balance[id] = bal;
      const t = new Date(); t.setDate(t.getDate()+1);
      DB.sched[id] = {periods:[{from:`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T00:00`, days, time}], cancel:[], extra:[]};
      ensureKidShape(id); save(); toast(`تم إنشاء حساب ${ar} 🎉`);
    }
    ov.remove(); renderParent();
  };
  if(k) ov.querySelector('#f_del').onclick = () => {
    const c = overlay(`<h2>حذف حساب ${esc(kid.ar)}؟</h2><p style="margin:0">تُحذف كل بياناته من هذا الجهاز: الجدول والتقارير والنقاط والمكتبة. لا يمكن التراجع.</p><div class="chips"><button class="btn danger" id="yes">نعم، احذف</button><button class="btn" id="no">رجوع</button></div>`);
    c.querySelector('#no').onclick = () => c.remove();
    c.querySelector('#yes').onclick = () => { ['kids','balance','profiles','progress','live','sched','books'].forEach(f => { if(DB[f]) delete DB[f][k]; });
      DB.attendance = DB.attendance.filter(a => a.kid !== k); DB.reports = DB.reports.filter(r => r.kid !== k); DB.certs = DB.certs.filter(r => r.kid !== k);
      save(); c.remove(); ov.remove(); toast('تم حذف الحساب'); renderParent(); };
  };
}
