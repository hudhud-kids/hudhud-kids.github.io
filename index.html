<style>
/* One bright classroom look: warm orange brand, sky-blue teacher, white boards */
@font-face{font-family:"Dubai";src:url(fonts/dubai-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dubai";src:url(fonts/dubai-medium.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Dubai";src:url(fonts/dubai-bold.woff2) format("woff2");font-weight:700 900;font-display:swap}
:root{
  color-scheme: light;
  --brand:#F05A38; --brand-ink:#B2391C; --brand-soft:#FFE6DD; --teal:#14B8A6; --teal-ink:#0F766E;
  --bg:#FFF6EE; --surface:#FFFFFF; --fg:#2B1B0F; --muted:#86695A; --line:#F0DCCB;
  --good:#15803D; --good-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --sky:#3B7BE8; --sky-soft:#E3EEFF; --gold:#E9A100;
  --font:"Dubai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --en:"Dubai",system-ui,-apple-system,sans-serif;
  --r:20px;
}
:root[data-theme="dark"]{color-scheme:dark;
  --brand:#FF7657; --brand-ink:#FFB4A0; --brand-soft:#3A1E16; --teal:#2DD4BF; --teal-ink:#5EEAD4;
  --bg:#15100C; --surface:#211912; --fg:#FBEEE3; --muted:#B99B86; --line:#3A2B1F;
  --good:#4ADE80; --good-soft:#123321; --bad:#F87171; --bad-soft:#3B1515;
  --sky:#7FA8F5; --sky-soft:#1C2A44; --gold:#FCC419}
:root[data-theme="dark"] .room{background:var(--bg)}
:root[data-theme="dark"] .reader{background:var(--bg)}
:root[data-theme="dark"] .rank,:root[data-theme="dark"] .daily{background:var(--surface)}
:root[data-theme="dark"] .badge.on{background:linear-gradient(160deg,#3A2E12,#3A2414)}
:root[data-theme="dark"] .flash{background:var(--surface)}
:root[data-theme="dark"] .hero .btn{background:#2B1B0F;color:#FFD3C6;border-color:#2B1B0F}
:root[data-theme="dark"] .react{background:#2B1B0F;color:#FFB4A0}
:root[data-theme="dark"] .ov{background:rgba(0,0,0,.65)}
:root[data-theme="dark"] .avatar{border-color:var(--surface)}
:root[data-theme="dark"] .tbox svg{filter:brightness(.92)}
:root[data-theme="dark"] .w.hl{background:#B8860B;color:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.ltr{direction:ltr;unicode-bidi:isolate}
.en{font-family:var(--en)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
.logo{display:inline-flex;align-items:center;gap:6px;direction:rtl;font-family:var(--font);font-weight:800}
.logo .hh{width:1.9em;height:1.8em;flex:none}
.logo .t{color:var(--brand);font-size:1.45em;font-family:var(--font);line-height:1}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.big{padding:14px 30px;font-size:1.15rem}
.btn.sm{padding:6px 14px;font-size:.9rem;min-height:36px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:16px}
.g2{display:grid;gap:16px;grid-template-columns:1.25fr 1fr}
.g2e{display:grid;gap:16px;grid-template-columns:1fr 1fr;align-items:start}
@media (max-width:820px){.g2,.g2e{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:110px;direction:ltr;font-size:.8rem}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.ok{color:var(--good);font-weight:700}
.center{min-height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.panel{width:min(440px,100%);display:grid;gap:16px}
.panel .logo{font-size:1.9rem;justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 16px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--brand)}
.avatar.lg{width:100px;height:100px;font-size:2.2rem}
.hero{background:linear-gradient(135deg,#F05A38,#FF8A63);color:#fff;border:0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .eyebrow{font-size:.88rem;opacity:.92}
.hero h1{font-size:1.65rem;font-family:var(--en)}
.hero .btn{background:#fff;color:var(--brand-ink);border-color:#fff}
.count{font-size:2rem;font-weight:800;line-height:1.15}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.bal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bal .v{font-size:2.4rem;font-weight:800}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-block:10px}
.bar i{display:block;height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border-radius:99px;padding:4px 12px;font-weight:700;font-size:.9rem}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ledger{list-style:none;margin:12px 0 0;padding:0}
.ledger li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.amt{font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.amt.good{color:var(--good)} .amt.bad{color:var(--bad)}
.dots{display:flex;gap:8px;margin-block:10px}
.dots span{width:32px;height:32px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.dots span.on{background:var(--good);border:0;color:#fff}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin-top:12px}
.book{border-radius:12px 4px 4px 12px;padding:14px 12px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-decoration:none;color:#fff}
.book .bt{font-weight:800;line-height:1.3;direction:ltr;text-align:left;font-family:var(--en)}
.book .ba{font-size:.8rem;opacity:.92}
.book.locked{background:var(--line)!important;color:var(--muted)}
.book.locked .bt{filter:blur(3px)}
.hist{display:grid;gap:10px;margin-top:10px}
.hist .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.stars{color:var(--gold);letter-spacing:2px;direction:ltr}

/* ===== classroom ===== */
.room{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 30% 20%,#FFF1E3,var(--bg) 60%)}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.rbar .ttl{flex:1;min-width:160px;font-weight:800;font-family:var(--en);direction:ltr;text-align:right}
.timer{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:4px 14px}
.timer.over{background:var(--bad-soft);color:var(--bad)}
.rbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,46%) 1fr;gap:0}
@media (max-width:780px), (orientation:portrait) and (max-width:1100px){.rbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.tbox{width:min(520px,100%)}
@media (orientation:portrait) and (min-width:700px) and (max-width:1100px){.tbox{width:min(500px,72vw)!important}.stage{padding:16px}.side{padding-top:4px}.sub{font-size:1.6rem}}
.stage{display:grid;place-items:center;padding:12px 16px;position:relative}
.tbox{position:relative;display:grid;justify-items:center}
@media (max-width:780px){.tbox{width:min(240px,62vw)}.stage{padding:6px 16px}.sub{font-size:1.2rem;min-height:70px}}
.tbox svg{width:100%;height:auto;display:block;overflow:visible;direction:ltr}
.tname{font-family:var(--en);font-weight:800;color:var(--sky);margin-top:-6px}
.state{margin-top:4px;font-weight:700;font-size:.95rem;min-height:1.6em;color:var(--muted)}
.askb{margin:6px auto 0;max-width:560px;background:var(--brand-soft,#fdeee8);border-radius:14px;padding:8px 12px;font-size:1rem;line-height:1.5;text-align:start}.askb .askl{font-size:.8rem;color:var(--muted);font-weight:700}.askb .en{font-weight:700;text-align:left;font-size:1.05rem}.askb .ar{font-size:.9rem;color:var(--muted);margin-top:2px}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:12px;overflow:auto}
.sub{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;direction:ltr;text-align:left;font-family:var(--en);font-size:1.45rem;font-weight:600;line-height:1.45;min-height:96px}
.sub .ar{direction:rtl;text-align:right;font-family:var(--font);font-size:1rem;color:var(--muted);font-weight:500;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.you{align-self:flex-end;max-width:90%;background:var(--brand);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;direction:ltr;text-align:left;font-family:var(--en);font-size:1.2rem;min-height:48px}
.you.live{background:var(--brand-soft);color:var(--brand-ink)}
.you.note{direction:rtl;text-align:right;font-family:var(--font);font-size:1rem;background:var(--brand-soft);color:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.board{background:#22543D;color:#F5F5DC;border:6px solid #A0703C;border-radius:14px;padding:14px;text-align:center;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
.board button{background:none;border:0;color:inherit;padding:0}
.board .emo{font-size:3rem;line-height:1.1}
.board .w{font-family:var(--en);font-size:2rem;font-weight:800;direction:ltr}
.board .ex{direction:ltr;font-style:italic;opacity:.9}
.fix{background:var(--surface);border:2px solid var(--good);border-radius:14px;padding:12px 14px}
.fix .wr{text-decoration:line-through;color:var(--bad);direction:ltr;text-align:left}
.fix .rt{color:var(--good);font-weight:800;direction:ltr;text-align:left;font-family:var(--en);font-size:1.15rem}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;background:var(--surface);border-top:1px solid var(--line)}
.micbig{width:76px;height:76px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(59,123,232,.35)}
.micbig svg{width:34px;height:34px}
.micbig.on{background:var(--bad);animation:pulse 1.1s infinite}
.micbig.wait{background:var(--muted)}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(220,38,38,.18)}}
.typer{display:flex;gap:8px;width:100%;max-width:640px}
.typer .input{direction:ltr;text-align:left}
.hint{margin:0;padding:8px 12px;border-radius:12px;background:var(--sky-soft);font-size:.9rem}
/* classroom frame: always exactly the screen (header / body / controls), so the controls never float over the text
   and nothing is pushed under them, in portrait and landscape, on phones and iPads */
.room{position:fixed;inset:0;height:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;z-index:1}
.rbar{padding-top:max(10px,env(safe-area-inset-top,0px))}
.rbody{min-height:0;overflow:hidden}
.stage{min-height:0;min-width:0}
.side>*{flex-shrink:0}
.slide{background:var(--surface);border:2px solid var(--brand);border-radius:18px;padding:12px 16px;display:grid;gap:8px;box-shadow:0 4px 14px rgba(240,90,56,.12)}
.sl-h{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--brand-ink);font-size:.9rem}
.sl-dots{display:flex;gap:4px}.sl-dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}.sl-dots i.ok{background:var(--good)}.sl-dots i.on{background:var(--brand);transform:scale(1.25)}
.slide .en{direction:ltr;text-align:left;font-family:var(--en)}
.sl-obj{font-size:1.25rem;font-weight:700;line-height:1.4}.sl-q{font-size:1.3rem;font-weight:700;line-height:1.4}
.sl-n{font-size:.75rem;color:var(--muted);direction:ltr;text-align:left}
.sl-w{font-size:1.7rem;font-weight:800;color:var(--brand)}.sl-def{font-size:1rem}.sl-ar{font-size:.9rem;color:var(--muted)}
.sl-game{font-weight:800;font-size:1.05rem;display:flex;gap:8px;align-items:center}.sl-pair{display:grid;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}.sl-pair:last-of-type{border-bottom:0}.sl-pair .sl-w{font-size:1.35rem}.sl-pair .sl-frame{font-size:1rem;padding:8px 10px}
.sl-star{background:#fff3c4;color:#7a5a00;border-radius:99px;padding:2px 10px;font-weight:800;font-size:.85rem;margin-inline-start:auto;margin-inline-end:8px}
.sl-frame{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:1.2rem;font-weight:600;line-height:1.5}.sl-frame .gap{color:var(--brand);letter-spacing:1px}
.sl-mini{display:flex;flex-wrap:wrap;gap:4px;direction:ltr}.sl-mini span{font-family:var(--en);font-size:.72rem;border-radius:99px;padding:1px 8px;background:var(--bg);color:var(--muted)}.sl-mini span.on{background:var(--brand);color:#fff}.sl-mini span.ok{background:var(--good-soft);color:var(--good)}
.sl-scene{font-style:italic;color:var(--muted);font-size:.92rem}.sl-part{font-weight:800;color:var(--sky);font-size:.85rem}
.sl-dlg p{margin:0 0 4px;line-height:1.5;font-size:1.02rem}.sl-dlg p.focus{background:#FFF3B0;border-radius:6px;padding:0 4px}.sl-x{color:var(--brand)}
.sl-qs{display:grid;gap:4px;font-weight:600;background:var(--sky-soft);border-radius:10px;padding:8px 10px}
.sl-t{font-weight:800;font-size:1.1rem}.sl-pts{margin:0;padding-left:18px;line-height:1.5}
.sl-hint{justify-self:start}.sl-hintx{background:var(--sky-soft);border-radius:10px;padding:8px 10px;font-size:.95rem}
/* lesson formats, topic cards, pictures */
.slide.fmt-game{border-color:#E8A317}.slide.fmt-mission{border-color:var(--sky)}.slide.fmt-story{border-color:#8b5cf6}
.sl-fmt{font-weight:800;color:var(--brand-ink);font-size:.95rem}.sl-game .sl-n{direction:rtl;text-align:right}
.sl-score{background:#e7f6ee;color:var(--good);border-radius:99px;padding:2px 10px;font-weight:800;font-size:.85rem;margin-inline-start:auto}.sl-score+.sl-star{margin-inline-start:0}
.sl-pair.emo{grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:12px;direction:ltr}.sl-pair.emo .sl-ar{direction:rtl;text-align:left}
.sl-pc{display:grid;gap:4px;min-width:0}.sl-emo{font-size:3.2rem;line-height:1;min-width:1.15em;text-align:center}
.sl-story{display:flex;gap:10px;align-items:center;direction:ltr;min-width:0}.sl-story .sl-scene{flex:1;min-width:0}.sl-semo{font-size:2.8rem;line-height:1;flex-shrink:0}
.sl-pick-h{font-weight:800;font-size:.9rem;color:var(--muted)}
.sl-pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.sl-card{display:grid;gap:2px;justify-items:center;align-content:start;text-align:center;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 6px;cursor:pointer;font:inherit;color:inherit;min-width:0;min-height:44px}
.sl-card .e{font-size:2rem;line-height:1.15}.sl-card b{font-size:.95rem}
.slide .sl-card small.en{font-size:.75rem;color:var(--muted);text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sl-card.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(240,90,56,.15)}
.sl-goals{display:flex;flex-wrap:wrap;gap:4px}.sl-goals span{font-size:.75rem;border-radius:99px;padding:2px 8px;background:var(--bg);color:var(--muted);font-weight:700}.sl-goals span.ok{background:var(--good-soft);color:var(--good)}
.sl-goals.full{display:grid;gap:6px;background:var(--sky-soft);border-radius:12px;padding:8px 10px}
.sl-prize{font-weight:800;font-size:1.25rem;color:var(--brand-ink)}.sl-prize b{color:var(--good)}
.sl-theme{font-weight:800;background:var(--brand-soft);border-radius:10px;padding:6px 10px}.sl-soft{opacity:.75;font-size:1.1rem}
.sl-fact{font-size:1.1rem;font-weight:600;background:#FFF3B0;border-radius:10px;padding:8px 10px;line-height:1.45}
@media (max-width:780px){.sl-emo{font-size:2.6rem}.sl-semo{font-size:2.3rem}.sl-card .e{font-size:1.7rem}}
.rc-v2{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px dashed var(--line)}.rc-v2 span{background:var(--bg);border-radius:99px;padding:3px 10px;font-size:.8rem}
@media (max-width:780px){.sl-w{font-size:1.35rem}.sl-q,.sl-obj{font-size:1.1rem}.sl-frame{font-size:1.05rem}.sl-dlg p{font-size:.95rem}}
.ctrl{padding-bottom:max(10px,env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.tbox{max-width:calc(100vh - 330px);max-width:calc(100dvh - 330px);min-width:150px}
.ctrl>.btn.sm .ic{font-size:1.1em}
@media (max-width:780px) and (orientation:portrait){
  .rbody{grid-template-rows:auto minmax(0,1fr)}
  .tbox{width:min(210px,56vw);max-width:30vh;max-width:30dvh;min-width:120px}
  .stage{padding:4px 16px 0}.tname{font-size:.9rem;margin-top:-4px}.state{font-size:.85rem;min-height:1.3em;margin-top:0}
  .rbar{padding-block:6px;gap:6px;padding-top:max(6px,env(safe-area-inset-top,0px))}.rbar .ttl{min-width:0}

/* English interface: translate rendered Arabic fragments (dictionary in content/i18n-en.json) */
let I18N = null, I18N_KEYS = [];
function trText(str){ if(!I18N || !/[؀-ۿ]/.test(str)) return str; let out = str;
  for(const k of I18N_KEYS){ if(out.indexOf(k) >= 0) out = out.split(k).join(I18N[k]); if(!/[؀-ۿ]/.test(out)) break; } return out; }

function trNode(root){
  if(!I18N) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = []; let n; while((n = w.nextNode())) nodes.push(n);
  for(const t of nodes){ if(!/[؀-ۿ]/.test(t.nodeValue) || (t.parentElement && SKIP_TR(t.parentElement))) continue; const v = trText(t.nodeValue); if(v !== t.nodeValue) t.nodeValue = v; }
  if(root.querySelectorAll) root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el => ['placeholder','title','aria-label'].forEach(a => { const v = el.getAttribute(a); if(v && /[؀-ۿ]/.test(v)) el.setAttribute(a, trText(v)); }));
}
async function setupLang(){
  if(PREF.lang !== 'en') return;
  document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; LOC = 'en-GB';
  try{ const r = await fetch('content/i18n-en.json', {cache:'no-cache'}); I18N = r.ok ? await r.json() : null; }catch(e){ I18N = null; }
  if(!I18N) return;
  I18N_KEYS = Object.keys(I18N).sort((a,b) => b.length - a.length);
  trNode(document.body);
  new MutationObserver(ms => { for(const m of ms){ if(m.type === 'characterData'){ const t = m.target; if(/[؀-ۿ]/.test(t.nodeValue) && !(t.parentElement && SKIP_TR(t.parentElement))){ const v = trText(t.nodeValue); if(v !== t.nodeValue) t.nodeValue = v; } }
    else m.addedNodes.forEach(nd => { if(nd.nodeType === 1) trNode(nd); else if(nd.nodeType === 3 && /[؀-ۿ]/.test(nd.nodeValue) && !(nd.parentElement && SKIP_TR(nd.parentElement))){ const v = trText(nd.nodeValue); if(v !== nd.nodeValue) nd.nodeValue = v; } }); } })
    .observe(document.body, {subtree:true, childList:true, characterData:true});
}

/* bring older saved data up to the current shape */
function normalize(){
  if(!DB) return;
  DB.sched = DB.sched || {}; DB.books = DB.books || {}; DB.curr = DB.curr || {}; DB.certs = DB.certs || []; DB.redeems = DB.redeems || [];
  DB.rewards = DB.rewards || [{id:'w1',name:'نصف ساعة لعب إضافية',emoji:'🎮',cost:300},{id:'w2',name:'آيس كريم',emoji:'🍦',cost:500},{id:'w3',name:'نزهة يختارها',emoji:'🎡',cost:1200},{id:'w4',name:'هدية مفاجأة',emoji:'🎁',cost:2000}];
  for(const k of Object.keys(DB.kids)) ensureKidShape(k);
  delete DB.periods;
  runMigrations();
}
/* one-time data changes requested by the parent (flag is synced, so each runs once per family) */
function runMigrations(){
  if(DEMO || !DB || !DB.kids || !DB.balance) return; DB.migr = DB.migr || {};
  if(false && !DB.migr.zeroBal1){ /* done on 2026-10-28; kept off so new devices (e.g. a guardian phone) never reset balances */
    DB.migr.zeroBal1 = new Date().toISOString();
    for(const k of Object.keys(DB.kids)){ try{ const l = ledger(k); DB.balance[k] = l.used; }catch(e){ DB.balance[k] = 0; } }
  }
}
function ensureKidShape(k){
  DB.profiles[k] = DB.profiles[k] || {};
  const p = DB.progress[k] = DB.progress[k] || {};
  if(p.pos == null) p.pos = Math.max(0, (p.lessonNo||1) - 1);
  p.mistakes = p.mistakes || []; p.words = p.words || []; p.focus = p.focus || ''; p.xp = p.xp || 0; p.quizzes = p.quizzes || [];
  p.badgesSeen = p.badgesSeen || []; p.early = p.early || 0; p.levelUps = p.levelUps || 0; p.daily = p.daily || {}; p.pre = p.pre || {};
  DB.live[k] = DB.live[k] || null;
  if(DB.balance[k] == null) DB.balance[k] = 2000;
  if(!DB.sched[k]){
    const per = [];
    for(const q of (DB.periods || [])) if(q[k]) per.push({from:q.from, days:q[k].days, time:q[k].time});
    DB.sched[k] = {periods: per.length ? per : [{from:todayISO()+'T00:00', days:[0,2,4], time:'17:00'}], cancel:[], extra:[]};
  }
  DB.books[k] = DB.books[k] || [];
}

/* ---- spaced recycling: DB.progress[k].learned = {expression: {lvl, key, at, ok, miss, due}} ----
   a correct use moves the next review to 2, 5, 12, then 30 days (by the number of correct uses); a miss brings it back tomorrow */
const REC_DAYS = [2, 5, 12, 30], REC_MAX = 300;
const normExp = s => String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
/* the fixed parts of an expression ("What do you think about …?" -> ["what do you think about"]) */
const expParts = w => String(w || '').split(/\.{2,}|…|\/|_{2,}|\(|\)/).map(normExp).filter(x => x.length > 1);
function expUsedIn(w, text){ const t = ` ${normExp(text)} `, ps = expParts(w); return ps.length > 0 && ps.every(p => t.includes(` ${p} `)); }
function recDue(ok, missed, now){ return new Date((now || Date.now()) + (missed ? 1 : REC_DAYS[Math.max(0, Math.min(REC_DAYS.length - 1, ok - 1))]) * 864e5).toISOString(); }
/* up to 4 expressions from EARLIER lessons that are due today (most overdue first, then the most missed) */
function recycleList(k, curKey, now){ const m = ((DB.progress[k] || {}).learned) || {}, t = now || Date.now();
  return Object.entries(m).filter(([w, x]) => w && x && x.key !== curKey && Date.parse(x.due) <= t)
    .sort((a, b) => (Date.parse(a[1].due) - Date.parse(b[1].due)) || ((b[1].miss || 0) - (a[1].miss || 0))).slice(0, 4).map(([w, x]) => ({w, key:x.key, lvl:x.lvl, due:x.due})); }
/* after a lesson: today's expressions (teacher [GOT] or the judge saw them) and the recycled ones ([REC:...] tags) */
function updateLearned(k, lesson, judgeUsed, recUsed, now){
  const v = lesson && lesson.v2; if(!v) return null; now = now || Date.now();
  const p = DB.progress[k], m = p.learned = p.learned || {}, lvl = DB.kids[k].level, key = `${lvl}-${lesson.plan.ui}-${lesson.plan.li}`, iso = new Date(now).toISOString();
  const jd = (judgeUsed || []).map(normExp), out = {ok:[], miss:[]};
  (v.sc.expressions || []).forEach((e, i) => { const w = e && e.w; if(!w) return;
    const ok = !!v.got['exp' + i] || jd.includes(normExp(w)), si = v.steps.findIndex(s => s.k === 'exp' && (s.pair || []).includes(i)), reached = si >= 0 && (si < v.i || !!v.doneAll);
    if(!ok && !reached) return;   // the lesson never got to this word game: no verdict
    const it = m[w] || {lvl, key, at:iso, ok:0, miss:0};
    if(ok){ it.ok++; it.due = recDue(it.ok, false, now); out.ok.push(w); } else { it.miss++; it.due = recDue(it.ok, true, now); out.miss.push(w); }
    it.seen = iso; m[w] = it; });
  const ru = (recUsed || []).map(normExp);
  (v.rec || []).forEach(r => { const it = m[r.w]; if(!it) return; const ok = ru.includes(normExp(r.w));
    if(ok){ it.ok++; it.due = recDue(it.ok, false, now); } else { it.miss++; it.due = recDue(it.ok, true, now); } it.seen = iso; });
  const keys = Object.keys(m); if(keys.length > REC_MAX) keys.sort((a, b) => Date.parse(m[a].seen || m[a].at) - Date.parse(m[b].seen || m[b].at)).slice(0, keys.length - REC_MAX).forEach(x => delete m[x]);
  return out; }

/* =============== SCHEDULE + WALLET =============== */
function periodAt(k, t){ const ps = DB.sched[k].periods; let p = ps[0]; for(const q of ps){ if(new Date(q.from) <= t) p = q; } return p; }
function slotsFor(k, until){
  const S = DB.sched[k], ps = S.periods, out = [], cancel = new Set(S.cancel);
  const start = new Date(ps[0].from); const d = new Date(start); d.setHours(0,0,0,0);
  while(d <= until){
    for(const p of ps){
      if(!p.days.includes(d.getDay())) continue;
      const [h,m] = p.time.split(':').map(Number); const t = new Date(d); t.setHours(h,m,0,0);
      if(t <= until && t >= start && periodAt(k, t) === p && !cancel.has(keyOf(t))) out.push({t, key:keyOf(t), extra:false});
    }
    d.setDate(d.getDate()+1);
  }
  for(const x of S.extra){ const t = fromKey(x); if(t <= until && !cancel.has(x)) out.push({t, key:x, extra:true}); }
  const seen = new Set(); return out.filter(s => !seen.has(s.key) && seen.add(s.key)).sort((a,b) => a.t - b.t);
}
/* lesson price history per child: a change applies from the moment it is made, past lessons keep their price */
function priceAt(k, t){ const h = (DB.prices && DB.prices[k]) || []; let p = DB.perLesson; for(const x of h){ if(new Date(x.from) <= t) p = x.price; } return p; }
const priceNow = k => priceAt(k, new Date(Date.now() + 365*864e5));
function setPrice(k, price){ DB.prices = DB.prices || {}; const h = DB.prices[k] = DB.prices[k] || []; if(priceNow(k) === price) return; if(!h.length) h.push({from:'2000-01-01T00:00:00Z', price:DB.perLesson}); h.push({from:new Date().toISOString(), price}); }
function ledger(k){
  const now = new Date(), bal = DB.balance[k];
  const all = slotsFor(k, new Date(now.getTime()+62*864e5));
  const att = new Set(DB.attendance.filter(a => a.kid === k).map(a => a.slot));
  const lv = DB.live[k];
  const rows = []; let open = null, next = null, used = 0, ended = false; const upcoming = [];
  const charge = (s, st) => { const price = priceAt(k, s.t); if(used + price > bal){ ended = true; return; } used += price; rows.push({t:s.t, key:s.key, st, extra:s.extra, price}); };
  for(const s of all){
    const {t, key} = s;
    if(att.has(key)){ if(!ended) charge(s, 'att'); continue; }
    if(now - t > OPEN_AFTER*60e3){
      if(lv && lv.slot === key && now - new Date(lv.startedAt) < 60*60e3){ if(!open) open = s; }
      else if(!ended) charge(s, 'miss');
    } else if(now >= t - OPEN_BEFORE*60e3){ if(!open) open = s; }
    else { if(!next) next = s; upcoming.push(s); }
  }
  if(!ended && bal - used < priceNow(k)) ended = true;
  if(open && DB.live[k] && DB.live[k].slot === open.key) open.resumed = true;
  const attended = rows.filter(r => r.st==='att').length, missed = rows.length - attended;
  const green = rows.filter(r => r.st==='att').reduce((a,r) => a + r.price, 0), red = used - green;
  let run = 0, gifts = 0, best = 0; for(const r of rows){ if(r.st==='att'){ run++; best = Math.max(best, run); if(run%5===0) gifts++; } else run = 0; }
  return {rows, open: ended ? null : open, next: ended ? null : next, upcoming, attended, missed, green, red, remaining:bal-used, used, bal, run, best, gifts, ended, price:priceNow(k), left:Math.floor((bal-used)/priceNow(k))};
}
/* months: the minimum of 12 applies to every full month after the start month */
function monthKey(t){ return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; }
function monthCount(k, mk){ const [y,m] = mk.split('-').map(Number); const end = new Date(y, m, 0, 23, 59); return slotsFor(k, end).filter(s => monthKey(s.t) === mk).length; }
function monthExempt(k, mk){ return monthKey(new Date(DB.sched[k].periods[0].from)) === mk; }
const MIN_MONTH = 12;
function canDrop(k, t){ const mk = monthKey(t); if(monthExempt(k, mk)) return true; return monthCount(k, mk) - 1 >= MIN_MONTH; }
function conflict(k, t, ignoreKey){
  for(const other of kidIds()){
    const near = slotsFor(other, new Date(t.getTime()+864e5)).filter(s => s.key !== ignoreKey && Math.abs(s.t - t) < (other === k ? 45 : 30)*60e3);
    if(near.length) return other;
  }
  return null;
}
function cancelSlot(k, key){ const S = DB.sched[k]; if(S.extra.includes(key)) S.extra = S.extra.filter(x => x !== key); else S.cancel.push(key); save(); }
function addExtra(k, t){ DB.sched[k].extra.push(keyOf(t)); DB.sched[k].cancel = DB.sched[k].cancel.filter(x => x !== keyOf(t)); save(); }

function slotPicker(k, moveKey){
  const now = new Date(), times = []; for(let h=8; h<=22; h++) for(const m of [0,15,30,45]) times.push(`${pad(h)}:${pad(m)}`);
  // first time that is at least 15 minutes from now (today), else 17:00
  const firstOk = times.find(t => { const [h, m] = t.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d - now >= BOOK_LEAD; }) || '17:00';
  const old = moveKey ? fromKey(moveKey) : null;
  const ov = overlay(`<h2>${moveKey ? 'تغيير موعد الحصة' : 'حجز حصة إضافية'}</h2>
    ${old ? `<p class="small muted" style="margin:0">الموعد الحالي: ${fmtDay(old)} · ${fmtTime(old)}</p>` : `<p class="small muted" style="margin:0">تُخصم ${priceNow(k)} ريال من رصيدك، وإذا ما حضرتها تصير حمراء.</p>`}

    const [y,mo,da] = d.split('-').map(Number), [h,mi] = tm.split(':').map(Number), t = new Date(y, mo-1, da, h, mi);
    if(t - Date.now() < BOOK_LEAD){ err.textContent = 'اختر موعداً بعد ربع ساعة على الأقل من الآن.'; return; }
    if(moveKey && old - Date.now() < BOOK_LEAD){ err.textContent = 'الحصة تبدأ بعد أقل من ربع ساعة، ما يمكن تغيير موعدها الآن.'; return; }

    if(moveKey){ if(monthKey(t) !== monthKey(old) && !canDrop(k, old)){ err.textContent = `نقل الحصة لشهر آخر يجعل حصص ${fmtMonth(old)} أقل من ${MIN_MONTH}. اختر يوماً في نفس الشهر.`; return; }
      cancelSlot(k, moveKey); addExtra(k, t); toast('تم تغيير الموعد'); }
    else { const L1 = ledger(k), booked = L1.upcoming.concat(L1.open ? [L1.open] : []).filter(s => s.t < new Date(Date.now() + 35*864e5)).reduce((a, s) => a + priceAt(k, s.t), 0);
      if(L1.remaining - booked < priceAt(k, t)){ err.textContent = 'رصيدك ما يكفي لحصة إضافية فوق حصصك المحجوزة. اطلب من ولي أمرك شحن الرصيد.'; return; } addExtra(k, t); toast('تم حجز الحصة الإضافية 🎉'); }
    ov.remove(); renderKid(k);
  };
}

/* =============== QUIZ =============== */
function runQuiz(k, quiz, title, onDone, max){
  const items = (quiz||[]).filter(q => q && (q.type === 'order' ? Array.isArray(q.words) && q.answer : Array.isArray(q.options) && q.options.length > 1)).slice(0, max || 6);
  if(!items.length){ onDone && onDone(null); return; }
  let i = 0, score = 0;
  const ov = document.createElement('div'); ov.className = 'ov'; document.body.appendChild(ov);
  const norm = s => String(s).toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
  const show = () => {
    if(i >= items.length) return finish();
    const q = items[i];
    const head = `<div class="qhead"><span class="small muted">سؤال ${i+1} من ${items.length}</span><div class="qbar"><i style="width:${i/items.length*100}%"></i></div></div>`;
    if(q.type === 'order'){
      const pool = q.words.map((w,j) => ({w, j})).sort(() => Math.random() - .5); let built = [];
      ov.innerHTML = `<div class="card quiz">${head}<h2>رتّب الكلمات لتكوّن جملة صحيحة</h2>${q.ar?`<p class="small muted" style="margin:0">${esc(q.ar)}</p>`:''}
        <div class="built en" id="built"></div><div class="pool en" id="pool"></div><div class="chips"><button class="btn primary" id="chk">تحقق</button><button class="btn sm" id="rst">مسح</button></div><div id="fb"></div></div>`;
      const draw = () => { ov.querySelector('#built').innerHTML = built.map((b,x) => `<button class="wtile on" data-b="${x}">${esc(b.w)}</button>`).join('') || '<span class="muted small" style="font-family:var(--font)">اضغط الكلمات بالترتيب</span>';
        ov.querySelector('#pool').innerHTML = pool.map((p,x) => built.includes(p) ? '' : `<button class="wtile" data-p="${x}">${esc(p.w)}</button>`).join('');
        ov.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { built.push(pool[Number(b.dataset.p)]); draw(); });
        ov.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { built.splice(Number(b.dataset.b),1); draw(); }); };
      draw();
      ov.querySelector('#rst').onclick = () => { built = []; draw(); };
      ov.querySelector('#chk').onclick = () => { if(built.length < pool.length) return; const ok = norm(built.map(b => b.w).join(' ')) === norm(q.answer); feedback(ok, q.answer); };
    } else {
      ov.innerHTML = `<div class="card quiz">${head}<h2 class="en" style="direction:ltr;text-align:left">${esc(q.q)}</h2>${q.ar?`<p class="small muted" style="margin:0">${esc(q.ar)}</p>`:''}
        <div class="opts">${q.options.map((o,x) => `<button class="opt en" data-o="${x}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
      ov.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const x = Number(b.dataset.o), ok = x === Number(q.answer);
        ov.querySelectorAll('[data-o]').forEach(o => { o.disabled = true; if(Number(o.dataset.o) === Number(q.answer)) o.classList.add('right'); });
        if(!ok) b.classList.add('wrong'); feedback(ok, q.options[Number(q.answer)]); });
    }
  };
  const feedback = (ok, right) => { if(ok) score++; const fb = ov.querySelector('#fb'); ov.querySelectorAll('#chk,#rst').forEach(b => b.disabled = true);
    if(!ok) hoopoeSays(pick(NUDGE), 'think', 2600); else if(Math.random() < .35) hoopoeSays(pick(PRAISE), 'happy', 1800);
    fb.innerHTML = `<div class="qfb ${ok?'good':'bad'}">${ok ? '✓ إجابة صحيحة! +10 نقاط' : `✗ الإجابة الصحيحة: <span class="en">${esc(right)}</span>`}</div><button class="btn primary" id="nx">${i+1 < items.length ? 'التالي' : 'النتيجة'}</button>`;
    try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(ok ? 'Great job!' : String(right)); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); }catch(e){}
    fb.querySelector('#nx').onclick = () => { i++; show(); }; };
  const finish = () => {
    const total = items.length, stars = score === total ? 3 : score >= total*0.6 ? 2 : 1, xp = score*10 + (score === total ? 20 : 0);
    addXP(k, xp);
    try{ if(SFX.running()){ SFX.chime(0); if(score === total) SFX.sparkle(.3); } }catch(e){}
    ov.innerHTML = `<div class="card quiz" style="text-align:center"><div class="bigbird">${hoopoeSVG(score === total ? 'cheer' : score >= total*0.6 ? 'happy' : 'think')}</div><div class="stars" style="font-size:2.6rem">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${score} من ${total}</h2>
      <p style="margin:0">${score === total ? 'علامة كاملة! أنت بطل 🏆' : score >= total*0.6 ? 'ممتاز! استمر 💪' : 'محاولة جيدة، راجع الدرس وستتحسن 🌱'}</p><div class="chip good" style="justify-self:center">+${xp} نقطة</div>
      <button class="btn primary big" id="qd">تم</button></div>`;
    ov.querySelector('#qd').onclick = () => { ov.remove(); onDone && onDone({score, total, stars, xp}); };
  };
  show();
}

It must feel exciting and age-appropriate (not babyish), with natural dialogue, and use vocabulary and grammar right at this level.
${kid.level <= 6 ? '7 pages, 2-4 short sentences per page.' : '8 pages, 3-5 sentences per page.'}
Return ONLY JSON:
{"title":"...","emoji":"one emoji","pages":[{"emoji":"2-3 emojis that illustrate the page","text":"..."}],"glossary":{"word":"Arabic meaning"},"questions":[{"q":"comprehension question","options":["...","...","..."],"answer":0}]}

const SPEEDS = [['slow','بطيء',.6],['normal','عادي',.95],['fast','سريع',1.12]];
function narratorVoices(){
  let vs = []; try{ vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); }catch(e){}
  const score = v => (/premium|استثنائي/i.test(v.name) ? 100 : /enhanced|neural|natural|online|محسّن|محسن/i.test(v.name) ? 70 : 0) + (/US|GB/i.test(v.lang) ? 5 : 0) + (/Ava|Zoe|Samantha|Allison|Aria|Jenny|Libby|Sonia|Evan|Nathan|Tom|Guy|Ryan/i.test(v.name) ? 10 : 0) - (/Fred|Albert|Bad|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Wobble|Zarvox|Superstar|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i.test(v.name) ? 200 : 0);
  return vs.map(v => ({v, s:score(v)})).sort((a,b) => b.s - a.s);
}
const voiceByName = n => n ? (narratorVoices().find(x => x.v.name === n)||{}).v || null : null;
const kidVoice = k => (k && DB.kids[k] && voiceByName(DB.kids[k].voice)) || null;
function narratorVoice(){ return null; if(typeof NARR_KID !== 'undefined' && kidVoice(NARR_KID)) return kidVoice(NARR_KID); const name = DB && DB.readVoice; const all = narratorVoices(); return (name && (all.find(x => x.v.name === name)||{}).v) || (all[0] && all[0].v) || voice; }
function characterVoice(main){ return null; const all = narratorVoices().map(x => x.v).filter(v => v !== main); return all.find(v => /premium|enhanced|استثنائي|محسّن|محسن/i.test(v.name)) || all[0] || main; }
const hasPremiumVoice = () => narratorVoices().some(x => x.s >= 70);

/* Split text into phrases with natural pauses; dialogue gets its own voice. */
function phrasesOf(text){
  const out = []; const re = /("[^"]+"|“[^”]+”|[^"“]+)/g; let m;
  while((m = re.exec(text))){
    const chunk = m[0], quoted = /^["“]/.test(chunk), base = m.index;
    const re2 = /[^.!?;,:—]+[.!?;,:—]*["”]?\s*/g; let n;
    while((n = re2.exec(chunk))){ const t = n[0]; if(!t.trim()) continue;
      const end = (t.trim().match(/[.!?;,:—]["”]?$/) || [''])[0];
      out.push({text:t, start:base + n.index, quoted, pause: /[.!?]/.test(end) ? 380 : /[;:—]/.test(end) ? 260 : /,/.test(end) ? 170 : 60, kind: /\?/.test(end) ? 'q' : /!/.test(end) ? 'ex' : 'st'}); }
  }
  return out;
}
/* Plays a text phrase by phrase. onWord(charIndex) for highlighting. Returns a controller {stop()}. */
function narrate(text, opts){ const o = Object.assign({speed:.95, onWord:null, onEnd:null}, opts||{}); return azOn() ? narrateAZ(text, o) : narrateWS(text, o); }
function narrateWS(text, opts){
  const o = Object.assign({speed:.95, onWord:null, onEnd:null}, opts||{});
  const main = narratorVoice(), other = characterVoice(main), ps = phrasesOf(text);
  let i = 0, stopped = false, timer = null;
  const next = () => {
    if(stopped) return; if(i >= ps.length){ o.onEnd && o.onEnd(); return; }
    const p = ps[i++]; let u; try{ u = new SpeechSynthesisUtterance(p.text.trim()); }catch(e){ o.onEnd && o.onEnd(); return; }
    u.lang = 'en-US';
    const jitter = (Math.random() - .5) * .04;
    u.rate = Math.max(.5, o.speed * (p.kind === 'ex' ? 1.04 : p.kind === 'q' ? .97 : 1) + jitter);
    u.pitch = (p.quoted ? 1.1 : 1) * (p.kind === 'ex' ? 1.05 : p.kind === 'q' ? 1.03 : 1);
    const local = p.text.trim(), lead = p.text.length - p.text.trimStart().length;
    let got = false; const words = []; let x = 0; for(const w of local.split(/\s+/)){ const at = local.indexOf(w, x); words.push(at); x = at + w.length; }
    u.onboundary = e => { if(e.name && e.name !== 'word') return; got = true; o.onWord && o.onWord(p.start + lead + e.charIndex); };
    u.onstart = () => { let j = 0; const step = 330 / u.rate; const tick = () => { if(got || stopped || j >= words.length) return; o.onWord && o.onWord(p.start + lead + words[j++]); timer = setTimeout(tick, step); }; timer = setTimeout(() => { if(!got) tick(); }, 120); };
    const done = () => { clearTimeout(timer); if(stopped) return; timer = setTimeout(next, p.pause / o.speed); };
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  };
  try{ speechSynthesis.cancel(); }catch(e){}
  next();
  return {stop(){ stopped = true; clearTimeout(timer); try{ speechSynthesis.cancel(); }catch(e){} }};
}

  const results = {};

function finishBook(k, book, results){
  const qv = book.__view || book;
  const qs = (qv.questions||[]).map(q => ({type:'mc', q:q.q, options:q.options, answer:q.answer}));
  const readPages = Object.keys(results||{}).length, readOk = readPages ? Math.round(Object.values(results).reduce((a,st) => { const v = Object.values(st); return a + (v.length ? v.filter(x => x === 1).length / v.length : 0); }, 0) / readPages * 100) : null;
  runQuiz(k, qs, qv.title, res => {
    const isPre = /^L\d+s/.test(book.id||''); const first = isPre ? DB.progress[k].pre[book.id] == null : !book.read;
    if(isPre){ DB.progress[k].pre[book.id] = res ? res.score : 0; if(first){ DB.progress[k].preAt = DB.progress[k].preAt || {}; DB.progress[k].preAt[book.id] = new Date().toISOString(); } }
    else { if(first) book.readAt = new Date().toISOString(); book.read = true; book.score = res ? res.score : 0; }
    let bonus = first ? 30 : 0; if(readOk != null && readOk >= 70){ bonus += 20; }
    if(bonus) addXP(k, bonus); if(readOk != null){ DB.progress[k].aloud = (DB.progress[k].aloud||[]).concat([{book:book.title, pct:readOk, at:new Date().toISOString()}]).slice(-30); }
    save(); toast(`📚 أنهيت القصة${bonus ? ` · +${bonus} نقطة` : ''}${readOk != null ? ` · قراءتك ${readOk}%` : ''}`); renderKid(k);
  });
}

function reviewCards(k){

}
function reviewCard(k){ const n = reviewCards(k).length; if(!n) return '';
  return `<section class="card"><div class="chips" style="justify-content:space-between"><h2>🃏 مراجعة سريعة</h2><button class="btn sm primary" id="revGo">ابدأ (${n} بطاقة)</button></div>

function startReview(k){
  const cards = reviewCards(k); let i = 0, rec = null, chunks = [], myUrl = null, stream = null;
  const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const ov = document.createElement('div'); ov.className = 'ov'; document.body.appendChild(ov);
  const say = (t, slow) => { try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = slow ? .65 : .88; speechSynthesis.speak(u); }catch(e){} };
  const stopStream = () => { if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } };
  const draw = () => {
    const c = cards[i]; myUrl = null;
    ov.innerHTML = `<div class="card quiz"><div class="qhead"><span class="small muted">بطاقة ${i+1} من ${cards.length}</span><div class="qbar"><i style="width:${(i+1)/cards.length*100}%"></i></div></div>
      <button class="flash en" id="fl"><span>${esc(c.front)}</span>${c.back ? `<small id="bk" hidden>${esc(c.back)}</small>` : ''}</button>
      <div class="chips" style="justify-content:center"><button class="btn" id="ls">🔊 استمع</button><button class="btn" id="lss">🐢 ببطء</button>
        ${canRec ? '<button class="btn" id="rc">🎙️ سجّل صوتي</button><button class="btn" id="pl" disabled>▶️ صوتي</button>' : ''}</div>
      <div class="small muted" id="rs" style="text-align:center"></div>
      <div class="chips"><button class="btn primary" id="nx">${i+1 < cards.length ? 'التالية' : 'إنهاء (+15 نقطة)'}</button><button class="btn" id="cl">إغلاق</button></div></div>`;
    ov.querySelector('#fl').onclick = () => { const b = ov.querySelector('#bk'); if(b) b.hidden = !b.hidden; say(c.front); };
    ov.querySelector('#ls').onclick = () => say(c.front); ov.querySelector('#lss').onclick = () => say(c.front, true);
    if(canRec){
      ov.querySelector('#rc').onclick = async () => {
        const btn = ov.querySelector('#rc'), rs = ov.querySelector('#rs');
        if(rec && rec.state === 'recording'){ rec.stop(); return; }
        try{ stream = stream || await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ rs.textContent = 'اسمح للميكروفون من الإعدادات لتسجيل صوتك.'; return; }
        chunks = []; rec = new MediaRecorder(stream); rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => { myUrl = URL.createObjectURL(new Blob(chunks, {type:rec.mimeType || 'audio/mp4'})); btn.textContent = '🎙️ سجّل مرة ثانية'; ov.querySelector('#pl').disabled = false; rs.textContent = 'اضغط «صوتي» ثم «استمع» وقارن.'; };
        rec.start(); btn.textContent = '⏹️ إيقاف'; rs.textContent = 'تكلم الآن…'; setTimeout(() => { if(rec && rec.state === 'recording') rec.stop(); }, 7000);
      };
      ov.querySelector('#pl').onclick = () => { if(myUrl) new Audio(myUrl).play(); };
    }
    ov.querySelector('#nx').onclick = () => { if(i+1 < cards.length){ i++; draw(); } else { stopStream(); addXP(k, 15); ov.remove(); toast('🃏 أنهيت المراجعة · +15 نقطة'); renderKid(k); } };
    ov.querySelector('#cl').onclick = () => { stopStream(); ov.remove(); };
    say(c.front);
  };
  draw();
}

let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const pref = [/Ava.*(Premium|استثنائي)/i,/Zoe.*(Premium|استثنائي)/i,/Ava.*(Enhanced|محسّن|محسن)/i,/Samantha.*(Premium|Enhanced|محسّن)/i,/(Premium|Enhanced|استثنائي|محسّن|محسن)/i,/Ava/i,/Samantha/i,/Allison/i,/Aria|Jenny|Google US/i];
  for(const re of pref){ const v = vs.find(v => re.test(v.name) && /US/i.test(v.lang)) || vs.find(v => re.test(v.name)); if(v){ voice = v; return; } }
  voice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null; }catch(e){} }

Conversation goal: ${plan.goal}.
Sentence patterns the child should build and use: ${plan.pattern}.${(() => { const kit = kitFor(kid.level, plan.ui, plan.li); return kit ? `\nThe child prepared these words before class: ${(kit.words||[]).map(w => w.w).join(', ')}. Use them as today's new words.` : ''; })()}${plan.round>1?' (Second time through this level: go deeper, use harder follow-up questions.)':''}

THE MOST IMPORTANT THING: CONVERSATION AND SENTENCE BUILDING, much more than vocabulary. The child must speak in full sentences and speak much more than you.
How the 25 minutes flow (each student message starts with [minute X]):
- words (0-4): warm greeting by nickname and one quick personal question. Then teach 4 or 5 NEW useful words for today's conversation, one at a time: put each on the board with [BOARD], say it, and ask the child to use it in a short sentence. Keep this part quick.
- talk (4-21): the heart of the lesson. A real, interesting conversation about today's goal, using today's sentence patterns. First model a pattern in a natural sentence, then ask open questions so the child builds their OWN sentences. When an answer is short (one word), help them expand it: "Can you say that in a full sentence?", "Why?", "Tell me more", "Add because...". Use role-plays, "imagine..." situations, stories and opinions. Mix in today's new words naturally.

- wrapup (23-25): specific praise about the sentences they built, goodbye, then [END].

GIVE THE CHILD THE SPEAKING TIME (very important):
- Every student message starts with [minute X · child talk Y% · goal Z%]. Y is the CHILD's share of all the words said so far (child words / all words). Your job is to get Y above Z.
- Keep your turns SHORT: one reaction (a few words) + ONE question. Maximum about 20 words, never a speech. If Y is below Z, be even shorter (under 12 words) and ask questions that need a long answer ("Tell me about...", "Why...?", "What happened next?").
- Make the child FINISH: when a sentence is incomplete, or the child skips the pattern, or changes the topic before finishing, do not move on. Say "Finish your sentence: I'd describe myself as... because..." or give the first words and wait. Only ask a new question after the child has said one complete sentence.
- Ask for one more sentence before you add anything: "Great! Can you give me an example?", "And then?", "Say it again with because".
- Never answer your own question, never give two questions at once, and never fill a silence with a long explanation.
- NEVER leave the child guessing. If the answer is wrong, unclear, off-task, or the child is silent or says "I don't know": say in one short sentence exactly what you want and give a HINT, never the answer: a sentence start with a gap ("My name is ...?"), the first word, or a clue. If the answer is wrong, say what is not right yet and let them try again. After 2 failed tries give two choices ("Is it A or B?"). Say the full correct answer only after 3 failed tries, then let the child say it.
- NEVER put the answer inside your question (wrong: "What's your name? Say: My name is Mohammad." right: "What's your name? Start with: My name is ...").
- EVERY reply must END with a question or a clear instruction to the child. Never end on an announcement ("Let's play a game!", "Get ready!"): say the game's first question in the same reply. When you add [NEXT], start the next step in the SAME reply with its first question.

- ${lvl}
- Spoken part: 1 to 3 short, natural sentences, like real speech (contractions, "Wow!", "Hmm", "Oh really?", laughter words). Always finish with a question or a clear invitation to speak.
- React to WHAT the child said (content first), like a real person, then continue.
- Correct mistakes the way great teachers do: react to the meaning, then recast the correct sentence naturally, and about half the time ask them to say it again. One correction at a time, never a list. Also add a [FIX] tag.
- The child's words come from speech recognition: ignore punctuation/capitals. Speech-to-text sometimes mishears children. If a word looks misheard (odd, out of place, a name, a word that sounds like another one), assume the recogniser made the mistake, not the child: answer what they most likely meant. Only ask them to say it again if you truly cannot understand the meaning. Never [FIX], correct or drill something that is probably a mishearing.

- If you get "(student was silent)", gently encourage: rephrase more simply.
- Stay on English learning. Never ask for personal details (address, phone, school name, passwords, photos). If off-topic, kindly bring them back.
- Never say you are an AI unless asked directly; you are ${teacherOf(k).name}.

Start DIRECTLY with the spoken text (nothing before it).
After the spoken text, optional tags each on its own line:
[BOARD:word|one emoji|Arabic meaning|short example sentence]
[FIX:what the child said wrong|correct version|very short Arabic explanation]
[AR:English word = Arabic translation]  (written only, for a word the child did not understand)
[STAGE:words|talk|review|wrapup]
[FLAG:short English reason]  (only for the CHILD SAFETY cases above)
[END]  (only in wrapup, after minute 23)
Last line, always: [MOOD:happy|excited|proud|laughing|surprised|thinking|encouraging]
No markdown, no emojis, and no Arabic letters in the spoken text, no other text outside this format.`;

function lessonSnap(lesson){

    localStorage.setItem(SNAP_KEY, JSON.stringify({v:1, at:Date.now(), kid:lesson.kid, trial:!!lesson.trial, freeReview:!!lesson.freeReview, slot:lesson.slot, n:lesson.n, plan:lesson.plan, rules:lesson.rules,

function resumeCheck(){

  if(WHO !== s.kid) return false;   // someone else is signed in: it simply expires
  if(!DB.kids[s.kid]) return drop();
  if(!s.trial){ // a real lesson: only while its slot is still open and not yet recorded (never charged or recorded twice)
    if((DB.attendance || []).some(a => a.kid === s.kid && a.slot === s.slot)) return drop();
    const led = ledger(s.kid); if(led.ended || !led.open || led.open.key !== s.slot) return drop(); }

/* =============== DEEPGRAM VOICE LESSON (trial engine, per child: DB.profiles[k].engine === 'dg') ===============
   One WebSocket to Deepgram's Voice Agent does the listening (Flux: knows when the child finished), the thinking (Claude,
   through our relay /ai/llm, so the key stays on the server) and the speaking (Aura-2), with natural barge-in.
   The teacher prompt and its tags are the same as the normal lesson: the relay removes the tags from what is spoken and
   hands them to the app as one "lesson_event" function call, which this file applies (slides, stars, board, end). */
const DG_URL = 'wss://agent.deepgram.com/v1/agent/converse';
function dgOn(k){ return !DEMO && relayOn() && ((DB.profiles || {})[k] || {}).engine === 'dg' && typeof WebSocket !== 'undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function dgNote(lesson, msg){ try{ liveFeed(lesson, 'x', '⚠ ' + msg); }catch(e){} console.warn('dg', msg); }
function dgStatus(lesson){ const v = lesson.v2; if(!v) return `minute ${elapsedMin()}`;
  return `[minute ${elapsedMin()} of ${LESSON_MIN} · child talk ${talkPct()}% · goal ${talkGoal(lesson.kid)}%${v2Header()}]`; }
function dgPrompt(lesson){ return lesson.rules + `

VOICE MODE: the child talks to you live; their words come to you as text from speech recognition. There is no header in front of their messages: the CURRENT STATUS below replaces it and is kept up to date by the app.
CURRENT STATUS: ${dgStatus(lesson)}`; }
async function dgStart(lesson){
  const k = lesson.kid, t = teacherOf(k), level = DB.kids[k].level;
  const old = lesson.dg; lesson.dg = {ws:null, ac:null, mic:null, play:[], playEnd:0, muted:!!(old && old.muted), open:false, closing:false, retried:!!(old && old.retried)};
  const d = lesson.dg;
  // the audio context is made now, inside the child's tap (iOS only lets sound start from a tap)
  const ac = recAC(); d.ac = ac; setAudioSession('play-and-record');
  setState('thinking');
  let tok;
  try{ const r = await fetch(RELAY + 'dgtoken', {method:'POST', headers:{'content-type':'application/json', 'apikey':SUPA_KEY}, body:JSON.stringify({t:CLOUD.token})});
    if(!r.ok) throw new Error('dgtoken ' + r.status); tok = (await r.json()).token; }
  catch(e){ dgNote(lesson, 'token ' + (e.message || e)); dgFallback(lesson); return; }
  if(L !== lesson || lesson.dg !== d) return;
  // audio: one context for the microphone (16 kHz PCM to Deepgram) and the teacher's voice (24 kHz PCM from Deepgram)
  let stream;
  // the app's shared mic (it sets the iOS audio session to play-and-record first; a "playback" session refused the mic)
  try{ stream = await micStream(); }
  catch(e){ dgNote(lesson, 'mic ' + (e.name || e) + ' ' + (e.message || '')); if(e && e.name === 'NotAllowedError') alertBox('اسمح للميكروفون من إعدادات سفاري حتى تبدأ الحصة.'); dgFallback(lesson); return; }
  try{ await ac.resume(); }catch(e){}
  d.stream = stream;
  const ws = new WebSocket(DG_URL, ['bearer', tok]); ws.binaryType = 'arraybuffer'; d.ws = ws;
  const fns = [{name:'lesson_event', description:'Internal: used by the app. Never call it yourself.', parameters:{type:'object', properties:{tags:{type:'string', description:'lesson tags'}}, required:['tags']}}];
  ws.onopen = () => {
    ws.send(JSON.stringify({type:'Settings', tags:['hudhud', k],
      audio:{input:{encoding:'linear16', sample_rate:16000}, output:{encoding:'linear16', sample_rate:24000, container:'none'}},
      agent:{
        listen:{provider:{type:'deepgram', version:'v2', model:'flux-general-en', eot_threshold:0.75, eot_timeout_ms:level <= 6 ? 6000 : 5000,
          keyterms:[nick(k)].concat(typeof livePhrases === 'function' ? livePhrases() : []).filter(Boolean).slice(0, 40)}},
        think:{provider:{type:'anthropic', model:'claude-haiku-5-5', temperature:0.8},
          endpoint:{url:RELAY + 'llm', headers:{'x-hh-token':CLOUD.token}},
          prompt:dgPrompt(lesson), functions:fns},
        context:lesson.history.length ? {messages:lesson.history.slice(-30).map(h => ({type:'History', role:h.role, content:String(h.content).replace(/\[[A-Z]+(:[^\]]*)?\]/g, '').replace(/^Student: /, '').trim() || '...'}))} : undefined,
        speak:{provider:{type:'deepgram', model:t.female ? 'aura-2-iris-en' : 'aura-2-aries-en', speed:level <= 6 ? 0.9 : 1.0}}

  ws.onmessage = ev => { if(L !== lesson || lesson.dg !== d) return; if(typeof ev.data !== 'string'){ dgPlay(lesson, ev.data); return; }
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; } dgEvent(lesson, m); };

    else { dgNote(lesson, 'switching to the normal teacher'); dgFallback(lesson); } };

}
/* the microphone starts once Deepgram applied the settings: 16 kHz mono 16-bit PCM in ~40 ms frames */
async function dgMic(lesson){ const d = lesson.dg, ac = d.ac, src = ac.createMediaStreamSource(d.stream), ratio = ac.sampleRate / 16000;

    const all = new Float32Array(carry.length + f.length); all.set(carry); all.set(f, carry.length);
    const n = Math.floor(all.length / ratio), out = new Int16Array(n);
    for(let i = 0; i < n; i++){ const s = Math.max(-1, Math.min(1, all[Math.floor(i * ratio)])); out[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }

  if(lesson.state !== 'speaking'){ setState('speaking'); if(lesson.firstWave){ lesson.firstWave = false; setPose('wave', 2800); } }
  if(ac.state !== 'running'){ try{ ac.resume(); }catch(e){} }
  if(!lesson.mouthT) mouthWalk('abababababababababababababababab', 70); }
function dgHush(lesson){ const d = lesson.dg; d.play.forEach(s => { try{ s.onended = null; s.stop(); }catch(e){} }); d.play = []; d.playEnd = 0; stopMouth(); setMouth('rest'); }
/* the teacher's voice has finished playing */
function dgSpoke(lesson){ const d = lesson.dg; d.audioDone = false; stopMouth(); setMouth('rest'); lesson.tAudioEnd = Date.now();
  if(lesson.endSeen){ finishLesson(); return; }
  setState(d.muted ? 'idle' : 'listening'); lesson.listenStart = Date.now(); }
function dgEvent(lesson, m){ const d = lesson.dg;
  switch(m.type){
    case 'SettingsApplied': d.open = true; dgMic(lesson).catch(e => dgNote(lesson, 'mic ' + e));
      d.ws.send(JSON.stringify({type:'InjectUserMessage', content: lesson.history.length ? '(The student came back to the class. Welcome them back and continue where we were.)' : '(The student just joined the class. Greet them warmly by nickname and start the lesson.)'}));
      break;
    case 'UserStartedSpeaking': dgHush(lesson); setState('listening'); lesson.talking = true; break;
    case 'AgentThinking': setState('thinking'); break;
    case 'AgentStartedSpeaking': lesson.talking = false; break;
    case 'AgentAudioDone': d.audioDone = true; if(!d.play.length) dgSpoke(lesson); break;
    case 'ConversationText': {
      const txt = String(m.content || '').trim(); if(!txt || /^\(/.test(txt)) break;

        const you = $('#you'); if(you){ you.hidden = false; you.classList.remove('note', 'live'); you.textContent = txt; } setState('thinking'); }

/* the same effects as the tags of a normal teacher turn */

/* ---- listening ---- */
function onMicTap(){
  if(!L || L.done) return;
  if(L.dg){ dgMicTap(L); return; }
  // second tap while listening = stop now: send what was said, or (if nothing) stop and wait for the next tap
  if(L.state === 'listening'){ if(!L.rec){ startListening(true); return; } L.manualStop = true; stopListening(true); setState('thinking'); return; }
  if(L.net){ netRetry(L); return; } // waiting for the internet: a tap tries again now
  // a tap while the teacher prepares the reply (often the child's own "I'm done" tap, after the app already sent it)
  // used to cancel the reply, so the teacher never answered: ignore it. Cutting in while he speaks still works (after 2 s).
  if(L.state === 'thinking' && Date.now() - (L.thinkAt || 0) < 15000){ toast('⏳ المعلم يجهّز الرد…'); return; }
  if(L.state === 'speaking' && Date.now() - (L.speakAt || 0) < 2000) return;
  interrupt(true);
}

/* the child's own lines from the history, with the v2 step they were said in (read from the "[step n/N: …]" header of each student message) */
function lessonChildTurns(lesson){ const v = lesson && lesson.v2, out = [];
  ((lesson && lesson.history) || []).forEach(h => { if(h.role !== 'user') return;
    String(h.content || '').split('\n').forEach(line => { const m = line.match(/\]\s*Student: ([\s\S]*)$/); if(!m || !m[1].trim()) return;
      const s = line.match(/\[step (\d+)\/\d+:/), i = s ? Number(s[1]) - 1 : null;
      out.push({text:m[1].trim(), step:i, k:v && i != null && v.steps[i] ? v.steps[i].k : null}); }); });

/* tags the teacher wrote, read from the stored assistant messages (e.g. FLAG, REC) */
function lessonTags(lesson, tag){ const re = new RegExp(`\\[${tag}:([^\\]\\n]+)\\]`, 'gi'), out = [];

/* CSV for Excel: UTF-8 with a BOM (so Arabic opens correctly), CRLF lines, quoted cells; text cells never start with = + - @ */
function pMoneyCSV(){
  const D = pMoneyData(), q = v => { let s = String(v == null ? '' : v); if(typeof v !== 'number' && /^[=+\-@]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }, row = a => a.map(q).join(',');
  const lines = [row(['التاريخ', 'الوقت', 'الطالب', 'العملية', 'المبلغ (ريال)', 'الشهر'])];
  D.rows.slice().reverse().forEach(x => lines.push(row([pISO(x.at), pHM(x.at), DB.kids[x.k].ar, P_MT[x.type][0] + (x.extra ? ' (إضافية)' : ''), x.amount, monthKey(x.at)])));
  lines.push('', row(['المجموع الشهري']), row(['الشهر', 'الشحن', 'خصم الحضور', 'خصم الغياب', 'الصافي']));
  D.mlist.filter(m => P_MM === 'all' || m.mk === P_MM).forEach(m => lines.push(row([m.mk, m.top, m.att, m.miss, m.top - m.att - m.miss])));
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function pMoneyDownload(){

  const url = URL.createObjectURL(new Blob([pMoneyCSV()], {type:'text/csv;charset=utf-8'})), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000); toast('تم تصدير الملف ✓');
}

  if(!k){ const en = ov.querySelector('#f_en'), us = ov.querySelector('#f_user'); let touched = false; us.addEventListener('input', () => touched = true);

        if(ps.length === 1 && new Date(ps[0].from) > new Date()) ps[0] = {from:ps[0].from, days, time}; else ps.push({from:nowLocal(), days, time});

const SKILLS = [['speaking','المحادثة'],['grammar','القواعد'],['vocabulary','المفردات'],['pronunciation','النطق'],['listening','الاستماع'],['reading','القراءة']];
function skillScores(k){
  const p = DB.progress[k], reps = DB.reports.filter(r => r.kid === k).slice(-6), avg = xs => xs.length ? Math.round(xs.reduce((a,b) => a+b, 0)/xs.length) : null;
  const talk = reps.filter(r => r.talkPct != null).map(r => Math.min(100, Math.round(r.talkPct / (Number(r.talkGoal) || talkGoal(k)) * 100)));
  const missions = Object.values(p.missions||{}).map(s => s/3*100);
  const snd = SOUNDS.map(s => soundStat(k, s.id)), sOk = snd.reduce((a,s) => a + s.ok, 0), sN = snd.reduce((a,s) => a + s.n, 0), lOk = snd.reduce((a,s) => a + s.lok, 0), lN = snd.reduce((a,s) => a + s.ln, 0);
  const aloud = (p.aloud||[]).slice(-6).map(a => a.pct);
  const quizzes = (p.quizzes||[]).slice(-8).map(q => q.score/q.total*100);

}

function radarSVG(k, size){
  const s = skillScores(k), n = SKILLS.length, c = size/2, R = size/2 - 46;

   while the teacher is thinking or speaking (never while listening). Everything is flushed when the lesson ends, the room

const paOn = () => hasAz() && !DEMO;
/* record mono PCM from the mic; stops after ~1.2s of silence once speech started, on stopRef.stop(), or at maxMs */
function recordWav(maxMs, onLevel, ctl){ return captureAudio({maxMs, onLevel, ctl, silence:1.2}); }
function downsample(chunks, from, to){
  const len = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  if(from === to) return all; const ratio = from / to, out = new Float32Array(Math.floor(len / ratio));
  for(let i = 0; i < out.length; i++){ const a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio)); let s = 0; for(let j = a; j < b; j++) s += all[j]; out[i] = s / Math.max(1, b - a); }
  return out;
}
function encodeWav(samples, rate){
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf), w = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for(let i = 0; i < samples.length; i++){ const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true); }
  return new Blob([buf], {type:'audio/wav'});
}
async function azAssess(wav, ref){
  const pa = btoa(unescape(encodeURIComponent(JSON.stringify({ReferenceText:ref, GradingSystem:'HundredMark', Granularity:'Phoneme', Dimension:'Comprehensive', EnableMiscue:true}))));
  const au = await azAuth();
  const r = await fetch(`https://${au.region}.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=en-US&format=detailed`,
    {method:'POST', headers:{...au.h, 'Content-Type':'audio/wav; codecs=audio/pcm; samplerate=16000', 'Pronunciation-Assessment':pa, 'Accept':'application/json'}, body:wav});
  if(!r.ok){ const e = new Error('assess ' + r.status); e.status = r.status; throw e; }
  const j = await r.json(), nb = (j.NBest || [])[0];
  if(!nb || j.RecognitionStatus !== 'Success') return {ok:false, status:j.RecognitionStatus || 'NoMatch', acc:0, words:[], text:''};
  const P = nb.PronunciationAssessment || nb;
  return {ok:true, text:nb.Display || '', acc:Math.round(P.AccuracyScore || 0), flu:Math.round(P.FluencyScore || 0), comp:Math.round(P.CompletenessScore || 0), pron:Math.round(P.PronScore || 0),
    words:(nb.Words || []).map(x => { const W = x.PronunciationAssessment || x; return {w:x.Word, acc:Math.round(W.AccuracyScore || 0), err:W.ErrorType || 'None', ph:(x.Phonemes || []).map(p => ({p:p.Phoneme, acc:Math.round((p.PronunciationAssessment || p).AccuracyScore || 0)}))}; })};
}
const PH_TIP = {th:'TH مثل «ث»: طرف اللسان بين الأسنان', dh:'TH مثل «ذ»: اللسان بين الأسنان مع صوت', p:'P: انفخ هواء بدون صوت من الحنجرة', b:'B: صوت من الحنجرة بدون نفخ',
  v:'V: الأسنان على الشفة مع اهتزاز', f:'F: الأسنان على الشفة بدون صوت', ch:'CH مثل «تش»', sh:'SH مثل «ش»', iy:'ee طويلة مثل «إي»', ih:'i قصيرة ومرتخية', ae:'a في cat: افتح فمك أكثر',
  eh:'e في bed', ah:'u في cup: قصيرة ومحايدة', aa:'o في hot: فم مفتوح', r:'R الإنجليزية: لا تلمس سقف الفم باللسان', ng:'NG: من الأنف بدون G واضحة', zh:'ZH مثل j في الفرنسية', w:'W: دوّر شفايفك', l:'L', z:'Z', s:'S', t:'T', d:'D', k:'K', g:'G', er:'ER مثل bird'};
const phColor = a => a >= 80 ? 'good' : a >= 60 ? 'mid' : 'bad';
function assessHTML(res){
  if(!res.ok) return `<div class="qfb bad">ما وصلني كلام واضح. اقترب من الجهاز وقلها بصوت أعلى.</div>`;
  const weak = []; res.words.forEach(w => w.ph.forEach(p => { if(p.acc < 60 && PH_TIP[p.p] && !weak.find(x => x.p === p.p)) weak.push(p); }));
  return `<div class="pa"><div class="pa-top"><b class="num">${res.acc}%</b><span class="small muted">دقة النطق${res.flu ? ` · الطلاقة ${res.flu}%` : ''}${res.comp != null ? ` · الاكتمال ${res.comp}%` : ''}</span></div>
    <div class="pa-words" dir="ltr">${res.words.map(w => `<span class="pa-w ${w.err === 'Omission' ? 'omit' : phColor(w.acc)}"><b>${esc(w.w)}</b><span class="pa-ph">${w.ph.map(p => `<i class="${phColor(p.acc)}" title="${p.acc}%">${esc(p.p)}</i>`).join('')}</span></span>`).join('')}</div>
    ${weak.length ? `<div class="small" style="margin-top:6px">💡 ${weak.slice(0, 2).map(p => `<span class="en">/${esc(p.p)}/</span> ${esc(PH_TIP[p.p])}`).join(' · ')}</div>` : ''}</div>`;
}
/* one-shot UI helper: records, assesses and returns the result (or null on failure) */
async function speakAndAssess(ref, levelEl, maxMs){
  const ctl = {}; levelEl && (levelEl.__stop = () => ctl.stop && ctl.stop());
  const rec = await recordWav(maxMs || 8000, rms => { if(levelEl) levelEl.style.setProperty('--lv', Math.min(1, rms * 8)); }, ctl);

/* =============== 7. STORIES WHERE THE CHILD IS THE HERO =============== */
const NOT_NAMES = new Set(['The','A','An','I','He','She','It','We','They','You','His','Her','My','Our','Their','Then','But','And','So','When','After','Before','One','Every','Suddenly','Grandfather','Grandmother','Grandma','Grandpa','Mum','Mom','Dad','Father','Mother','Uncle','Aunt','Teacher','Mr','Mrs','Ms','Miss','Doctor','Captain','Today','Tomorrow','Yesterday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Eid','Ramadan','Riyadh','Jeddah','Makkah','Madinah','Saudi','Arabia','Red','Sea','English','Arabic','Oh','Wow','Yes','No','Please','Thank','Hello','Hi','What','Why','How','Where','Who','Let','Look','Come','This','That','There','Here','At','In','On','Of','To','With','As','If','Now','Soon','Finally','Later','Once','Mr.','Mrs.']);
function storyNames(book){
  const text = [book.title, ...book.pages.map(p => p.text)].join(' \n ');
  const counts = {}, gender = {};
  const toks = text.split(/\s+/);
  toks.forEach((raw, i) => { const w = raw.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '').replace(/'s$/, ''); if(!/^[A-Z][a-z]{2,}$/.test(w) || NOT_NAMES.has(w)) return;
    counts[w] = (counts[w] || 0) + 1;
    for(let j = i + 1; j < Math.min(toks.length, i + 26); j++){ const t = toks[j].toLowerCase().replace(/[^a-z]/g, '');
      if(t === 'he' || t === 'his' || t === 'him'){ gender[w] = (gender[w] || 0) + 1; break; } if(t === 'she' || t === 'her'){ gender[w] = (gender[w] || 0) - 1; break; } } });
  const lower = new Set(text.toLowerCase().match(/\b[a-z]+\b/g) || []);
  return Object.keys(counts).filter(n => counts[n] >= 2 && !text.includes(' ' + n.toLowerCase() + ' ')).sort((a, b) => counts[b] - counts[a])
    .map(n => ({n, c:counts[n], boy:(gender[n] || 0) > 0 ? true : (gender[n] || 0) < 0 ? false : null}));
}
function personalize(book, k){
  const kid = DB.kids[k]; if(!kid) return book;
  const first = s => String(s || '').trim().split(/\s+/)[0].replace(/[^A-Za-z'-]/g, '');
  const me = first(kid.en); if(!me) return book;
  const names = storyNames(book); if(!names.length) return book;
  const hero = names.find(x => x.boy === !!kid.boy && x.c >= Math.max(2, names[0].c * .5)); if(!hero) return book;
  const map = {[hero.n]: me};
  const sib = kidIds().filter(x => x !== k && DB.kids[x].en).map(x => DB.kids[x])[0];
  if(sib){ const other = names.find(x => x !== hero && x.boy === !!sib.boy); const sn = first(sib.en); if(other && sn && sn !== me) map[other.n] = sn; }
  const re = new RegExp('\\b(' + Object.keys(map).join('|') + ')\\b', 'g'), sw = s => String(s).replace(re, m => map[m]);
  const out = JSON.parse(JSON.stringify(book)); out.title = sw(out.title); out.pages.forEach(p => p.text = sw(p.text));
  (out.questions || []).forEach(q => { Object.keys(q).forEach(f => { if(typeof q[f] === 'string') q[f] = sw(q[f]); else if(Array.isArray(q[f])) q[f] = q[f].map(x => typeof x === 'string' ? sw(x) : x); }); });
  out.__hero = map; return out;
}

function reviewItems(k){
  const since = Date.now() - 45 * DAY, cnt = {};
  DB.reports.filter(r => r.kid === k && Date.parse(r.at) >= since).forEach(r => (r.mistakes || []).forEach(m => { const s = String(m.right || '').trim(); const n = s.split(/\s+/).length; if(n >= 3 && n <= 11) cnt[s] = cnt[s] || {right:s, wrong:m.wrong, n:0}, cnt[s].n++; }));
  let items = Object.values(cnt).sort((a, b) => b.n - a.n).slice(0, 5);
  if(items.length < 5) Object.values(DB.progress[k].srs || {}).filter(c => (c.box || 0) <= 1 && c.f.split(/\s+/).length >= 3 && c.f.split(/\s+/).length <= 11 && !items.find(x => x.right === c.f))
    .slice(0, 5 - items.length).forEach(c => items.push({right:c.f, wrong:String(c.b || '').replace(/^كنت تقول: /, ''), n:1}));
  return items;
}
function reviewDue(k){
  const last = (DB.reviews || []).filter(r => r.kid === k).map(r => Date.parse(r.at)).sort().pop() || 0;
  const att = DB.attendance.filter(a => a.kid === k && Date.parse(a.at) > last).length;
  return att >= 4 && Date.now() - last > 25 * DAY && reviewItems(k).length >= 3;
