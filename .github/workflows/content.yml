name: Generate content
on:
  workflow_dispatch:
    inputs:
      levels:
        description: 'Levels, e.g. 1-20 or 5,8'
        default: '1-20'
      stories:
        description: 'Stories per level'
        default: '15'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEVELS: ${{ github.event.inputs.levels }}
          STORIES: ${{ github.event.inputs.stories }}
        run: node content/generate.mjs
      - name: Save content
        if: always()
        run: |
          git config user.name "51telk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Generated learning content" && git pull --rebase && git push)
